    /** جدول معاينة الصفوف الصحيحة/الخاطئة (مسار Excel فقط — يحمل row/valid/error/lat/lng من الخادم). CSV يبقى بالملخّص المختصر فقط، بلا تحقّق مسبق للصف. */
    /** يصنّف كل صف: مطابق مؤكَّد (مرفوض دائمًا) / مطابق محتمل (يُقبل مع تنبيه) / سجل جديد. */
    function bulkMatchTierBadge(row) {
      if (row.matchTier === 'confirmed') return '<span class="status bad">⛔ مطابق مؤكَّد — لن يُستورَد</span>';
      if (row.matchTier === 'possible') return '<span class="status warn">⚠ مطابق محتمل — راجع قبل الاعتماد</span>';
      return '';
    }

    function renderBulkPreviewTable(rows) {
      if (!rows || !rows.length) return '';
      var items = rows.slice(0, 200).map(function (row) {
        var hasCoords = row.lat !== undefined && row.lat !== '' && row.lng !== undefined && row.lng !== '';
        var coordsLabel = hasCoords ? (row.lat + '، ' + row.lng) : '—';
        var ok = row.valid !== false;
        var statusText = ok ? (row.matchTier === 'possible' ? 'جاهز للاستيراد — يحتاج مراجعة تكرار محتمل' : 'جاهز للاستيراد') : (row.error || 'خطأ غير محدَّد');
        return '<div class="row-item"><div><strong>صف ' + esc(String(row.row || '')) + ' — ' + esc(row.name || '') + '</strong>'
          + '<small>الإحداثيات المقروءة: ' + esc(coordsLabel) + '</small></div>'
          + '<div class="muted">' + esc(statusText) + (row.possibleDuplicateId ? ' (السجل المشابه: ' + esc(row.possibleDuplicateId) + ')' : '') + '</div>'
          + bulkMatchTierBadge(row)
          + '<span class="status ' + (ok ? 'good' : 'bad') + '">' + (ok ? '✓ صحيح' : '✗ خاطئ') + '</span></div>';
      }).join('');
      var moreNote = rows.length > 200 ? '<p class="muted">وعرض أول 200 صف فقط من ' + fmt(rows.length) + '.</p>' : '';
      return '<div class="bulk-preview"><div class="rows">' + items + '</div></div>' + moreNote;
    }

    function setBulkSummary(message) {
      var node = $('#bulkSummary');
      if (node) node.textContent = message;
    }

    function handleBulkFile(input) {
      var file = input && input.files ? input.files[0] : null;
      if (!file) return;
      state.pendingRows = [];
      var reader = new FileReader();
      var lower = String(file.name || '').toLowerCase();

      if (lower.slice(-4) === '.csv') {
        reader.onload = function () {
          try {
            state.pendingRows = parseCsv(reader.result);
            setBulkSummary('السجلات الجاهزة: ' + fmt(state.pendingRows.length) + ' · السجلات الخاطئة: 0'
              + ' — سيتحقق الخادم من كل صف عند الاستيراد (ملف CSV بلا معاينة مسبقة للأخطاء).');
          } catch (error) {
            state.pendingRows = [];
            setBulkSummary(error.message || 'تعذر قراءة ملف CSV.');
          }
        };
        reader.onerror = function () { setBulkSummary('تعذر قراءة الملف.'); };
        reader.readAsText(file, 'UTF-8');
        return;
      }

      setBulkSummary('جارٍ مراجعة ملف Excel على الخادم…');
      reader.onload = function () {
        busy(true);
        api('inspectBeneficiaryExcel', state.token, {dataUrl: reader.result, name: file.name})
          .then(function (result) {
            var rows = result.rows || [];
            // لا تُستورَد الصفوف الخاطئة إطلاقًا: فقط الصفوف الصحيحة تُرسَل
            // فعليًا لـ importBeneficiaries — الخاطئة تبقى معروضة في
            // المعاينة برقم صفها وسبب رفضها دون إدخالها.
            state.pendingRows = rows.filter(function (row) { return row.valid !== false; });
            var preview = $('#bulkPreview');
            if (preview) preview.innerHTML = renderBulkPreviewTable(rows);
            setBulkSummary('الصحيحة: ' + fmt(result.validCount) + ' · الخاطئة: ' + fmt(result.errorCount)
              + (result.errorCount ? ' — الصفوف الخاطئة موضَّحة أدناه ولن تُستورَد؛ يمكنك المتابعة باستيراد الصحيحة فقط.' : ''));
          }, function (error) {
            state.pendingRows = [];
            reportError(error);
            setBulkSummary('تعذر مراجعة الملف.');
          }).finally(function () { busy(false); });
      };
      reader.onerror = function () { setBulkSummary('تعذر قراءة الملف.'); };
      reader.readAsDataURL(file);
    }

    /** ترتيب الأعمدة هنا يطابق columns في parseCsv بالضبط — أي تعديل هناك يجب أن يُعكَس هنا أيضًا. */
    var IMPORT_TEMPLATE_HEADERS = ['الاسم', 'المنطقة', 'المدينة', 'العنوان', 'الجوال', 'عدد الأفراد',
      'الضمان الاجتماعي', 'الحالة الاجتماعية', 'الدخل', 'الاحتياج', 'الملاحظات', 'خط العرض', 'خط الطول', 'علامة مميزة'];
    var IMPORT_TEMPLATE_EXAMPLE = ['سارة العتيبي', 'الرياض', 'الرياض', 'حي النرجس، شارع الأمير', '0501234567', '4',
      'نعم', 'أرملة', '2500', 'ثلاجة، غسالة', 'يفضّل التسليم صباحًا', '24.7136', '46.6753', 'بجانب المسجد'];

    function csvCell(value) {
      var text = String(value == null ? '' : value);
      return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
    }

    /** نص CSV القالب — بادئة BOM لضمان فتح Excel للعربية بترميز صحيح دون خطوات يدوية إضافية. */
    function buildImportTemplateCsv() {
      return '﻿' + [IMPORT_TEMPLATE_HEADERS, IMPORT_TEMPLATE_EXAMPLE]
        .map(function (row) { return row.map(csvCell).join(','); }).join('\r\n');
    }

    function downloadImportTemplate() {
      if (typeof Blob === 'undefined' || typeof URL === 'undefined' || !URL.createObjectURL) {
        toast('تنزيل القالب غير مدعوم في هذا المتصفح — انسخ أسماء الأعمدة من التعليمات أعلاه يدويًا.', 'error');
        return;
      }
      var blob = new Blob([buildImportTemplateCsv()], {type: 'text/csv;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = 'قالب-استيراد-المستفيدين.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    /**
     * قالب Excel حقيقي (.xlsx) يُبنى بالكامل على الخادم ويُطلَب فقط عند
     * ضغط هذا الزر — لا مكتبة تُحمَّل هنا ولا في أي مكان آخر من الواجهة؛
     * التوليد بايتات جاهزة من Utilities.zip داخل Apps Script نفسه.
     */
    function downloadImportTemplateXlsx() {
      busy(true);
      api('downloadBeneficiaryImportTemplateXlsx', state.token).then(function (result) {
        var link = document.createElement('a');
        link.href = result.dataUrl;
        link.download = result.filename || 'قالب-استيراد-المستفيدين.xlsx';
        document.body.appendChild(link);
        link.click();
        link.remove();
      }, reportError).finally(function () { busy(false); });
    }

    function parseCsv(text) {
      var lines = String(text).replace(/^﻿/, '').split(/\r?\n/).filter(function (line) {
        return String(line).trim() !== '';
      });
      if (lines.length < 2) throw new Error('الملف لا يحتوي على سجلات تحت صف العناوين.');
      // lat/lng والعلامة المميزة أعمدة اختيارية بالكامل في نهاية الترتيب —
      // ملف CSV قديم بلا هذه الأعمدة يبقى يعمل تمامًا كما كان (الخلايا
      // الزائدة تبقى فارغة).
      var columns = ['name', 'region', 'city', 'address', 'phone', 'familyCount',
        'socialSecurity', 'socialStatus', 'income', 'needs', 'notes', 'lat', 'lng', 'landmark'];
      return lines.slice(1).map(function (line) {
        var cells = line.split(',').map(function (cell) {
          return cell.trim().replace(/^"|"$/g, '');
        });
        var row = {};
        columns.forEach(function (key, index) { row[key] = cells[index] || ''; });
        return row;
      });
    }

    function runImport() {
      var pledge = $('#bulkPledge');
      if (!state.pendingRows.length) { toast('لا توجد سجلات صحيحة جاهزة للاستيراد بعد.', 'error'); return; }
      if (!pledge || !pledge.checked) { toast('يجب الموافقة على التعهّد قبل الاستيراد.', 'error'); return; }
      busy(true);
      api('importBeneficiaries', state.token, state.pendingRows, true).then(function (result) {
        if (!result.ok) {
          var details = (result.errors || []).map(function (item) {
            return 'صف ' + item.row + ': ' + item.message;
          }).join(' | ');
          setBulkSummary('الصحيحة: ' + fmt(result.validCount) + ' · الخاطئة: ' + fmt(result.errorCount)
            + (details ? ' — ' + details : ''));
          toast('الاستيراد متوقف: صحّح السجلات الخاطئة أولًا.', 'error');
          return;
        }
        mergeSummary(result);
        closeModal();
        render();
        toast('تم استيراد ' + fmt(result.imported) + ' مستفيدًا.', 'success');
        // الاستيراد الجماعي لا يعيد السجلات المستورَدة كاملة (قد تصل لألف
        // سجل) — إعادة جلب Bootstrap هنا عملية واحدة نادرة ومقبولة، أفضل
        // من تضخيم استجابة كل استيراد بمئات الكائنات المكرَّرة أصلًا.
        api('getBootstrapData', state.token, true).then(function (data) { state.data = data; render(); }, function () {});
      }, reportError).finally(function () { busy(false); });
    }

    /* ============================================================
       8) الجمعيات
       ============================================================ */

    var ASSOCIATION_STATUS_FILTERS = ['نشطة', 'غير نشطة'];

    /** مُرقَّمة خادميًا (listAssociations، للإدارة فقط) — بحث/فلترة حالة/ترتيب من الخادم. */
    function renderAssociations() {
      var bundle = state.lazy.associations || {};
      if (bundle.loading) return skeletonCards(4);
      var hasQuery = !!(state.search || state.filter);
      if (!bundle.total) {
        return emptyState({
          glyph: hasQuery ? '⌕' : ICONS.associations,
          title: hasQuery ? 'لا نتائج مطابقة' : 'لا توجد جمعيات مسجّلة',
          body: hasQuery ? 'جرّب كلمة بحث أو فلترة أخرى.' : 'أضف الجمعية المشاركة الأولى وأنشئ حسابها لتبدأ بإدخال مستفيديها.',
          action: hasQuery ? '' : 'new-association', actionLabel: '＋ إضافة جمعية'
        });
      }
      var items = bundle.items || [];
      var body = '<div class="cards">' + items.map(function (a) {
        return '<article class="card"><div class="card-head"><div><h3>' + esc(a.name) + '</h3>'
          + '<p>' + esc(a.category || 'جمعية أهلية') + ' · ' + esc(a.city) + '</p></div>' + ring(a.progress) + '</div>'
          + '<div class="metas">'
          + '<div class="meta"><small>الحالة</small><strong>' + esc(a.status || '—') + '</strong></div>'
          + '<div class="meta"><small>المستفيدون</small><strong>' + fmt(a.beneficiaries) + '</strong></div>'
          + '<div class="meta"><small>الأجهزة المعتمدة</small><strong>' + fmt(a.approvedDevices) + '</strong></div>'
          + '<div class="meta"><small>المسلّمة</small><strong>' + fmt(a.deliveredDevices) + '</strong></div></div>'
          + '<div class="card-actions">'
          + '<button class="btn btn-ghost btn-sm" data-act="view-association" data-id="' + esc(a.id) + '">صفحة الجمعية</button>'
          + '<button class="btn btn-soft btn-sm" data-act="edit-association" data-id="' + esc(a.id) + '">تعديل</button>'
          + '</div></article>';
      }).join('') + '</div>';

      return toolbar({
        placeholder: 'ابحث باسم الجمعية أو المدينة أو المنطقة…',
        filters: optionList(ASSOCIATION_STATUS_FILTERS, state.filter, 'كل الحالات'),
        sortFields: [['name', 'الاسم'], ['city', 'المدينة'], ['progress', 'نسبة الإنجاز']],
        count: fmt(bundle.total || 0) + ' جمعية'
      }) + body + pagerControls('associations', bundle);
    }

    function findApplication(id) {
      var list = (state.lazy.applications && state.lazy.applications.items) || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    /** تُجلب مُرقَّمة عند فتح الصفحة (listApplications) — لا ضمن Bootstrap. */
    /** شارة صلاحية الترخيص — مقارنة نصية آمنة بصيغة yyyy/MM/dd الموحَّدة في النظام، بلا أي اعتماد على تحليل Date هش. */
    function licenseBadge(licenseExpiry) {
      if (!licenseExpiry) return '';
      var today = new Date();
      var todayStr = today.getFullYear() + '/' + String(today.getMonth() + 1).padStart(2, '0') + '/' + String(today.getDate()).padStart(2, '0');
      var expired = licenseExpiry < todayStr;
      return '<span class="badge ' + (expired ? 'badge-warn' : 'badge-ok') + '">' + (expired ? 'الترخيص منتهٍ' : 'الترخيص ساري') + '</span>';
    }

    function renderApplications() {
      var bundle = state.lazy.applications || {};
      var items = bundle.items || [];
      if (bundle.loading) return skeletonCards(3);
      if (!bundle.total) {
        return emptyState({glyph: ICONS.applications, title: 'لا توجد طلبات انضمام',
          body: 'ستظهر هنا طلبات الجمعيات الجديدة فور تقديمها من صفحة تسجيل الدخول العامة.'});
      }
      var filters = optionList(APPLICATION_STATUSES, state.filter, 'كل الحالات');
      var body = items.length ? '<div class="cards">' + items.map(function (a) {
        return '<article class="card"><div class="card-head"><div><h3>' + esc(a.name) + '</h3>'
          + '<p>' + esc(a.sector || a.category || '—') + ' · ' + esc(a.region) + ' · ' + esc(a.city) + '</p></div>' + statusChip(a.status) + '</div>'
          + '<div class="metas">'
          + '<div class="meta"><small>رقم الترخيص</small><strong class="mono">' + esc(a.licenseNumber || '—') + '</strong></div>'
          + '<div class="meta"><small>انتهاء الترخيص</small><strong>' + esc(a.licenseExpiry || '—') + ' ' + licenseBadge(a.licenseExpiry) + '</strong></div>'
          + '<div class="meta"><small>المسؤول</small><strong>' + esc(a.contactName) + '</strong></div>'
          + '<div class="meta"><small>نتيجة أسئلة القبول</small><strong>' + esc(a.score || '—') + '</strong></div>'
          + '<div class="meta"><small>التاريخ</small><strong>' + esc(a.submittedAt) + '</strong></div></div>'
          + '<div class="card-actions">'
          + '<button class="btn btn-ghost btn-sm" data-act="view-application" data-id="' + esc(a.id) + '">التفاصيل</button>'
          + (a.hasLicenseFile ? '<button class="btn btn-ghost btn-sm" data-act="view-license" data-id="' + esc(a.id) + '">عرض الترخيص</button>' : '')
          + (a.status === 'قيد المراجعة'
            ? '<button class="btn btn-primary btn-sm" data-act="accept-application" data-id="' + esc(a.id) + '">قبول</button>'
              + '<button class="btn btn-soft btn-sm" data-act="reject-application" data-id="' + esc(a.id) + '">رفض</button>'
            : '')
          + '</div></article>';
      }).join('') + '</div>'
        : emptyState({glyph: '⌕', title: 'لا نتائج مطابقة', body: 'جرّب تصفية أو كلمة بحث أخرى.'});

      return toolbar({placeholder: 'ابحث باسم الجمعية أو البريد أو الجوال أو رقم الترخيص…', filters: filters,
        count: fmt(bundle.total || 0) + ' طلبًا'}) + body + pagerControls('applications', bundle);
    }

    function viewApplication(id) {
      var a = findApplication(id);
      if (!a) { toast('تعذر العثور على الطلب.', 'error'); return; }
      var answers = '<div class="review-answers">' + (a.answers || []).map(function (ans) {
        return '<span class="tag' + (ans.value === 'لا' ? ' no' : '') + '">' + esc(ans.label) + ': ' + esc(ans.value || '—') + '</span>';
      }).join('') + '</div>';
      var body = '<div class="card-head"><div><h3>' + esc(a.name) + '</h3>'
        + '<p class="mono">' + esc(a.id) + '</p></div>' + statusChip(a.status) + '</div>'
        + '<div class="metas">'
        + '<div class="meta"><small>مجال العمل</small><strong>' + esc(a.sector || a.category || '—') + '</strong></div>'
        + '<div class="meta"><small>الموقع</small><strong>' + esc(a.region) + ' · ' + esc(a.city) + '</strong></div>'
        + '<div class="meta"><small>رقم الترخيص</small><strong class="mono">' + esc(a.licenseNumber || '—') + '</strong></div>'
        + '<div class="meta"><small>انتهاء الترخيص</small><strong>' + esc(a.licenseExpiry || '—') + ' ' + licenseBadge(a.licenseExpiry) + '</strong></div>'
        + '<div class="meta"><small>المسؤول</small><strong>' + esc(a.contactName) + '</strong></div>'
        + '<div class="meta"><small>التواصل</small><strong dir="ltr" class="mono">' + esc(a.phone) + '</strong></div>'
        + '<div class="meta"><small>البريد</small><strong dir="ltr" class="mono">' + esc(a.email) + '</strong></div>'
        + '<div class="meta"><small>نتيجة أسئلة القبول</small><strong>' + esc(a.score || '—') + '</strong></div>'
        + '<div class="meta"><small>تاريخ التقديم</small><strong>' + esc(a.submittedAt) + '</strong></div>'
        + '<div class="meta"><small>الإقرار</small><strong>' + (a.pledgeAccepted ? 'تمّت الموافقة — ' + esc(a.pledgedAt) : 'غير موافَق عليه') + '</strong></div></div>'
        + '<h4 style="margin:18px 0 8px;color:var(--zad-800)">إجابات أسئلة القبول</h4>' + answers
        + (a.notes ? '<h4 style="margin:18px 0 8px;color:var(--zad-800)">ملاحظات مقدّم الطلب</h4><p>' + esc(a.notes) + '</p>' : '')
        + (a.status === 'مرفوض' ? '<h4 style="margin:18px 0 8px;color:var(--zad-800)">سبب الرفض</h4><p>' + esc(a.rejectionReason) + '</p>' : '')
        + (a.status === 'مقبول' ? '<p class="hint">تم إنشاء الجمعية برقم ' + esc(a.resultingAssociationId) + '</p>' : '');
      var footer = (a.hasLicenseFile ? '<button class="btn btn-ghost" data-act="view-license" data-id="' + esc(a.id) + '">عرض صورة الترخيص</button>' : '')
        + (a.status === 'قيد المراجعة'
          ? '<button class="btn btn-ghost" data-act="close-modal">إغلاق</button>'
            + '<button class="btn btn-soft" data-act="reject-application" data-id="' + esc(a.id) + '">رفض</button>'
            + '<button class="btn btn-primary" data-act="accept-application" data-id="' + esc(a.id) + '">قبول وإنشاء الجمعية</button>'
          : '<button class="btn btn-ghost" data-act="close-modal">إغلاق</button>');
      openModal('طلب انضمام جمعية', body, footer);
    }

    /** يجلب صورة الترخيص فقط عند الضغط الصريح (لا تحميل تلقائي) — كل عرض يُسجَّل في سجل العمليات على الخادم. */
    function viewLicenseFile(id) {
      busy(true);
      api('getApplicationLicenseFile', state.token, id).then(function (result) {
        openModal('صورة الترخيص', '<img src="' + esc(result.dataUrl) + '" alt="صورة الترخيص المرفقة" style="max-width:100%;border-radius:var(--r-md);display:block;margin:0 auto">',
          '<button class="btn btn-ghost" data-act="close-modal">إغلاق</button>');
      }, reportError).finally(function () { busy(false); });
    }

    function rejectApplicationModal(id) {
      var a = findApplication(id);
      if (!a) { toast('تعذر العثور على الطلب.', 'error'); return; }
      var body = '<form id="rejectForm" class="form-grid" novalidate>'
        + '<div class="field span-2"><label for="f_reason">سبب الرفض</label>'
        + '<textarea class="control" id="f_reason" name="reason" maxlength="300" required></textarea>'
        + '<span class="hint">سيظهر هذا السبب في سجل الطلب.</span></div></form>';
      openModal('رفض طلب: ' + a.name, body,
        '<button class="btn btn-ghost" data-act="close-modal">إلغاء</button>'
        + '<button class="btn btn-primary" data-act="save-reject-application" data-id="' + esc(id) + '">تأكيد الرفض</button>');
    }

    function decideApplication(id, decision) {
      var payload = {};
      if (decision === 'reject') {
        var form = $('#rejectForm');
        if (!form || !form.reportValidity()) return;
        payload.reason = new FormData(form).get('reason');
      } else if (!window.confirm('تأكيد قبول الطلب؟ سيتم إنشاء سجل الجمعية وحساب دخولها فورًا.')) {
        return;
      }
      var opKey = 'accept-application:' + id;
      var opId = decision === 'accept' ? opIdFor(opKey) : undefined;
      busy(true);
      api('reviewAssociationApplication', state.token, id, decision, payload.reason || '', opId).then(function (result) {
        clearOpId(opKey);
        if (state.lazy.applications && state.lazy.applications.items) upsertRecord(state.lazy.applications.items, result.record);
        mergeSummary(result);
        closeModal();
        render();
        if (decision === 'accept') {
          upsertEntity('associations', {
            id: result.associationId, name: result.record.name, category: result.record.category,
            region: result.record.region, city: result.record.city, phone: result.record.phone,
            email: result.record.email, status: 'نشطة', beneficiaries: 0, delegates: 0,
            approvedDevices: 0, receivedDevices: 0, deliveredDevices: 0, progress: 0
          });
          openModal('تم إنشاء الجمعية',
            '<p>تم قبول الطلب وإنشاء حساب الجمعية بنجاح.</p>'
            + '<div class="metas"><div class="meta"><small>رقم الجمعية</small><strong class="mono">' + esc(result.associationId) + '</strong></div>'
            + '<div class="meta"><small>كلمة المرور المؤقتة</small><strong class="mono" dir="ltr">' + esc(result.temporaryPassword) + '</strong></div></div>'
            + '<p class="hint">سلّم هذه الكلمة لمسؤول الجمعية عبر قناة آمنة الآن — لن تُعرض مرة أخرى. يُنصح بتغييرها من داخل النظام بعد أول دخول.</p>',
            '<button class="btn btn-primary" data-act="close-modal">تم</button>');
        } else {
          toast('تم رفض الطلب.', 'success');
        }
      }, reportError).finally(function () { busy(false); });
    }

    function findAssociation(id) {
      var list = state.data.associations || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    /** يفتح قائمة مُقيَّدة بجمعية معيَّنة (الإدارة فقط) عبر فلتر الجمعية العام، ويغلق أي نافذة مفتوحة أولًا. */
    function goToAssociationScope(page, associationId) {
      closeModal();
      goTo(page, '', associationId);
    }

    /** صفحة تفاصيل الجمعية: البيانات الأساسية، عيّنة من المستفيدين والمناديب، وروابط للقوائم الكاملة مفلترة بهذه الجمعية. */
    function viewAssociation(id) {
      var a = findAssociation(id);
      if (!a) { toast('تعذر العثور على الجمعية.', 'error'); return; }
      var isAdmin = state.data.role === 'ADMIN';
      var ownBeneficiaries = (state.data.beneficiaries || []).filter(function (b) { return b.associationId === id; });
      var ownDelegates = (state.data.delegates || []).filter(function (d) { return d.associationId === id; });

      var beneficiariesList = ownBeneficiaries.length
        ? '<div class="rows">' + ownBeneficiaries.slice(0, 5).map(function (b) {
            return '<div class="row-item"><div><strong>' + esc(b.name) + '</strong><small>' + esc(b.city) + '</small></div>'
              + statusChip(b.deliveryStatus) + '</div>';
          }).join('') + '</div>'
        : '<p class="muted" style="font-size:13px">لا يوجد مستفيدون مسجَّلون لهذه الجمعية بعد.</p>';
      var delegatesList = ownDelegates.length
        ? '<div class="rows">' + ownDelegates.slice(0, 5).map(function (d) {
            return '<div class="row-item"><div><strong>' + esc(d.name) + '</strong><small dir="ltr">' + esc(d.phone) + '</small></div>'
              + statusChip(d.status) + '</div>';
          }).join('') + '</div>'
        : '<p class="muted" style="font-size:13px">لا يوجد مناديب مسجَّلون لهذه الجمعية بعد.</p>';

      var body = '<div class="card-head"><div><h3>' + esc(a.name) + '</h3>'
        + '<p class="mono">' + esc(a.id) + '</p></div>' + statusChip(a.status) + '</div>'
        + '<div class="metas">'
        + '<div class="meta"><small>التصنيف</small><strong>' + esc(a.category || '—') + '</strong></div>'
        + '<div class="meta"><small>الموقع</small><strong>' + esc(a.region) + ' · ' + esc(a.city) + '</strong></div>'
        + '<div class="meta"><small>التواصل</small><strong dir="ltr" class="mono">' + esc(a.phone) + '</strong></div>'
        + '<div class="meta"><small>البريد</small><strong dir="ltr" class="mono">' + esc(a.email) + '</strong></div>'
        + '<div class="meta"><small>المستفيدون</small><strong>' + fmt(a.beneficiaries) + '</strong></div>'
        + '<div class="meta"><small>المناديب</small><strong>' + fmt(a.delegates) + '</strong></div>'
        + '<div class="meta"><small>المعتمدة / المستلمة</small><strong>' + fmt(a.approvedDevices) + ' / '
        + fmt(a.receivedDevices) + '</strong></div>'
        + '<div class="meta"><small>المسلّمة</small><strong>' + fmt(a.deliveredDevices) + '</strong></div></div>'
        + '<h4 style="margin:18px 0 8px;color:var(--zad-800)">نسبة إنجاز التسليم</h4>' + bar(a.progress)
        + '<div class="panel-head" style="margin-top:18px"><div><h4 style="color:var(--zad-800)">المستفيدون</h4></div>'
        + (isAdmin ? '<button type="button" class="btn btn-link" data-act="assoc-scope" data-page="beneficiaries" data-id="' + esc(a.id) + '">عرض الكل ←</button>' : '') + '</div>'
        + beneficiariesList
        + '<div class="panel-head" style="margin-top:18px"><div><h4 style="color:var(--zad-800)">المناديب</h4></div>'
        + (isAdmin ? '<button type="button" class="btn btn-link" data-act="assoc-scope" data-page="delegates" data-id="' + esc(a.id) + '">عرض الكل ←</button>' : '') + '</div>'
        + delegatesList;

      var footer = '<button class="btn btn-ghost" data-act="close-modal">إغلاق</button>';
      if (isAdmin) {
        footer += '<button class="btn btn-link" data-act="assoc-scope" data-page="devices" data-id="' + esc(a.id) + '">الأجهزة ←</button>'
          + '<button class="btn btn-link" data-act="assoc-scope" data-page="audit" data-id="' + esc(a.id) + '">سجل العمليات ←</button>'
          + '<button class="btn btn-soft" data-act="edit-association" data-id="' + esc(a.id) + '">تعديل البيانات</button>'
          + '<button class="btn btn-danger" data-act="reset-association-password" data-id="'
          + esc(a.id) + '" data-name="' + esc(a.name) + '">إعادة تعيين كلمة المرور</button>';
      }
      openModal('صفحة الجمعية', body, footer);
    }

    function resetAssociationPasswordModal(id, name) {
      openModal('إعادة تعيين كلمة مرور: ' + name,
        '<p>سيتم إنشاء كلمة مرور مؤقتة جديدة لحساب دخول هذه الجمعية، وستُقطع فورًا كل جلساتها المفتوحة حاليًا،'
        + ' وستُجبر الجمعية على تغيير الكلمة المؤقتة عند أول دخول تالٍ.</p>'
        + '<p class="hint">استخدم هذا الإجراء فقط عند ضياع كلمة المرور أو الاشتباه في اختراق الحساب — لا رجوع عن قطع الجلسات الحالية.</p>',
        '<button class="btn btn-ghost" data-act="close-modal">إلغاء</button>'
        + '<button class="btn btn-danger" data-act="confirm-reset-association-password" data-id="'
        + esc(id) + '" data-name="' + esc(name) + '">تأكيد إعادة التعيين</button>');
    }

    function confirmResetAssociationPassword(id, name) {
      busy(true);
      api('resetAssociationPassword', state.token, id).then(function (result) {
        closeModal();
        showSecretReveal('تم إنشاء كلمة مرور مؤقتة: ' + name, 'كلمة المرور المؤقتة', result.temporaryPassword,
          'سلّمها لمسؤول الجمعية عبر قناة آمنة الآن — لن تُعرض مرة أخرى. إن ضاعت، أعد تعيين كلمة مرور جديدة بدل محاولة استرجاع هذه.'
          + ' الجمعية ستُطالَب بتغييرها فور تسجيل الدخول بها.');
        toast('تم إعادة تعيين كلمة مرور الجمعية.', 'success');
      }, reportError).finally(function () { busy(false); });
    }

    function associationForm(id) {
      var a = (id && findAssociation(id)) || {};
      var isEdit = Boolean(id);
      var credentials = isEdit ? '' : '<div class="field span-2"><label for="f_password">كلمة مرور حساب الجمعية</label>'
        + '<input class="control" id="f_password" name="password" type="password" dir="ltr" minlength="10" required>'
        + '<span class="hint">١٠ خانات على الأقل، وتضم حروفًا وأرقامًا. سلّمها لمسؤول الجمعية عبر قناة آمنة.</span></div>';
      var body = '<form id="associationForm" class="form-grid" novalidate>'
        + '<input type="hidden" name="id" value="' + esc(id || '') + '">'
        + textField('name', 'اسم الجمعية', a.name, {required: true, max: 150, span: true})
        + associationCategoryField(a.category)
        + '<div class="field"><label for="f_status">الحالة</label>'
        + '<select class="control" id="f_status" name="status">'
        + '<option value="نشطة"' + (a.status === 'غير نشطة' ? '' : ' selected') + '>نشطة</option>'
        + '<option value="غير نشطة"' + (a.status === 'غير نشطة' ? ' selected' : '') + '>غير نشطة</option>'
        + '</select></div>'
        + regionCityFields(a.region, a.city, 'f')
        + textField('phone', 'رقم التواصل', a.phone, {required: true, ltr: true})
        + '<div class="field"><label for="f_email">البريد الإلكتروني</label>'
        + '<input class="control" id="f_email" name="email" type="email" dir="ltr" value="' + esc(a.email || '')
        + '" required></div>' + credentials + '</form>';
      openModal(isEdit ? 'تعديل بيانات الجمعية' : 'إضافة جمعية',
        body,
        '<button class="btn btn-ghost" data-act="close-modal">إلغاء</button>'
        + '<button class="btn btn-primary" data-act="save-association">'
        + (isEdit ? 'حفظ التعديلات' : 'إنشاء الجمعية وحسابها') + '</button>');
    }

    function saveAssociation() {
      var form = $('#associationForm');
      if (!form || !form.reportValidity()) return;
      var data = new FormData(form);
      var payload = {
        id: data.get('id') || '',
        name: data.get('name'),
        category: data.get('category'),
        region: data.get('region'),
        city: data.get('city'),
        phone: data.get('phone'),
        email: data.get('email'),
        status: data.get('status')
      };
      if (data.get('password')) payload.password = data.get('password');
      var opKey = 'new-association';
      if (!payload.id) payload.opId = opIdFor(opKey);
      busy(true);
      api('saveAssociation', state.token, payload).then(function (result) {
        clearOpId(opKey);
        upsertEntity('associations', result.record);
        mergeSummary(result);
        closeModal();
        render();
        toast('تم حفظ بيانات الجمعية.', 'success');
      }, reportError).finally(function () { busy(false); });
    }

    /* ============================================================
       9) الأجهزة
       ============================================================ */

    /** عنوان عمود قابل للنقر للترتيب (لجداول <table> فقط — البطاقات تستخدم قائمة "ترتيب حسب" بدلًا منه). */
    function sortableTh(field, label) {
      var active = state.sortBy === field;
      var arrow = active ? (state.sortDir === 'desc' ? ' ↓' : ' ↑') : '';
      return '<th><button type="button" class="th-sort' + (active ? ' active' : '') + '" data-act="th-sort" data-field="'
        + esc(field) + '">' + esc(label) + arrow + '</button></th>';
    }

    /** مُرقَّمة خادميًا (listDevices) — بحث/فلترة حالة/فلتر جمعية (إدارة)/ترتيب بعناوين الأعمدة، كلها من الخادم. */
    function renderDevices() {
      var bundle = state.lazy.devices || {};
      var isAdmin = state.data.role === 'ADMIN';
      if (bundle.loading) return skeletonCards(4);
      var hasQuery = !!(state.search || state.filter || state.assocFilter);
      if (!bundle.total) {
        return emptyState({
          glyph: hasQuery ? '⌕' : ICONS.devices,
          title: hasQuery ? 'لا نتائج مطابقة' : 'لا توجد أجهزة مسجّلة',
          body: hasQuery ? 'جرّب تعديل البحث أو الفلتر.'
            : (isAdmin ? 'أضف الأجهزة إلى المستودع ثم خصّصها للجمعيات والمستفيدين.' : 'لم تُعتمد أجهزة لجمعيتك بعد.'),
          action: !hasQuery && isAdmin ? 'new-device' : '', actionLabel: '＋ إضافة جهاز'
        });
      }
      var items = bundle.items || [];
      var rows = items.map(function (device) {
        var beneficiary = findBeneficiary(device.beneficiaryId);
        return '<tr><td><strong>' + needGlyph(device.name) + ' ' + esc(device.name) + '</strong></td>'
          + '<td class="mono">' + esc(device.id) + '</td>'
          + '<td>' + esc(device.type) + '</td>'
          + '<td>' + esc(associationName(device.associationId)) + '</td>'
          + '<td>' + esc(beneficiary ? beneficiary.name : '—') + '</td>'
          + '<td>' + statusChip(device.status) + '</td>'
          + '<td class="muted">' + esc(device.createdAt || '—') + '</td>'
          + '<td><button class="btn btn-link" data-act="view-device" data-id="' + esc(device.id) + '">تفاصيل</button>'
          + (isAdmin ? ' <button class="btn btn-link" data-act="edit-device" data-id="'
            + esc(device.id) + '">تعديل</button>' : '') + '</td></tr>';
      }).join('');

      var table = '<div class="table-wrap"><table class="data"><thead><tr>'
        + sortableTh('name', 'الجهاز') + sortableTh('id', 'رقم الجهاز') + sortableTh('type', 'النوع')
        + '<th>الجمعية</th><th>المستفيد</th>' + sortableTh('status', 'الحالة') + sortableTh('createdAt', 'تاريخ الإضافة')
        + '<th>إجراء</th>'

    function delegateForm() {

    /** كتلة عرض سرّ لمرة واحدة (رمز مندوب أو كلمة مرور مؤقتة) بزر نسخ. */

    function saveDelegate() {

    /* ============================================================
       11) الأنشطة وسجل العمليات والإعدادات
       ============================================================ */

    var ACTIVITY_STATUSES = ['لم يبدأ', 'جارٍ', 'متأخر', 'مكتمل'];
    var ACTIVITY_TABS = [
      {value: '', label: 'الكل'}, {value: 'جارٍ', label: 'جارية'},
      {value: 'متأخر', label: 'متأخرة'}, {value: 'مكتمل', label: 'مكتملة'},
      {value: 'لم يبدأ', label: 'قادمة'}
    ];

    /** الأنشطة/المراحل/الشواهد تُجلب عند فتح الصفحة فقط (getActivitiesBundle) — لا ضمن Bootstrap. */
    /** أيام حتى تاريخ "yyyy/MM/dd" (سالب = تجاوَز الموعد) — تقريب بتوقيت المتصفح المحلي، لعرض إرشادي فقط لا حسابًا رسميًا. */
    function daysFromToday(dateStr) {
      if (!dateStr) return null;
      var parts = String(dateStr).trim().split(/[\/\s:]/).map(Number);
      if (parts.length < 3 || !parts[0] || isNaN(parts[0])) return null;
      var target = new Date(parts[0], parts[1] - 1, parts[2]);
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((target - today) / 86400000);
    }

    /**
     * ثلاثة أقسام تشغيلية للوحة بيانات الإدارة: مكتمل مع الشاهد، جارٍ
     * حاليًا بنسبة التقدّم، والمهمة القادمة (أقرب نشاط لم يبدأ بعد حسب
     * موعد النهاية) مع المدة المتبقية. تُبنى من نفس حزمة getActivitiesBundle
     * المُستخدَمة في صفحة "متابعة المشروع" — تُجلب هنا كسوليًا أيضًا إن لم
     * تكن محمَّلة بعد (نفس عملية شبكة واحدة تُعاد استخدامها في الصفحتين).
     */
    function renderDashboardActivitySections() {
      var bundle = state.lazy.activities;
      // لا يُطلَق الجلب من هنا: استدعاء fetchActivitiesBundle (وهي تستدعي
      // render() فورًا) أثناء تنفيذ render() نفسه يُعيد الدخول إليها قبل
      // اكتمالها — الجلب يبدأ عند الدخول/استعادة الجلسة بدلًا (انظر
      // restoreSession/submitLogin)، وهذه الدالة تكتفي بعرض حالة التحميل.
      if (!bundle || bundle.loading) return '<section class="panel" style="margin-top:18px">' + skeletonCards(2) + '</section>';
      var all = bundle.activities || [];
      if (!all.length) return '';

      var completed = all.filter(function (x) { return x.status === 'مكتمل'; }).slice(0, 3);
      var inProgress = all.filter(function (x) { return x.status === 'جارٍ'; }).slice(0, 3);
      var notStarted = all.filter(function (x) { return x.status === 'لم يبدأ'; }).slice().sort(function (a, b) {
        var da = daysFromToday(a.endDate); var db = daysFromToday(b.endDate);
        if (da == null) return 1; if (db == null) return -1; return da - db;
      });
      var upcoming = notStarted[0];

      function editAttrs(x) {
        return ' role="button" tabindex="0" style="cursor:pointer" data-act="edit-activity" '
          + 'data-stage="' + esc(x.stage) + '" data-main="' + esc(x.mainActivity) + '" data-sub="' + esc(x.subActivity) + '"';
      }

      var completedHtml = completed.length
        ? '<div class="rows">' + completed.map(function (x) {
            return '<div class="row-item"' + editAttrs(x) + '><div><strong>' + esc(x.subActivity || x.mainActivity) + '</strong>'
              + '<small>' + esc(x.owner || 'بلا مسؤول') + '</small></div>'
              + (x.evidenceUrl ? '<a href="' + esc(x.evidenceUrl) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">الشاهد ↗</a>' : '<span class="muted">بلا شاهد</span>') + '</div>';
          }).join('') + '</div>'
        : '<p class="muted" style="font-size:13px;padding:4px 0">لا توجد أنشطة مكتملة بعد.</p>';

      var inProgressHtml = inProgress.length
        ? '<div class="rows">' + inProgress.map(function (x) {
            return '<div class="row-item"' + editAttrs(x) + '><div><strong>' + esc(x.subActivity || x.mainActivity) + '</strong>'
              + '<small>' + esc(x.owner || 'بلا مسؤول') + '</small></div>'
              + '<span class="muted">' + fmt(x.progress) + '٪</span></div>';
          }).join('') + '</div>'
        : '<p class="muted" style="font-size:13px;padding:4px 0">لا توجد أنشطة جارية حاليًا.</p>';

      var upcomingHtml;
      if (upcoming) {
        var days = daysFromToday(upcoming.endDate);
        var daysLabel = days == null ? 'بلا موعد محدَّد'
          : days < 0 ? 'تجاوز الموعد بـ ' + fmt(Math.abs(days)) + ' يومًا'
          : days === 0 ? 'موعده اليوم'
          : 'بعد ' + fmt(days) + ' يومًا';
        upcomingHtml = '<div class="row-item"' + editAttrs(upcoming) + '><div><strong>' + esc(upcoming.subActivity || upcoming.mainActivity) + '</strong>'
          + '<small>' + esc(upcoming.owner || 'بلا مسؤول') + ' · ' + esc(upcoming.endDate || 'بلا موعد نهاية محدَّد') + '</small></div>'
          + '<span class="muted">' + esc(daysLabel) + '</span></div>';
      } else {
        upcomingHtml = '<p class="muted" style="font-size:13px;padding:4px 0">لا توجد مهمة قادمة لم تبدأ بعد.</p>';
      }

      return '<section class="cols" style="margin-top:18px">'
        + '<div class="panel"><div class="panel-head"><div><h3>مكتمل</h3><p>مع رابط الشاهد إن وُجد</p></div></div>' + completedHtml + '</div>'
        + '<div class="panel"><div class="panel-head"><div><h3>جارٍ حاليًا</h3><p>بنسبة التقدّم الحالية</p></div></div>' + inProgressHtml + '</div>'
        + '</section>'
        + '<section class="panel" style="margin-top:14px"><div class="panel-head"><div><h3>المهمة القادمة</h3>'
        + '<p>أقرب نشاط لم يبدأ بعد حسب موعد النهاية، والمدة المتبقية</p></div>'
        + '<button class="btn btn-link" data-act="go" data-value="activities">كل الأنشطة ←</button></div>' + upcomingHtml + '</section>';
    }

    /* ============================================================
       متابعة الأنشطة — لوحة تنفيذية لا جدولًا تقليديًا.
       ثلاث طبقات مقروءة من بعيد إلى قريب:
         1) شريط تقدّم المشروع: توزيع الأنشطة على الحالات الأربع دفعة
            واحدة، بعرض متناسب مع العدد (يُقرأ قبل أي رقم).
         2) مسار المراحل: خط زمني رأسي بعُقَد، كل مرحلة بنسبتها وحالتها.
         3) بطاقات الأنشطة: مجمَّعة تحت نشاطها الرئيسي، تعرض المسؤول
            والموعد والمدة المتبقية/التأخير والشاهد وآخر تحديث.
       لا تعتمد أي حالة على اللون وحده: لكل حالة شارة نصية ورمز.
       ============================================================ */

    var ACTIVITY_STATE_META = {
      'مكتمل': {key: 'done', glyph: '✓', label: 'مكتمل'},
      'جارٍ': {key: 'live', glyph: '◉', label: 'جارٍ'},
      'متأخر': {key: 'late', glyph: '!', label: 'متأخر'},
      'لم يبدأ': {key: 'next', glyph: '○', label: 'قادم'}
    };
    var ACTIVITY_STATE_ORDER = ['مكتمل', 'جارٍ', 'متأخر', 'لم يبدأ'];

    function activityStateMeta(status) {
      return ACTIVITY_STATE_META[status] || {key: 'next', glyph: '○', label: status || 'غير محدد'};
    }

    /** شريط أفقي واحد يوزّع كل الأنشطة على حالاتها — أعرض شريحة = أكبر كتلة عمل. */
    function activityFlowBar(all) {
      var total = all.length || 1;
      var segments = ACTIVITY_STATE_ORDER.map(function (status) {
        var count = all.filter(function (x) { return x.status === status; }).length;
        return {status: status, count: count, share: Math.round(count / total * 100)};
      }).filter(function (seg) { return seg.count > 0; });

      var bars = segments.map(function (seg) {
        var meta = activityStateMeta(seg.status);
        return '<span class="flow-seg is-' + meta.key + '" style="flex:' + seg.count + '"'
          + ' title="' + esc(meta.label + ': ' + seg.count) + '"><span class="sr-only">'
          + esc(meta.label + ' ' + seg.count) + '</span></span>';
      }).join('');

      var legend = segments.map(function (seg) {
        var meta = activityStateMeta(seg.status);
        return '<div class="flow-key is-' + meta.key + '">'
          + '<span class="flow-dot" aria-hidden="true">' + meta.glyph + '</span>'
          + '<strong>' + fmt(seg.count) + '</strong><span>' + esc(meta.label) + '</span>'
          + '<small>' + fmt(seg.share) + '٪</small></div>';
      }).join('');

      return '<div class="flow"><div class="flow-bar" role="img" aria-label="توزيع الأنشطة على الحالات">'
        + bars + '</div><div class="flow-keys">' + legend + '</div></div>';
    }

    /** خط زمني رأسي للمراحل — عُقدة لكل مرحلة بحالتها ونسبتها. */
    function activityTimeline(stages) {
      if (!stages.length) {
        return emptyState({glyph: '◇', title: 'لا توجد مراحل بعد', body: 'ستظهر المراحل هنا فور إضافة أول نشاط.'});
      }
      return '<ol class="tl">' + stages.map(function (stage) {
        var meta = activityStateMeta(stage.status);
        return '<li class="tl-item is-' + meta.key + '">'
          + '<span class="tl-node" aria-hidden="true">' + meta.glyph + '</span>'
          + '<div class="tl-body"><div class="tl-head">'
          + '<strong>' + esc(stage.name || 'مرحلة غير مسماة') + '</strong>'
          + statusChip(stage.status) + '</div>'
          + '<div class="tl-meter"><span style="width:' + pct(stage.progress) + '%"></span></div>'
          + '<span class="tl-pct">' + fmt(pct(stage.progress)) + '٪</span>'
          + '</div></li>';
      }).join('') + '</ol>';
    }

    /** الموعد والمدة المتبقية أو مقدار التأخير — نص صريح لا لون فقط. */
    function activityDueLine(item) {
      if (item.status === 'مكتمل') {
        return '<span class="due is-done">اكتمل' + (item.endDate ? ' · ' + esc(item.endDate) : '') + '</span>';
      }
      if (item.delayDays > 0) {
        return '<span class="due is-late">متأخر ' + fmt(item.delayDays) + ' يومًا'
          + (item.endDate ? ' · كان ' + esc(item.endDate) : '') + '</span>';
      }
      if (item.remainingDays > 0) {
        return '<span class="due">يتبقّى ' + fmt(item.remainingDays) + ' يومًا'
          + (item.endDate ? ' · حتى ' + esc(item.endDate) : '') + '</span>';
      }
      return '<span class="due">' + (item.endDate ? 'الموعد ' + esc(item.endDate) : 'بلا موعد محدد') + '</span>';
    }

    function activityCard(item, isAdmin) {
      var meta = activityStateMeta(item.status);
      return '<article class="act-card is-' + meta.key + '">'
        + '<header class="act-top"><div>'
        + '<h4>' + esc(item.subActivity || item.mainActivity) + '</h4>'
        + '<p class="act-path">' + esc(item.stage) + ' › ' + esc(item.mainActivity) + '</p></div>'
        + statusChip(item.status) + '</header>'
        + '<div class="act-meter" role="img" aria-label="نسبة الإنجاز ' + fmt(pct(item.progress)) + ' بالمئة">'
        + '<span style="width:' + pct(item.progress) + '%"></span></div>'
        + '<div class="act-facts">'
        + '<span class="fact"><small>الإنجاز</small><strong>' + fmt(pct(item.progress)) + '٪</strong></span>'
        + '<span class="fact"><small>المسؤول</small><strong>' + esc(item.owner || 'غير محدد') + '</strong></span>'
        + '</div>'
        + '<div class="act-foot">' + activityDueLine(item)
        + (item.evidenceUrl
          ? '<a class="act-proof" href="' + esc(item.evidenceUrl) + '" target="_blank" rel="noopener noreferrer">الشاهد ↗</a>'
          : '<span class="act-proof is-missing">لا شاهد مرفوع</span>')
        + (isAdmin ? '<button class="btn btn-link btn-sm" data-act="edit-activity"'
          + ' data-stage="' + esc(item.stage) + '" data-main="' + esc(item.mainActivity) + '"'
          + ' data-sub="' + esc(item.subActivity) + '">تعديل</button>' : '')
        + '</div></article>';
    }

    /** تجميع البطاقات تحت نشاطها الرئيسي — يحفظ التسلسل الإداري بدل قائمة مسطحة. */
    function activityGroups(activities, isAdmin) {
      var order = [];
      var groups = {};
      activities.forEach(function (item) {
        var key = item.stage + ' › ' + item.mainActivity;
        if (!groups[key]) { groups[key] = []; order.push(key); }
        groups[key].push(item);
      });
      return order.map(function (key) {
        var items = groups[key];
        var doneCount = items.filter(function (x) { return x.status === 'مكتمل'; }).length;
        return '<section class="act-group">'
          + '<header class="act-group-head"><h3>' + esc(key) + '</h3>'
          + '<span class="act-group-count">' + fmt(doneCount) + ' من ' + fmt(items.length) + ' مكتمل</span></header>'
          + '<div class="act-grid">' + items.map(function (x) { return activityCard(x, isAdmin); }).join('') + '</div>'
          + '</section>';
      }).join('');
    }

    function renderActivities() {
      var isAdmin = state.data.role === 'ADMIN';
      var bundle = state.lazy.activities;
      if (isAdmin && bundle && bundle.loading) return skeletonCards(3);
      var stages = (bundle && bundle.stages) || [];
      var all = (bundle && bundle.activities) || [];
      if (!all.length) {
        return emptyState({glyph: ICONS.activities, title: 'لا توجد أنشطة مسجّلة',
          body: isAdmin ? 'أضف أول نشاط رئيسي أو فرعي لبدء متابعة مراحل المشروع.' : 'لم تُضَف أنشطة بعد.',
          action: isAdmin ? 'new-activity' : '', actionLabel: '＋ نشاط'});
      }

      var activeTab = state.activityTab || '';
      var tabsHtml = '<div class="segmented" role="tablist" aria-label="تصفية الأنشطة">'
        + ACTIVITY_TABS.map(function (tab) {
          return '<button type="button" role="tab" data-act="activity-tab" data-value="' + esc(tab.value) + '" '
            + 'aria-selected="' + (activeTab === tab.value) + '">' + esc(tab.label) + '</button>';
        }).join('') + '</div>';
      var activities = activeTab ? all.filter(function (x) { return x.status === activeTab; }) : all;

      var latest = all.map(function (x) { return x.endDate || ''; }).filter(Boolean).sort().pop() || '—';
      var body = activities.length
        ? activityGroups(activities, isAdmin)
        : emptyState({glyph: '⌕', title: 'لا توجد أنشطة مطابقة لهذه التصفية',
          body: 'أعد التصفية إلى «الكل» لعرض جميع الأنشطة.'});

      return '<section class="exec">'
        + '<header class="exec-head"><div><h2>المسار التنفيذي للمشروع</h2>'
        + '<p>' + fmt(all.length) + ' نشاطًا موزّعة على ' + fmt(stages.length) + ' مراحل · آخر موعد مسجّل ' + esc(latest) + '</p></div>'
        + (isAdmin ? '<button class="btn btn-primary btn-sm" data-act="new-activity">＋ نشاط</button>' : '')
        + '</header>'
        + activityFlowBar(all)
        + '</section>'
        + '<section class="cols exec-cols">'
        + '<div class="panel"><div class="panel-head"><div><h3>مسار المراحل</h3>'
        + '<p>تسلسل التنفيذ ونسبة كل مرحلة</p></div></div>' + activityTimeline(stages) + '</div>'
        + '<div class="panel"><div class="panel-head"><div><h3>يحتاج تدخّلًا</h3>'
        + '<p>الأنشطة المتأخرة مرتّبة بالأكثر تأخيرًا</p></div></div>' + renderLateActivities(all) + '</div>'
        + '</section>'
        + '<section class="exec-body">' + tabsHtml + body + '</section>';
    }

    function renderLateActivities(all) {
      var late = all.filter(function (x) { return x.status === 'متأخر'; })
        .sort(function (a, b) { return (b.delayDays || 0) - (a.delayDays || 0); });
      if (!late.length) {
        return emptyState({glyph: '✓', title: 'لا أنشطة متأخرة', body: 'الجدول الزمني منضبط حاليًا.'});
      }
      return '<div class="rows">' + late.slice(0, 6).map(function (x) {
        return '<div class="row-item"><div><strong>' + esc(x.subActivity || x.mainActivity) + '</strong>'
          + '<small>' + esc(x.owner || 'بلا مسؤول') + ' · ' + esc(x.stage) + '</small></div>'
          + '<span class="late-days">متأخر ' + fmt(x.delayDays) + ' يومًا</span></div>';
      }).join('') + '</div>';
    }

    function findActivity(stage, mainActivity, subActivity) {
      var list = (state.lazy.activities && state.lazy.activities.activities) || [];
      for (var i = 0; i < list.length; i++) {
        var x = list[i];
        if (x.stage === stage && x.mainActivity === mainActivity && x.subActivity === subActivity) return x;
      }
      return null;
    }

    function activityForm(stage, mainActivity, subActivity) {
      var isEdit = Boolean(stage && mainActivity && subActivity);
      var a = isEdit ? (findActivity(stage, mainActivity, subActivity) || {}) : {};
      var body = '<form id="activityForm" class="form-grid" novalidate>'
        + '<input type="hidden" name="originalStage" value="' + esc(stage || '') + '">'
        + '<input type="hidden" name="originalMainActivity" value="' + esc(mainActivity || '') + '">'
        + '<input type="hidden" name="originalSubActivity" value="' + esc(subActivity || '') + '">'
        + textField('stage', 'اسم المرحلة', a.stage, {required: true, max: 150})
        + '<div class="field"><label for="f_stageOrder">ترتيب المرحلة</label>'
        + '<input class="control" id="f_stageOrder" name="stageOrder" type="number" min="0" max="999" value="'
        + esc(a.stageOrder || 0) + '"></div>'
        + textField('mainActivity', 'اسم النشاط الرئيسي', a.mainActivity, {required: true, max: 180, span: true})
        + textField('subActivity', 'اسم النشاط الفرعي', a.subActivity, {required: true, max: 180, span: true})
        + '<div class="field"><label for="f_mainOrder">ترتيب النشاط الرئيسي</label>'
        + '<input class="control" id="f_mainOrder" name="mainOrder" type="number" min="0" max="999" value="'
        + esc(a.mainOrder || 0) + '"></div>'
        + textField('owner', 'المسؤول', a.owner, {max: 120})
        + '<div class="field"><label for="f_startDate">تاريخ البداية</label>'
        + '<input class="control" id="f_startDate" name="startDate" type="date" value="' + esc(toDateInput(a.startDate)) + '"></div>'
        + '<div class="field"><label for="f_endDate">تاريخ النهاية</label>'
        + '<input class="control" id="f_endDate" name="endDate" type="date" value="' + esc(toDateInput(a.endDate)) + '"></div>'
        + '<div class="field"><label for="f_progress">نسبة الإنجاز (٪)</label>'
        + '<input class="control" id="f_progress" name="progress" type="number" min="0" max="100" value="'
        + esc(a.progress || 0) + '"></div>'
        + '<div class="field"><label for="f_status">الحالة (اختياري — تُحسب تلقائيًا إن تُركت فارغة)</label>'
        + '<select class="control" id="f_status" name="status">'
        + optionList(ACTIVITY_STATUSES, a.status, '— حساب تلقائي —') + '</select></div>'
        + '<div class="field span-2"><label for="f_evidenceUrl">رابط الشاهد</label>'
        + '<input class="control" id="f_evidenceUrl" name="evidenceUrl" type="url" dir="ltr" value="' + esc(a.evidenceUrl || '') + '"></div>'
        + '<div class="field span-2"><label for="f_notes">ملاحظات</label>'
        + '<textarea class="control" id="f_notes" name="notes" maxlength="1000">' + esc(a.notes || '') + '</textarea></div></form>';
      openModal(isEdit ? 'تعديل نشاط' : 'إضافة نشاط', body,
        '<button class="btn btn-ghost" data-act="close-modal">إلغاء</button>'
        + '<button class="btn btn-primary" data-act="save-activity">' + (isEdit ? 'حفظ التعديلات' : 'إضافة النشاط') + '</button>');
    }

    /** يحوّل تاريخًا معروضًا مثل "2026/08/01" إلى صيغة input[type=date] "2026-08-01". */
    function toDateInput(displayDate) {
      return String(displayDate || '').replace(/\//g, '-');
    }

    function saveActivity() {
      var form = $('#activityForm');
      if (!form || !form.reportValidity()) return;
      var data = new FormData(form);
      busy(true);
      api('saveActivity', state.token, {
        originalStage: data.get('originalStage') || '',
        originalMainActivity: data.get('originalMainActivity') || '',
        originalSubActivity: data.get('originalSubActivity') || '',
        stage: data.get('stage'), stageOrder: data.get('stageOrder'),
        mainActivity: data.get('mainActivity'), mainOrder: data.get('mainOrder'),
        subActivity: data.get('subActivity'), owner: data.get('owner'),
        startDate: data.get('startDate'), endDate: data.get('endDate'),
        progress: data.get('progress'), status: data.get('status'),
        evidenceUrl: data.get('evidenceUrl'), notes: data.get('notes')
      }).then(function (result) {
        state.lazy.activities = Object.assign({loading: false}, result);
        mergeSummary(result);
        closeModal();
        render();
        toast('تم حفظ النشاط.', 'success');
      }, reportError).finally(function () { busy(false); });
    }

    var AUDIT_SECTIONS = ['المستفيدون', 'الأجهزة', 'الجمعيات', 'المناديب', 'التسليمات', 'الأنشطة', 'الإعدادات', 'طلبات الانضمام', 'المصادقة'];

    /**
     * صفحة سجل العمليات الكاملة — تُجلب مُرقَّمة من الخادم (listAuditLog)
     * عند فتح الصفحة، لا ضمن Bootstrap؛ البحث والفلترة يُعاد تنفيذهما
     * على الخادم أيضًا (لا تصفية محلية على مصفوفة كاملة كما كان سابقًا).
     */
    function renderAudit() {
      var bundle = state.lazy.audit || {};
      var items = bundle.items || [];
      var toolbarHtml = toolbar({placeholder: 'ابحث بالمستخدم أو الإجراء أو رقم السجل…',
        filters: optionList(AUDIT_SECTIONS, state.filter, 'كل الأقسام'),
        showAssocFilter: true,
        count: bundle.loading ? 'جارٍ التحميل…' : (fmt(bundle.total || 0) + ' سجلًا')});
      var body = bundle.loading ? skeletonCards(4) : auditRowsHtml(items);
      return '<section class="panel"><div class="panel-head"><div><h3>سجل العمليات</h3>'
        + '<p>سجل غير قابل للتعديل من الواجهة، يوثّق كل إجراء في النظام</p></div></div>'
        + toolbarHtml + body + pagerControls('audit', bundle) + '</section>';
    }

    function renderSettings() {
      var isAdmin = state.data.role === 'ADMIN';
      var a = state.data.association || {};
      var profile = isAdmin
        ? '<div class="panel"><div class="panel-head"><div><h3>حساب الإدارة</h3>'
          + '<p>بيانات مدير النظام</p></div></div>'
          + '<div class="metas"><div class="meta wide"><small>الاسم</small><strong>'
          + esc((state.user && state.user.name) || '—') + '</strong></div>'
          + '<div class="meta wide"><small>الدور</small><strong>مدير النظام — صلاحية كاملة</strong></div></div>'
          + '<p class="muted" style="font-size:13px">صلاحيات الإدارة تُفرض في الخادم، ولا تعتمد على إخفاء الأزرار.</p></div>'
        : '<div class="panel"><div class="panel-head"><div><h3>بيانات الجمعية</h3>'
          + '<p>تحديث وسائل التواصل المرتبطة بالحساب</p></div></div>'
          + '<form id="associationSettings" novalidate>'
          + '<div class="field"><label for="s_name">اسم الجمعية</label>'
          + '<input class="control" id="s_name" value="' + esc(a.name || '') + '" disabled></div>'
          + '<div class="field"><label for="s_phone">أرقام التواصل</label>'
          + '<input class="control" id="s_phone" name="phone" dir="ltr" value="' + esc(a.phone || '') + '" required></div>'
          + '<div class="field"><label for="s_email">البريد الإلكتروني</label>'
          + '<input class="control" id="s_email" name="email" type="email" dir="ltr" value="'
          + esc(a.email || '') + '" required></div>'
          + '<div class="field"><label for="s_loc">الموقع</label>'
          + '<input class="control" id="s_loc" value="' + esc((a.region || '') + ' · ' + (a.city || '')) + '" disabled></div>'
          + '<button class="btn btn-primary" type="button" data-act="save-settings">حفظ التغييرات</button></form></div>';

      return '<section class="cols">' + profile
        + '<div class="panel"><div class="panel-head"><div><h3>تغيير كلمة المرور</h3>'
        + '<p>استخدم كلمة قوية لا تقل عن ١٠ خانات وتضم حروفًا وأرقامًا</p></div></div>'
        + '<form id="passwordForm" novalidate>'
        + '<div class="field"><label for="p_current">كلمة المرور الحالية</label>'
        + '<input class="control" id="p_current" name="current" type="password" autocomplete="current-password" required></div>'
        + '<div class="field"><label for="p_next">كلمة المرور الجديدة</label>'
        + '<input class="control" id="p_next" name="next" type="password" minlength="10" '
        + 'autocomplete="new-password" required></div>'
        + '<div class="field"><label for="p_confirm">تأكيد كلمة المرور</label>'
        + '<input class="control" id="p_confirm" name="confirm" type="password" minlength="10" '
        + 'autocomplete="new-password" required></div>'
        + '<button class="btn btn-soft" type="button" data-act="save-password">تغيير كلمة المرور</button></form>'
        + '<hr style="border:0;border-top:1px solid var(--line);margin:22px 0">'
        + '<button class="btn btn-danger" data-act="logout">تسجيل الخروج من هذا الجهاز</button>'
        + '</div></section>';
    }

    function saveAssociationSettings() {
      var form = $('#associationSettings');
      if (!form || !form.reportValidity()) return;
      var data = new FormData(form);
      busy(true);
      api('updateAssociationSettings', state.token, {phone: data.get('phone'), email: data.get('email')})
        .then(function (result) {
          state.data.association = result.association;
          render();
          toast('تم حفظ إعدادات الجمعية.', 'success');
        }, reportError).finally(function () { busy(false); });
    }

    function savePassword() {
      var form = $('#passwordForm');
      if (!form || !form.reportValidity()) return;
      var data = new FormData(form);
      if (data.get('next') !== data.get('confirm')) {
        toast('تأكيد كلمة المرور غير مطابق.', 'error');
        return;
      }
      busy(true);
      api('changePassword', state.token, data.get('current'), data.get('next')).then(function () {
        form.reset();
        toast('تم تغيير كلمة المرور بنجاح.', 'success');
      }, reportError).finally(function () { busy(false); });
    }

    /* ============================================================
       12) واجهة المندوب (جوال)
       ============================================================ */

    function renderDelegate() {
      var d = state.data.delegate || {};
      var s = state.data.summary || {};
      var tab = state.delegatePage || 'list';
      var tabBody = tab === 'list' ? renderDelegateList()
        : tab === 'route' ? renderDelegateRoute()
        : renderDelegateHistory();
      $('#root').innerHTML = '<main class="dg"><header class="dg-top">' + lockup({partner: true, onDark: true})
        + '<h2>أهلًا ' + esc(d.name) + '</h2><p>مهام التسليم الخاصة بك اليوم</p>'
        + '<div class="dg-stats">'
        + '<div><strong>' + fmt(s.remaining) + '</strong><span>مستفيدون متبقّون</span></div>'
        + '<div><strong>' + fmt(s.deliveredToday) + '</strong><span>تم تسليمهم اليوم</span></div>'
        + '</div></header><section class="dg-body"><div class="dg-nav">'
        + '<button class="btn ' + (tab === 'list' ? 'btn-primary' : 'btn-ghost') + '" data-act="dg-tab" data-value="list">قائمة المهام</button>'
        + '<button class="btn ' + (tab === 'route' ? 'btn-primary' : 'btn-ghost') + '" data-act="dg-tab" data-value="route">مسار اليوم</button>'
        + '<button class="btn ' + (tab === 'history' ? 'btn-primary' : 'btn-ghost') + '" data-act="dg-tab" data-value="history">السجل</button>'
        + '<button class="btn btn-ghost icon" data-act="dg-settings" aria-label="الإعدادات">⚙</button></div>'
        + tabBody + '</section></main>';
    }

    /** المسافة التقريبية بالكيلومترات بين نقطتين — صيغة Haversine، بلا أي خدمة أو مفتاح API. */
    function haversineKm(lat1, lng1, lat2, lng2) {
      var toRad = function (deg) { return deg * Math.PI / 180; };
      var R = 6371;
      var dLat = toRad(lat2 - lat1);
      var dLng = toRad(lng2 - lng1);
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    /**
     * مسار تقريبي مجاني بالكامل: يرتّب المستفيدين ذوي الإحداثيات حسب
     * القرب من موقع المندوب الحالي (أقرب أولًا فأقرب من كل نقطة تالية
     * — خوارزمية "أقرب جار" البسيطة)، بلا أي واجهة برمجية مدفوعة
     * للتوجيه أو المسافات. من لا تتوفر له إحداثيات يبقى في قائمة
     * منفصلة يُعتمَد فيها على العنوان النصي كما كان دائمًا.
     */
    function startDelegateRoute() {
      if (!navigator.geolocation) { toast('المتصفح لا يدعم تحديد الموقع.', 'error'); return; }
      toast('يُطلَب إذن الموقع من المتصفح…', 'success');
      navigator.geolocation.getCurrentPosition(function (position) {
        var origin = {lat: position.coords.latitude, lng: position.coords.longitude};
        var withCoords = (state.data.beneficiaries || []).filter(function (b) { return b.lat != null && b.lng != null; });
        var remaining = withCoords.slice();
        var ordered = [];
        var cursor = origin;
        while (remaining.length) {
          var nearestIndex = 0;
          var nearestDist = Infinity;
          remaining.forEach(function (b, i) {
            var dist = haversineKm(cursor.lat, cursor.lng, b.lat, b.lng);
            if (dist < nearestDist) { nearestDist = dist; nearestIndex = i; }
          });
          var next = remaining.splice(nearestIndex, 1)[0];
          ordered.push({item: next, distanceKm: haversineKm(cursor.lat, cursor.lng, next.lat, next.lng)});
          cursor = next;
        }
        state.delegateRoute = {origin: origin, ordered: ordered};
        render();
        toast('تم ترتيب المسار حسب القرب من موقعك.', 'success');
      }, function () {
        toast('تعذّر الحصول على الموقع — تحقق من إذن الموقع في المتصفح.', 'error');
      }, {enableHighAccuracy: true, timeout: 10000});
    }

    /** نفس شرط قائمة المهام: أجهزة خرجت فعليًا مع المندوب، وحالة ليست متعذّرة ولا مكتملة. */
    function routeStationCanDeliver(item) {
      if (item.deliveryStatus === 'تم التسليم' || item.deliveryStatus === 'تعذر التسليم') return false;
      return (item.devices || []).some(function (d) { return d.status === 'مع المندوب'; });
    }
    function routeStationBlockReason(item) {
      if (item.deliveryStatus === 'تم التسليم') return 'تم تسليمه بالفعل';
      if (item.deliveryStatus === 'تعذر التسليم') return 'سجِّل «إعادة المحاولة» أولًا لاستئناف التسليم بعد التعذّر';
      return 'لا توجد أجهزة خرجت مع المندوب لهذا المستفيد';
    }

    function renderDelegateRoute() {
      var all = state.data.beneficiaries || [];
      // ثلاث حالات فراغ مختلفة تمامًا لا واحدة: "لا مهام أصلًا" ≠ "مهام
      // بلا إحداثيات فلا مسار ممكن" ≠ "مسار لم يُحسب بعد". كل واحدة
      // توجّه المندوب إلى الإجراء الصحيح بدل رسالة عامة واحدة.
      if (!all.length) {
        return '<div class="dg-card">' + emptyState({glyph: '✓', title: 'أنجزت جميع مهامك',
          body: 'لا يوجد مستفيدون متبقّون في قائمتك حاليًا، فلا حاجة لمسار اليوم.'}) + '</div>';
      }
      var withoutCoords = all.filter(function (b) { return b.lat == null || b.lng == null; });
      if (withoutCoords.length === all.length) {
        return '<div class="dg-card">' + emptyState({glyph: '◇',
          title: 'لا يمكن ترتيب مسار اليوم بعد',
          body: 'لا يحمل أي من مستفيديك (' + fmt(all.length) + ') إحداثيات مسجَّلة، والترتيب بالمسافة يحتاجها. '
            + 'استخدم «قائمة المهام» والعنوان النصي للوصول إليهم، واطلب من الجمعية تسجيل مواقعهم على الخريطة لتفعيل المسار.',
          action: 'dg-tab-list', actionLabel: 'الانتقال إلى قائمة المهام'}) + '</div>';
      }
      var intro = '<div class="dg-card"><p>يرتّب هذا المسار المستفيدين الأقرب لموقعك الحالي أولًا فأولًا، اعتمادًا '
        + 'على إحداثيات مسجَّلة في ملفاتهم فقط. <strong>مسافة تقريبية بخط مستقيم فقط</strong> — ليست مسارًا مروريًا '
        + 'فعليًا ولا توجيهًا عبر الطرق، فقط ترتيب أقرب-فأقرب مبني على الإحداثيات.</p>'
        + '<button class="btn btn-primary btn-sm" data-act="delegate-locate">📍 ترتيب المسار من موقعي الحالي</button></div>';

      if (!state.delegateRoute) {
        var ready = all.length - withoutCoords.length;
        var pending = emptyState({glyph: '📍', title: 'المسار جاهز للترتيب',
          body: fmt(ready) + ' من ' + fmt(all.length) + ' مستفيدًا يحملون إحداثيات ويمكن ترتيبهم بالمسافة. '
            + 'اضغط الزر أعلاه للسماح بالوصول لموقعك مرة واحدة وترتيبهم الأقرب فالأقرب.'});
        var noCoordsNote = withoutCoords.length
          ? emptyState({glyph: '◇', title: fmt(withoutCoords.length) + ' مستفيدًا بلا إحداثيات',
              body: 'لن يدخلوا في الترتيب التلقائي — استخدم العنوان النصي من قائمة المهام للوصول إليهم.'})
          : '';
        return intro + pending + noCoordsNote;
      }

      // موقع/عنوان/اسم كل محطة يبقيان كما حُسب بهما المسار (entry.item) —
      // لكن حالة التسليم والأجهزة تُعاد قراءتها من state.data.beneficiaries
      // الحالية دائمًا، لأن upsertRecord يستبدل مرجع الكائن بالكامل عند كل
      // حفظ فيصبح entry.item القديم غير محدَّث الحالة. هذا ما يجعل تأكيد
      // التسليم أو تسجيل تعذّره ينعكس فورًا على بطاقة المحطة في المسار
      // نفسه دون إعادة حساب الترتيب أو تحميل الصفحة بالكامل.
      var orderedHtml = state.delegateRoute.ordered.map(function (entry, index) {
        var live = findBeneficiary(entry.item.id);
        var item = live ? Object.assign({}, entry.item, {
          deliveryStatus: live.deliveryStatus, status: live.status, devices: live.devices
        }) : entry.item;
        var mapsUrl = HTTPS + 'www.google.com/maps/search/?api=1&query=' + item.lat + ',' + item.lng;
        var delivered = item.deliveryStatus === 'تم التسليم';
        return '<article class="dg-card' + (delivered ? ' dg-card-done' : '') + '"><div class="card-head"><div>'
          + '<h3>' + (index + 1) + '. ' + esc(item.name) + '</h3>'
          + '<p class="muted">' + esc(item.city) + ' · بعد تقريبي بخط مستقيم: ' + entry.distanceKm.toFixed(1) + ' كم</p></div>'
          + statusChip(item.deliveryStatus) + '</div>'
          + '<p class="dg-addr"><span aria-hidden="true">◉</span><span>' + beneficiaryAddressLine(item) + '</span></p>'
          + '<div class="tags">' + deviceTagsFor(item) + '</div>'
          + '<div class="dg-acts">'
          + beneficiaryContactActions(item)
          + (item.deliveryStatus === 'تعذر التسليم'
            ? '<button class="a-retry" data-act="dg-retry" data-id="' + esc(item.id) + '">↻ إعادة المحاولة</button>'
            : '<button class="a-state" data-act="dg-status" data-id="' + esc(item.id) + '"' + (delivered ? ' disabled' : '') + '>تعذّر</button>')
          + '<button class="a-deliver" data-act="dg-deliver" data-id="' + esc(item.id) + '"'
          + (routeStationCanDeliver(item) ? '' : ' disabled title="' + esc(routeStationBlockReason(item)) + '"')
          + '>تأكيد التسليم</button>'
          + '</div></article>';
      }).join('');

      var withoutCoordsHtml = withoutCoords.length
        ? '<div class="panel-head" style="margin-top:16px"><div><h3>بلا إحداثيات (' + fmt(withoutCoords.length) + ')</h3>'
          + '<p>لا يُستبعَدون من قائمة المهام إطلاقًا — يظهرون هنا فقط لأنهم خارج الترتيب التلقائي بالمسافة؛ اعتمد على العنوان النصي للوصول إليهم.</p></div></div>'
          + withoutCoords.map(function (b) {
            return '<div class="dg-card"><strong>' + esc(b.name) + '</strong> — <span class="muted">' + beneficiaryAddressLine(b) + '</span>'
              + '<div class="dg-acts">' + beneficiaryContactActions(b) + '</div></div>';
          }).join('')
        : '';

      return intro + orderedHtml + withoutCoordsHtml;
    }

    /**
     * يطبّع أي صيغة سعودية شائعة إلى المحلية 05XXXXXXXX، دفاعًا في
     * العمق ضد بيانات قديمة قد تكون بلا صفر بادئ (كانت تُخزَّن كذلك
     * قبل إصلاح normalizePhone_ في الخادم). لا يفشل بصمت — يعيد
     * المدخل كما هو إن لم يتعرّف على شكله بدل إنتاج رابط فاسد صامت.
     */
    function phoneLocal(value) {
      var digits = String(value || '').replace(/\D/g, '');
      if (digits.indexOf('966') === 0) return '0' + digits.slice(3);
      if (digits.charAt(0) === '5' && digits.length === 9) return '0' + digits;
      return digits;
    }
    function phoneIntl(value) {
      var local = phoneLocal(value);
      return local.charAt(0) === '0' ? '966' + local.slice(1) : local;
    }

    /**
     * صف أزرار تواصل/موقع موحَّد لبطاقة المستفيد (قائمة المهام ومسار
     * اليوم كلاهما). زر الموقع لا يفتح رابطًا فارغًا أبدًا: يُفعَّل فقط
     * إن وُجدت إحداثيات أو عنوان/مدينة نصية، وإلا يعرض تنبيهًا واضحًا
     * بدل رابط خرائط بلا محتوى. زر "نسخ الرقم" بديل صريح دائم الظهور،
     * لا يعتمد فقط على اكتشاف حجب tel:/واتساب تلقائيًا.
     */
    function beneficiaryContactActions(item) {
      var localPhone = phoneLocal(item.phone);
      var whatsappUrl = HTTPS + 'wa.me/' + phoneIntl(item.phone);
      var hasLocation = (item.lat != null && item.lng != null) || item.address || item.city;
      var mapsQuery = (item.lat != null && item.lng != null)
        ? item.lat + ',' + item.lng
        : encodeURIComponent(String(item.address || '') + ' ' + String(item.city || ''));
      var mapsUrl = HTTPS + 'www.google.com/maps/search/?api=1&query=' + mapsQuery;
      var mapsBtn = hasLocation
        ? '<a class="a-map" href="' + esc(mapsUrl) + '" target="_blank" rel="noopener noreferrer">الموقع</a>'
        : '<button type="button" class="a-map" data-act="no-location-alert">الموقع</button>';
      return '<a class="a-wa" href="' + esc(whatsappUrl) + '" target="_blank" rel="noopener noreferrer">واتساب</a>'
        + '<a class="a-call" href="tel:' + esc(localPhone) + '" data-act="call-fallback" data-phone="' + esc(localPhone) + '">اتصال</a>'
        + '<button type="button" class="a-copy" data-act="copy-phone" data-phone="' + esc(localPhone) + '">نسخ الرقم</button>'
        + mapsBtn;
    }

    function beneficiaryAddressLine(item) {
      return esc(item.address) + (item.landmark ? ' — ' + esc(item.landmark) : '');
    }

    function deviceTagsFor(item) {
      return (item.devices || []).map(function (device) {
        return '<span class="tag">' + needGlyph(device.name) + ' ' + esc(device.name)
          + ' <span class="mono">' + esc(device.id) + '</span></span>';
      }).join('') || '<span class="tag plain">لا توجد أجهزة مخصصة</span>';
    }

    /** سطر موجز لآخر محاولة تسليم متعذّرة — يبقي سببها وتاريخها ظاهرين بدل ضياعهما. */
    function lastFailedAttemptLine(item) {
      var attempts = item.attempts || [];
      for (var i = 0; i < attempts.length; i++) {
        if (attempts[i].status === 'تعذر التسليم') {
          return '<p class="dg-attempt"><span class="dg-attempt-label">آخر محاولة متعذّرة</span>'
            + '<span>' + esc(attempts[i].reason || '—') + '</span>'
            + '<span class="muted">' + esc(attempts[i].at || '') + '</span>'
            + (attempts.length > 1 ? '<span class="muted">· ' + fmt(attempts.length) + ' محاولات</span>' : '')
            + '</p>';
        }
      }
      return '';
    }

    function renderDelegateList() {
      var list = state.data.beneficiaries || [];
      if (!list.length) {
        return '<div class="dg-card">' + emptyState({glyph: '✓', title: 'أنجزت جميع مهامك',
          body: 'لا يوجد مستفيدون متبقّون في قائمتك حاليًا.'}) + '</div>';
      }
      return list.map(function (item) {
        var devices = deviceTagsFor(item);
        // الأجهزة الجاهزة للتسليم هي التي خرجت فعليًا مع المندوب. بعد
        // تسجيل "تعذّر التسليم" تبقى كما هي تمامًا — لا تختفي ولا تتغيّر
        // حالتها — لذلك يبقى زر التأكيد متاحًا بعد إعادة المحاولة.
        var dispatched = (item.devices || []).filter(function (d) { return d.status === 'مع المندوب'; });
        var failed = item.deliveryStatus === 'تعذر التسليم';
        var canDeliver = dispatched.length > 0 && !failed;
        var deliverTitle = dispatched.length === 0
          ? 'لا توجد أجهزة خرجت مع المندوب لهذا المستفيد'
          : 'سجِّل «إعادة المحاولة» أولًا لاستئناف التسليم بعد التعذّر';

        // بعد التعذّر: إجراء صريح واحد لاستئناف المهمة، بدل المسار
        // الالتفافي الذي كان الحل الوحيد (تغيير المندوب من بوابة الجمعية).
        var retryBtn = failed
          ? '<button class="a-retry" data-act="dg-retry" data-id="' + esc(item.id) + '">↻ إعادة المحاولة</button>'
          : '<button class="a-state" data-act="dg-status" data-id="' + esc(item.id) + '">تعذّر</button>';

        return '<article class="dg-card' + (failed ? ' is-failed' : '') + '"><div class="card-head"><div>'
          + '<h3>' + esc(item.name) + '</h3><p class="muted">' + esc(item.city) + '</p></div>'
          + statusChip(item.deliveryStatus) + '</div>'
          + '<p class="dg-addr"><span aria-hidden="true">◉</span><span>' + beneficiaryAddressLine(item) + '</span></p>'
          + '<div class="tags">' + devices + '</div>'
          + lastFailedAttemptLine(item)
          + (failed ? '<p class="dg-note">الأجهزة ما زالت معك ولم تتغيّر. اضغط «إعادة المحاولة» لاستئناف التسليم.</p>' : '')
          + '<div class="dg-acts">'
          + beneficiaryContactActions(item)
          + retryBtn
          + '<button class="a-deliver" data-act="dg-deliver" data-id="' + esc(item.id) + '"'
          + (canDeliver ? '' : ' disabled title="' + esc(deliverTitle) + '"') + '>تأكيد التسليم</button>'
          + '</div></article>';
      }).join('');
    }

    function renderDelegateHistory() {
      var list = state.data.history || [];
      var d = state.data.delegate || {};
      var logButton = '<div style="margin-bottom:10px"><button type="button" class="btn btn-ghost btn-sm" '
        + 'data-act="view-delegate-log" data-id="' + esc(d.id) + '" data-name="' + esc(d.name) + '">سجل عملياتي الكامل</button></div>';
      if (!list.length) {
        return logButton + '<div class="dg-card">' + emptyState({glyph: '≡', title: 'لا توجد تسليمات سابقة',
          body: 'سيظهر هنا كل تسليم وثّقته بالصورة.'}) + '</div>';
      }
      return logButton + '<div class="dg-card"><div class="rows">' + list.map(function (x) {
        return '<div class="row-item"><div><strong>' + esc(x.beneficiaryName) + '</strong>'
          + '<small>' + esc((x.devices || []).join('، ') || '—') + '</small></div>'
          + '<div class="muted">' + esc(x.deliveredAt) + '</div>'
          + '<span class="status good">موثّق</span></div>';
      }).join('') + '</div></div>';
    }

    function delegateStatusModal(id) {
      var item = findBeneficiary(id);
      var body = (item ? '<p class="muted">المستفيد: <strong>' + esc(item.name) + '</strong></p>' : '')
        + '<div class="field"><label for="failedReason">سبب تعذّر التسليم</label>'
        + '<select class="control" id="failedReason">' + optionList(FAILED_REASONS, '') + '</select></div>'
        + '<div class="field"><label for="failedNotes">ملاحظات (اختياري)</label>'
        + '<textarea class="control" id="failedNotes" maxlength="500"></textarea></div>';
      openModal('تحديث حالة المستفيد', body,
        '<button class="btn btn-ghost" data-act="close-modal">إلغاء</button>'
        + '<button class="btn btn-soft" data-act="dg-save-status" data-id="' + esc(id) + '">حفظ الحالة</button>');
    }

    function saveDelegateStatus(id) {
      var reason = $('#failedReason');
      var notes = $('#failedNotes');
      if (!reason) return;
      var opKey = 'delivery-status:' + id;
      busy(true);
      api('updateDeliveryStatus', state.token, id, reason.value, notes ? notes.value : '', opIdFor(opKey))
        .then(function (result) {
          clearOpId(opKey);
          upsertEntity('beneficiaries', result.record);
          closeModal();
          renderDelegate();
          toast('سُجِّل تعذّر التسليم. الأجهزة ما زالت معك — استخدم «إعادة المحاولة» عند الاستئناف.', 'success');
        }, reportError).finally(function () { busy(false); });
    }

    /**
     * «إعادة المحاولة» بعد التعذّر: إجراء واحد صريح على الخادم يُعيد حالة
     * التسليم إلى «خرج مع المندوب» دون المساس بالأجهزة ولا بالمندوب ولا
     * بسجل المحاولات السابق. يحلّ محل المسار الالتفافي المربك الذي كان
     * الحل الوحيد عمليًا (دخول الجمعية إلى «تغيير المندوب» وإعادة حفظه).
     */
    function retryDelivery(id) {
      var opKey = 'retry-delivery:' + id;
      busy(true);
      api('retryDelivery', state.token, id, opIdFor(opKey))
        .then(function (result) {
          clearOpId(opKey);
          upsertEntity('beneficiaries', result.record);
          renderDelegate();
          toast('استُؤنفت المهمة. يمكنك الآن توثيق التسليم.', 'success');
        }, reportError).finally(function () { busy(false); });
    }

    function deliveryModal(id) {
      var item = findBeneficiary(id);

    /**
     * يفعّل زر «تم التسليم» فقط عند اكتمال الشرطين معًا (صورة صحيحة
     * مُرفَقة + الموافقة على التعهد)، ويكتب سبب التعطيل نصًا بجانب الزر.
     * التحقق الحقيقي يبقى في الخادم (توقيع بايتات الصورة وحجمها ونوعها،
     * وconfirmed===true) — هذا التعطيل تحسين تجربة لا بديل عن الحراسة.
     */
    function updateDeliveryGate() {
      var button = $('#deliverySubmit');
      var hint = $('#deliveryGateHint');
      if (!button) return;
      var hasProof = !!state.proofData;
      var pledged = !!($('#deliveryConfirm') && $('#deliveryConfirm').checked);
      var missing = [];
      if (!hasProof) missing.push('إرفاق صورة الإثبات');
      if (!pledged) missing.push('الموافقة على التعهد');
      button.disabled = missing.length > 0;
      if (hint) {
        hint.textContent = missing.length ? 'لتفعيل الزر: ' + missing.join(' و') + '.' : 'كل الشروط مكتملة — يمكنك التوثيق الآن.';
        hint.className = 'gate-hint' + (missing.length ? '' : ' is-ready');
      }
    }

    function handleProofFile(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      if (file.size > 6 * 1024 * 1024) {
        toast('حجم الصورة يتجاوز ٦ ميجابايت. صوّر بجودة أقل.', 'error');
        input.value = '';
        return;
      }
      if (['image/jpeg', 'image/png', 'image/webp'].indexOf(file.type) < 0) {
        toast('صيغة الصورة غير مدعومة. استخدم JPG أو PNG أو WEBP.', 'error');
        input.value = '';
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        state.proofData = reader.result;
        var img = $('#proofPreview');
        var hint = $('#proofHint');
        if (img) { img.src = state.proofData; img.classList.remove('hidden'); }
        if (hint) hint.textContent = 'تم إرفاق الصورة. راجعها قبل التأكيد.';
        updateDeliveryGate();
      };
      reader.onerror = function () { toast('تعذر قراءة الصورة.', 'error'); };
      reader.readAsDataURL(file);
    }

    function saveDelivery(id) {
      var confirmBox = $('#deliveryConfirm');
      if (!state.proofData) { toast('أرفق صورة إثبات التسليم أولًا.', 'error'); return; }
      if (!confirmBox || !confirmBox.checked) { toast('يجب تأكيد إتمام التسليم.', 'error'); return; }
      // opId ثابت لكل مستفيد طوال محاولات إعادة الإرسال المتتالية (مثلًا

      api('confirmDelivery', state.token, {

        clearOpId(opKey);

        removeEntity('beneficiaries', id);
