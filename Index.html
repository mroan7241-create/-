        + '<div class="meta"><small>التواصل</small><strong dir="ltr" class="mono">' + esc(a.phone) + '</strong></div>'
        + '<div class="meta"><small>البريد</small><strong dir="ltr" class="mono">' + esc(a.email) + '</strong></div>'
        + '<div class="meta"><small>تاريخ التقديم</small><strong>' + esc(a.submittedAt) + '</strong></div></div>'
        + (a.notes ? '<h4 style="margin:18px 0 8px;color:var(--zad-800)">ملاحظات مقدّم الطلب</h4><p>' + esc(a.notes) + '</p>' : '')
        + (a.status === 'مرفوض' ? '<h4 style="margin:18px 0 8px;color:var(--zad-800)">سبب الرفض</h4><p>' + esc(a.rejectionReason) + '</p>' : '')
        + (a.status === 'مقبول' ? '<p class="hint">تم إنشاء الجمعية برقم ' + esc(a.resultingAssociationId) + '</p>' : '');
      var footer = a.status === 'قيد المراجعة'
        ? '<button class="btn btn-ghost" data-act="close-modal">إغلاق</button>'
          + '<button class="btn btn-soft" data-act="reject-application" data-id="' + esc(a.id) + '">رفض</button>'
          + '<button class="btn btn-primary" data-act="accept-application" data-id="' + esc(a.id) + '">قبول وإنشاء الجمعية</button>'
        : '<button class="btn btn-ghost" data-act="close-modal">إغلاق</button>';
      openModal('طلب انضمام جمعية', body, footer);
    }

    function rejectApplicationModal(id) {
      var a = findApplication(id);
      if (!a) { toast('تعذر العثور على الطلب.', 'error'); return; }
      var body = '<form id="rejectForm" class="form-grid" novalidate>'
        + '<div class="field span-2"><label for="f_reason">سبب الرفض</label>'
        + '<textarea class="control" id="f_reason" name="reason" maxlength="300" required></textarea>'
        + '<span class="hint">سيظهر هذا السبب في سجل الطلب.</span></div></form>';
      openModal('رفض طلب: ' + a.name, body,
        '<button class="btn btn-ghost" data-act="close-modal">إلغاء</button>'
        + '<button class="btn btn-primary" data-act="save-reject-application" data-id="' + esc(id) + '">تأكيد الرفض</button>');
    }

    function decideApplication(id, decision) {
      var payload = {};
      if (decision === 'reject') {
        var form = $('#rejectForm');
        if (!form || !form.reportValidity()) return;
        payload.reason = new FormData(form).get('reason');
      } else if (!window.confirm('تأكيد قبول الطلب؟ سيتم إنشاء سجل الجمعية وحساب دخولها فورًا.')) {
        return;
      }
      busy(true);
      api('reviewAssociationApplication', state.token, id, decision, payload.reason || '').then(function (result) {
        state.data = result.data;
        closeModal();
        render();
        if (decision === 'accept') {
          openModal('تم إنشاء الجمعية',
            '<p>تم قبول الطلب وإنشاء حساب الجمعية بنجاح.</p>'
            + '<div class="metas"><div class="meta"><small>رقم الجمعية</small><strong class="mono">' + esc(result.associationId) + '</strong></div>'
            + '<div class="meta"><small>كلمة المرور المؤقتة</small><strong class="mono" dir="ltr">' + esc(result.temporaryPassword) + '</strong></div></div>'
            + '<p class="hint">سلّم هذه الكلمة لمسؤول الجمعية عبر قناة آمنة الآن — لن تُعرض مرة أخرى. يُنصح بتغييرها من داخل النظام بعد أول دخول.</p>',
            '<button class="btn btn-primary" data-act="close-modal">تم</button>');
        } else {
          toast('تم رفض الطلب.', 'success');
        }
      }, reportError).then(function () { busy(false); });
    }

    function findAssociation(id) {
      var list = state.data.associations || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    function viewAssociation(id) {
      var a = findAssociation(id);
      if (!a) { toast('تعذر العثور على الجمعية.', 'error'); return; }
      var body = '<div class="card-head"><div><h3>' + esc(a.name) + '</h3>'
        + '<p class="mono">' + esc(a.id) + '</p></div>' + statusChip(a.status) + '</div>'
        + '<div class="metas">'
        + '<div class="meta"><small>التصنيف</small><strong>' + esc(a.category || '—') + '</strong></div>'
        + '<div class="meta"><small>الموقع</small><strong>' + esc(a.region) + ' · ' + esc(a.city) + '</strong></div>'
        + '<div class="meta"><small>التواصل</small><strong dir="ltr" class="mono">' + esc(a.phone) + '</strong></div>'
        + '<div class="meta"><small>البريد</small><strong dir="ltr" class="mono">' + esc(a.email) + '</strong></div>'
        + '<div class="meta"><small>المستفيدون</small><strong>' + fmt(a.beneficiaries) + '</strong></div>'
        + '<div class="meta"><small>المناديب</small><strong>' + fmt(a.delegates) + '</strong></div>'
        + '<div class="meta"><small>المعتمدة / المستلمة</small><strong>' + fmt(a.approvedDevices) + ' / '
        + fmt(a.receivedDevices) + '</strong></div>'
        + '<div class="meta"><small>المسلّمة</small><strong>' + fmt(a.deliveredDevices) + '</strong></div></div>'
        + '<h4 style="margin:18px 0 8px;color:var(--zad-800)">نسبة إنجاز التسليم</h4>' + bar(a.progress);
      openModal('صفحة الجمعية', body, '<button class="btn btn-ghost" data-act="close-modal">إغلاق</button>');
    }

    function associationForm(id) {
      var a = (id && findAssociation(id)) || {};
      var isEdit = Boolean(id);
      var credentials = isEdit ? '' : '<div class="field span-2"><label for="f_password">كلمة مرور حساب الجمعية</label>'
        + '<input class="control" id="f_password" name="password" type="password" dir="ltr" minlength="10" required>'
        + '<span class="hint">١٠ خانات على الأقل، وتضم حروفًا وأرقامًا. سلّمها لمسؤول الجمعية عبر قناة آمنة.</span></div>';
      var body = '<form id="associationForm" class="form-grid" novalidate>'
        + '<input type="hidden" name="id" value="' + esc(id || '') + '">'
        + textField('name', 'اسم الجمعية', a.name, {required: true, max: 150, span: true})
        + associationCategoryField(a.category)
        + '<div class="field"><label for="f_status">الحالة</label>'
        + '<select class="control" id="f_status" name="status">'
        + '<option value="نشطة"' + (a.status === 'غير نشطة' ? '' : ' selected') + '>نشطة</option>'
        + '<option value="غير نشطة"' + (a.status === 'غير نشطة' ? ' selected' : '') + '>غير نشطة</option>'
        + '</select></div>'
        + regionCityFields(a.region, a.city, 'f')
        + textField('phone', 'رقم التواصل', a.phone, {required: true, ltr: true})
        + '<div class="field"><label for="f_email">البريد الإلكتروني</label>'
        + '<input class="control" id="f_email" name="email" type="email" dir="ltr" value="' + esc(a.email || '')
        + '" required></div>' + credentials + '</form>';
      openModal(isEdit ? 'تعديل بيانات الجمعية' : 'إضافة جمعية',
        body,
        '<button class="btn btn-ghost" data-act="close-modal">إلغاء</button>'
        + '<button class="btn btn-primary" data-act="save-association">'
        + (isEdit ? 'حفظ التعديلات' : 'إنشاء الجمعية وحسابها') + '</button>');
    }

    function saveAssociation() {
      var form = $('#associationForm');
      if (!form || !form.reportValidity()) return;
      var data = new FormData(form);
      var payload = {
        id: data.get('id') || '',
        name: data.get('name'),
        category: data.get('category'),
        region: data.get('region'),
        city: data.get('city'),
        phone: data.get('phone'),
        email: data.get('email'),
        status: data.get('status')
      };
      if (data.get('password')) payload.password = data.get('password');
      busy(true);
      api('saveAssociation', state.token, payload).then(function (result) {
        state.data = result.data;
        closeModal();
        render();
        toast('تم حفظ بيانات الجمعية.', 'success');
      }, reportError).then(function () { busy(false); });
    }

    /* ============================================================
       9) الأجهزة
       ============================================================ */

    function renderDevices() {
      var all = state.data.devices || [];
      var items = applyFilters(all, ['name', 'id', 'type', 'beneficiaryId']);
      var isAdmin = state.data.role === 'ADMIN';
      if (!all.length) {
        return emptyState({glyph: ICONS.devices, title: 'لا توجد أجهزة مسجّلة',
          body: isAdmin ? 'أضف الأجهزة إلى المستودع ثم خصّصها للجمعيات والمستفيدين.'
            : 'لم تُعتمد أجهزة لجمعيتك بعد.',
          action: isAdmin ? 'new-device' : '', actionLabel: '＋ إضافة جهاز'});
      }
      var rows = items.map(function (device) {
        var beneficiary = findBeneficiary(device.beneficiaryId);
        return '<tr><td><strong>' + needGlyph(device.name) + ' ' + esc(device.name) + '</strong></td>'
          + '<td class="mono">' + esc(device.id) + '</td>'
          + '<td>' + esc(device.type) + '</td>'
          + '<td>' + esc(associationName(device.associationId)) + '</td>'
          + '<td>' + esc(beneficiary ? beneficiary.name : '—') + '</td>'
          + '<td>' + statusChip(device.status) + '</td>'
          + '<td class="muted">' + esc(device.createdAt || '—') + '</td>'
          + (isAdmin ? '<td><button class="btn btn-link" data-act="edit-device" data-id="'
            + esc(device.id) + '">تعديل</button></td>' : '') + '</tr>';
      }).join('');

      var table = items.length
        ? '<div class="table-wrap"><table class="data"><thead><tr>'
          + '<th>الجهاز</th><th>رقم الجهاز</th><th>النوع</th><th>الجمعية</th><th>المستفيد</th>'
          + '<th>الحالة</th><th>تاريخ الإضافة</th>' + (isAdmin ? '<th>إجراء</th>' : '')
          + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
        : emptyState({glyph: '⌕', title: 'لا نتائج مطابقة', body: 'جرّب تعديل البحث أو الفلتر.'});

      return toolbar({placeholder: 'ابحث باسم الجهاز أو رقمه…',
        filters: optionList(DEVICE_FILTERS, state.filter, 'كل الحالات'),
        count: fmt(items.length) + ' من ' + fmt(all.length)}) + table;
    }

    function findDevice(id) {
      var list = state.data.devices || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    function deviceForm(id) {
      var d = (id && findDevice(id)) || {};
      var associations = state.data.associations || [];
      var associationOptions = '<option value="">— بالمستودع المركزي —</option>'
        + associations.map(function (a) {
          return '<option value="' + esc(a.id) + '"' + (d.associationId === a.id ? ' selected' : '')
            + '>' + esc(a.name) + '</option>';
        }).join('');
      var beneficiaryOptions = '<option value="">— غير مخصص —</option>'
        + (state.data.beneficiaries || []).map(function (b) {
          return '<option value="' + esc(b.id) + '"' + (d.beneficiaryId === b.id ? ' selected' : '')
            + '>' + esc(b.name) + ' (' + esc(b.id) + ')</option>';
        }).join('');

      var body = '<form id="deviceForm" class="form-grid" novalidate>'
        + '<input type="hidden" name="id" value="' + esc(id || '') + '">'
        + textField('name', 'اسم الجهاز', d.name, {required: true, max: 100})
        + textField('type', 'النوع', d.type, {required: true, max: 80, hint: 'مثال: أجهزة كهربائية منزلية'})
        + '<div class="field"><label for="f_assoc">الجمعية</label>'
        + '<select class="control" id="f_assoc" name="associationId">' + associationOptions + '</select></div>'
        + '<div class="field"><label for="f_ben">المستفيد</label>'
        + '<select class="control" id="f_ben" name="beneficiaryId">' + beneficiaryOptions + '</select></div>'
        + '<div class="field span-2"><label for="f_status">حالة الجهاز</label>'
        + '<select class="control" id="f_status" name="status">' + optionList(DEVICE_FILTERS, d.status || 'بالمستودع')
        + '</select></div>'
        + '<div class="field span-2"><label for="f_notes">ملاحظات</label>'
        + '<textarea class="control" id="f_notes" name="notes" maxlength="500">' + esc(d.notes || '') + '</textarea></div>'
        + '</form>';

      openModal(id ? 'تعديل بيانات الجهاز' : 'إضافة جهاز', body,
        '<button class="btn btn-ghost" data-act="close-modal">إلغاء</button>'
        + '<button class="btn btn-primary" data-act="save-device">حفظ الجهاز</button>');
    }

    function saveDevice() {
      var form = $('#deviceForm');
      if (!form || !form.reportValidity()) return;
      var data = new FormData(form);
      busy(true);
      api('saveDevice', state.token, {
        id: data.get('id') || '',
        name: data.get('name'),
        type: data.get('type'),
        associationId: data.get('associationId'),
        beneficiaryId: data.get('beneficiaryId'),
        status: data.get('status'),
        notes: data.get('notes')
      }).then(function (result) {
        state.data = result.data;
        closeModal();
        render();
        toast('تم حفظ بيانات الجهاز.', 'success');
      }, reportError).then(function () { busy(false); });
    }

    /* ============================================================
       10) المناديب
       ============================================================ */

    function renderDelegates() {
      var all = state.data.delegates || [];
      var items = applyFilters(all, ['name', 'id', 'phone']);
      var canManage = state.data.role === 'ASSOCIATION';
      if (!all.length) {
        return emptyState({glyph: ICONS.delegates, title: 'لا يوجد مناديب',
          body: 'أضف مندوبًا ليستلم مهام التسليم الميداني ويوثّقها بالصورة.',
          action: canManage ? 'new-delegate' : '', actionLabel: '＋ إضافة مندوب'});
      }
      var body = items.length ? '<div class="cards">' + items.map(function (d) {
        var actions = canManage
          ? '<div class="card-actions">'
            + '<button class="btn btn-ghost btn-sm" data-act="regen-code" data-id="' + esc(d.id) + '">رمز جديد</button>'
            + '<button class="btn ' + (d.status === 'نشط' ? 'btn-danger' : 'btn-soft') + ' btn-sm" '
            + 'data-act="toggle-delegate" data-id="' + esc(d.id) + '" data-value="'
            + (d.status === 'نشط' ? 'غير نشط' : 'نشط') + '">'
            + (d.status === 'نشط' ? 'تعطيل' : 'تفعيل') + '</button></div>'
          : '';
        return '<article class="card"><div class="card-head"><div><h3>' + esc(d.name) + '</h3>'
          + '<p class="mono">' + esc(d.id) + '</p></div>' + statusChip(d.status) + '</div>'
          + '<div class="metas">'
          + '<div class="meta"><small>رقم الجوال</small><strong dir="ltr" class="mono">' + esc(d.phone) + '</strong></div>'
          + '<div class="meta"><small>مهام حالية</small><strong>' + fmt(d.assigned) + '</strong></div>'
          + '<div class="meta"><small>تم خدمتهم</small><strong>' + fmt(d.served) + '</strong></div>'
          + '<div class="meta"><small>آخر دخول</small><strong>' + esc(d.lastLogin || 'لم يدخل') + '</strong></div>'
          + '</div>' + actions + '</article>';
      }).join('') + '</div>'
        : emptyState({glyph: '⌕', title: 'لا نتائج مطابقة', body: 'جرّب كلمة بحث أخرى.'});

      return toolbar({placeholder: 'ابحث باسم المندوب أو رقمه…', filters: '',
        count: fmt(items.length) + ' من ' + fmt(all.length)}) + body;
    }

    function delegateForm() {
      var body = '<form id="delegateForm" class="form-grid" novalidate>'
        + textField('name', 'اسم المندوب', '', {required: true, max: 120, span: true})
        + textField('phone', 'رقم الجوال', '', {required: true, ltr: true, span: true,
            hint: 'يُستخدم للتواصل ولا يُستخدم للدخول. الدخول يتم برمز يُنشئه النظام.'})
        + '</form>';
      openModal('إضافة مندوب', body,
        '<button class="btn btn-ghost" data-act="close-modal">إلغاء</button>'
        + '<button class="btn btn-primary" data-act="save-delegate">إنشاء المندوب ورمز الدخول</button>');
    }

    function showAccessCode(title, code, note) {
      openModal(title,
        '<div class="code-reveal"><p class="muted">رمز دخول المندوب</p>'
        + '<div class="code">' + esc(code) + '</div>'
        + '<p class="muted">' + esc(note) + '</p></div>',
        '<button class="btn btn-primary" data-act="close-and-refresh">تم، أغلق</button>');
    }

    function saveDelegate() {
      var form = $('#delegateForm');
      if (!form || !form.reportValidity()) return;
      var data = new FormData(form);
      var association = state.data.association || {};
      busy(true);
      api('saveDelegate', state.token, {
        name: data.get('name'), phone: data.get('phone'), associationId: association.id || ''
      }).then(function (result) {
        state.data = result.data;
        showAccessCode('تم إنشاء المندوب', result.accessCode,
          'اعرض الرمز للمندوب الآن — لن يظهر مرة أخرى. يمكنك إنشاء بديل في أي وقت.');
      }, reportError).then(function () { busy(false); });
    }

    function regenerateCode(id) {
      if (!window.confirm('سيتوقف الرمز الحالي فورًا ولن يستطيع المندوب الدخول به. هل تريد المتابعة؟')) return;
      busy(true);
      api('regenerateDelegateCode', state.token, id).then(function (result) {
        showAccessCode('رمز الدخول الجديد', result.accessCode, 'الرمز السابق لم يعد صالحًا.');
      }, reportError).then(function () { busy(false); });
    }

    function toggleDelegate(id, next) {
      var verb = next === 'نشط' ? 'تفعيل' : 'تعطيل';
      if (!window.confirm('هل تريد ' + verb + ' هذا المندوب؟')) return;
      busy(true);
      api('setDelegateStatus', state.token, id, next).then(function (result) {
        state.data = result.data;
        render();
        toast('تم ' + verb + ' المندوب.', 'success');
      }, reportError).then(function () { busy(false); });
    }

    /* ============================================================
       11) الأنشطة وسجل العمليات والإعدادات
       ============================================================ */

    var ACTIVITY_STATUSES = ['لم يبدأ', 'جارٍ', 'متأخر', 'مكتمل'];
    var ACTIVITY_TABS = [
      {value: '', label: 'الكل'}, {value: 'جارٍ', label: 'جارية'},
      {value: 'متأخر', label: 'متأخرة'}, {value: 'مكتمل', label: 'مكتملة'},
      {value: 'لم يبدأ', label: 'قادمة'}
    ];

    function renderActivities() {
      var isAdmin = state.data.role === 'ADMIN';
      var stages = state.data.stages || [];
      var all = state.data.activities || [];
      if (!all.length) {
        return emptyState({glyph: ICONS.activities, title: 'لا توجد أنشطة مسجّلة',
          body: isAdmin ? 'أضف أول نشاط رئيسي أو فرعي لبدء متابعة مراحل المشروع.' : 'لم تُضَف أنشطة بعد.',
          action: isAdmin ? 'new-activity' : '', actionLabel: '＋ نشاط'});
      }
      var late = all.filter(function (x) { return x.status === 'متأخر'; });
      var stagesHtml = stages.length ? stages.map(function (s) {
        return '<div style="padding:12px 0;border-bottom:1px solid var(--line)">'
          + '<div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:8px">'
          + '<div><strong>' + esc(s.name || 'مرحلة غير مسماة') + '</strong> ' + statusChip(s.status) + '</div></div>'
          + bar(s.progress) + '</div>';
      }).join('') : emptyState({glyph: '◇', title: 'لا توجد مراحل', body: ''});

      var lateHtml = late.length ? late.map(function (x) {
        return '<div class="alert critical"><strong>' + esc(x.subActivity || x.mainActivity) + '</strong>'
          + '<small>' + esc(x.owner || 'بلا مسؤول') + ' · متأخر ' + fmt(x.delayDays) + ' يومًا</small></div>';
      }).join('') : emptyState({glyph: '✓', title: 'لا أنشطة متأخرة', body: 'الجدول الزمني منضبط حاليًا.'});

      var activeTab = state.activityTab || '';
      var tabsHtml = '<div class="segmented" role="tablist" aria-label="تصفية الأنشطة">'
        + ACTIVITY_TABS.map(function (tab) {
          return '<button type="button" role="tab" data-act="activity-tab" data-value="' + esc(tab.value) + '" '
            + 'aria-selected="' + (activeTab === tab.value) + '">' + esc(tab.label) + '</button>';
        }).join('') + '</div>';
      var activities = activeTab ? all.filter(function (x) { return x.status === activeTab; }) : all;

      var rows = activities.length ? activities.map(function (x) {
        return '<tr><td>' + esc(x.stage) + '</td><td>' + esc(x.mainActivity) + '</td>'
          + '<td>' + esc(x.subActivity) + '</td><td>' + esc(x.owner) + '</td>'
          + '<td class="muted">' + esc(x.endDate || '—') + '</td><td>' + fmt(x.progress) + '٪</td>'
          + '<td>' + statusChip(x.status) + '</td>'
          + '<td>' + (x.evidenceUrl
            ? '<a href="' + esc(x.evidenceUrl) + '" target="_blank" rel="noopener noreferrer">فتح ↗</a>'
            : '<span class="muted">—</span>') + '</td>'
          + (isAdmin ? '<td><button class="btn btn-link" data-act="edit-activity" '
            + 'data-stage="' + esc(x.stage) + '" data-main="' + esc(x.mainActivity) + '" data-sub="' + esc(x.subActivity) + '">'
            + 'تعديل</button></td>' : '') + '</tr>';
      }).join('') : '<tr><td colspan="' + (isAdmin ? 9 : 8) + '"><div class="empty" style="padding:24px 0">'
        + '<p>لا توجد أنشطة مطابقة لهذه التصفية.</p></div></td></tr>';

      return '<section class="cols">'

    /**
     * يطبّع أي صيغة سعودية شائعة إلى المحلية 05XXXXXXXX، دفاعًا في
     * العمق ضد بيانات قديمة قد تكون بلا صفر بادئ (كانت تُخزَّن كذلك
     * قبل إصلاح normalizePhone_ في الخادم). لا يفشل بصمت — يعيد
     * المدخل كما هو إن لم يتعرّف على شكله بدل إنتاج رابط فاسد صامت.
     */
    function phoneLocal(value) {
      var digits = String(value || '').replace(/\D/g, '');
      if (digits.indexOf('966') === 0) return '0' + digits.slice(3);
      if (digits.charAt(0) === '5' && digits.length === 9) return '0' + digits;
      return digits;
    }
    function phoneIntl(value) {
      var local = phoneLocal(value);
      return local.charAt(0) === '0' ? '966' + local.slice(1) : local;
    }

    function handleProofFile(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      if (file.size > 6 * 1024 * 1024) {
        toast('حجم الصورة يتجاوز ٦ ميجابايت. صوّر بجودة أقل.', 'error');
        input.value = '';
        return;
      }
      if (['image/jpeg', 'image/png', 'image/webp'].indexOf(file.type) < 0) {
        toast('صيغة الصورة غير مدعومة. استخدم JPG أو PNG أو WEBP.', 'error');
        input.value = '';
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        state.proofData = reader.result;
        var img = $('#proofPreview');
        var hint = $('#proofHint');
        if (img) { img.src = state.proofData; img.classList.remove('hidden'); }
        if (hint) hint.textContent = 'تم إرفاق الصورة. راجعها قبل التأكيد.';
      };
      reader.onerror = function () { toast('تعذر قراءة الصورة.', 'error'); };
      reader.readAsDataURL(file);
    }

    }

    /**
     * تُجلب مرة واحدة لكل جلسة وتُخزَّن في الذاكرة — لا تُعاد مع كل تنقّل.
     * الفشل صامت ومقصود: قبل تشغيل الترحيل لا يوجد جدول مرجعي بعد،
     * فتستمر النماذج بحقول النص الحرة كما كانت دون أي رسالة خطأ للمستخدم.
     */
    function loadReferenceDataOnce() {
      if (state.referenceData) return;
      api('getReferenceData', state.token).then(function (data) {
        if (data && data.ready) state.referenceData = data;
      }, function () { /* تجاهل متعمّد — سقوط آمن للنص الحر */ });
    }

    function doLogout(callServer) {
      var finish = function () {
        safeSession('remove', 'zad_token');
        state.token = '';
        state.user = null;
        state.data = null;
        state.proofData = '';
        state.pendingRows = [];
        state.referenceData = null;
        closeModal();
        renderLogin();
      };
      if (callServer !== false && state.token) {
        api('logout', state.token).then(finish, finish);
        return;
      }
      finish();
    }

    function refreshData() {
      busy(true);
      api('getBootstrapData', state.token).then(function (data) {
        state.data = data;
        render();
        toast('تم تحديث البيانات.', 'success');
      }, reportError).then(function () { busy(false); });
    }

    function toggleMenu() {
      var sidebar = $('#sidebar');
      if (!sidebar) return;
      var open = sidebar.classList.toggle('open');
      var scrim = $('.scrim');
      if (open && !scrim) {
        var node = document.createElement('div');
        node.className = 'scrim';
        node.setAttribute('data-act', 'toggle-menu');
        document.body.appendChild(node);
      } else if (!open && scrim) {
        scrim.remove();
      }
    }

    /* ============================================================
       15) توجيه الأحداث — لا يوجد أي inline handler في هذا الملف
       ============================================================ */

    var CLICK_ACTIONS = {
      'go': function (el) { goTo(el.getAttribute('data-value')); },
      'kpi-nav': function (el) {
        var page = el.getAttribute('data-page');
        var filter = el.getAttribute('data-filter') || '';
        goTo(page);
        if (filter) { state.filter = filter; render(); }
      },
      'login-type': function (el) { state.loginType = el.getAttribute('data-value'); renderLogin(); },
      'show-apply': function () { loadReferenceDataOnce(); renderApplyForm(); },
      'back-to-login': renderLogin,
      'view-application': function (el) { viewApplication(el.getAttribute('data-id')); },
      'accept-application': function (el) { decideApplication(el.getAttribute('data-id'), 'accept'); },
      'reject-application': function (el) { rejectApplicationModal(el.getAttribute('data-id')); },
      'save-reject-application': function (el) { decideApplication(el.getAttribute('data-id'), 'reject'); },
      'new-activity': function () { activityForm('', '', ''); },
      'edit-activity': function (el) {
        activityForm(el.getAttribute('data-stage'), el.getAttribute('data-main'), el.getAttribute('data-sub'));
      },
      'save-activity': saveActivity,
      'activity-tab': function (el) { state.activityTab = el.getAttribute('data-value') || ''; render(); },
      'logout': function () { doLogout(true); },
      'refresh': refreshData,
      'toggle-menu': toggleMenu,
      'close-modal': closeModal,
      'close-and-refresh': function () { closeModal(); render(); },
      'new-beneficiary': function () { beneficiaryForm(''); },
      'edit-beneficiary': function (el) { closeModal(); beneficiaryForm(el.getAttribute('data-id')); },
      'view-beneficiary': function (el) { viewBeneficiary(el.getAttribute('data-id')); },
      'save-beneficiary': saveBeneficiary,
      'assign-delegate': function (el) { closeModal(); assignDelegateModal(el.getAttribute('data-id')); },
      'save-assign': function (el) { saveAssign(el.getAttribute('data-id')); },
      'bulk-import': bulkImportModal,
      'run-import': runImport,
      'new-association': function () { associationForm(''); },
      'edit-association': function (el) { associationForm(el.getAttribute('data-id')); },
      'view-association': function (el) { viewAssociation(el.getAttribute('data-id')); },
      'save-association': saveAssociation,
      'new-device': function () { deviceForm(''); },
      'edit-device': function (el) { deviceForm(el.getAttribute('data-id')); },
      'save-device': saveDevice,
      'new-delegate': delegateForm,
      'save-delegate': saveDelegate,
      'regen-code': function (el) { regenerateCode(el.getAttribute('data-id')); },
      'toggle-delegate': function (el) { toggleDelegate(el.getAttribute('data-id'), el.getAttribute('data-value')); },
      'save-settings': saveAssociationSettings,
      'save-password': savePassword,
      'dg-tab': function (el) { state.delegatePage = el.getAttribute('data-value'); renderDelegate(); },
      'dg-settings': delegateSettings,
      'dg-status': function (el) { delegateStatusModal(el.getAttribute('data-id')); },
      'dg-save-status': function (el) { saveDelegateStatus(el.getAttribute('data-id')); },
      'dg-deliver': function (el) { deliveryModal(el.getAttribute('data-id')); },
      'dg-save-delivery': function (el) { saveDelivery(el.getAttribute('data-id')); }
    };

    /**
     * لا تمنع الرابط الأصلي tel: من العمل — لكن iframe الخاص بـ Apps
     * Script قد يحجب فتح تطبيق الاتصال دون أي خطأ ظاهر. إن لم يغادر
     * المتصفح الصفحة خلال مهلة قصيرة (بلا blur)، نفترض أن الفتح
     * حُجب، وننسخ الرقم تلقائيًا كبديل واضح بدل فشل صامت.
     */
    function handleCallFallback(phone) {
      var left = false;
      var onBlur = function () { left = true; window.removeEventListener('blur', onBlur); };
      window.addEventListener('blur', onBlur);
      setTimeout(function () {
        window.removeEventListener('blur', onBlur);
        if (left) return;
        copyToClipboard(phone).then(function (copied) {
          toast(copied ? ('تعذّر فتح تطبيق الاتصال — نُسخ الرقم ' + phone + ' تلقائيًا.')
            : ('تعذّر فتح تطبيق الاتصال. الرقم: ' + phone), copied ? 'success' : 'error');
        });
      }, 700);
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
      }
      try {
        var area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        var ok = document.execCommand('copy');
        area.remove();
        return Promise.resolve(ok);
      } catch (error) {
        return Promise.resolve(false);
      }
    }

    document.addEventListener('click', function (event) {
      var backdrop = event.target.classList && event.target.classList.contains('backdrop');
      if (backdrop) { closeModal(); return; }
      var el = event.target.closest ? event.target.closest('[data-act]') : null;
      if (!el) return;
      var action = el.getAttribute('data-act');
      if (action === 'backdrop' || action === 'set-search' || action === 'set-filter'
        || action === 'bulk-file' || action === 'proof-file') return;
      if (action === 'call-fallback') { handleCallFallback(el.getAttribute('data-phone')); return; }
      var handler = CLICK_ACTIONS[action];
      if (!handler) return;
      event.preventDefault();
      handler(el);
    });

    var searchTimer = null;
    document.addEventListener('input', function (event) {
      var el = event.target;
      if (!el.getAttribute || el.getAttribute('data-act') !== 'set-search') return;
      var value = el.value;
      window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(function () {
        state.search = value;
        render();
        var box = $('#searchBox');
        if (box) {
          box.focus();
          box.setSelectionRange(box.value.length, box.value.length);
        }
      }, 220);
    });

    document.addEventListener('change', function (event) {
      var el = event.target;
      var action = el.getAttribute ? el.getAttribute('data-act') : null;
      if (action === 'set-filter') { state.filter = el.value; render(); return; }
      if (action === 'bulk-file') { handleBulkFile(el); return; }
      if (action === 'proof-file') { handleProofFile(el); return; }
      if (action === 'region-select') { onRegionChange(el); }
    });

    /** يعيد تعبئة قائمة المدن فور اختيار المنطقة، ويقفلها إن لم تُختر منطقة بعد. */
    function onRegionChange(regionSelect) {
      var citySelect = document.getElementById(regionSelect.getAttribute('data-city-target'));
      if (!citySelect) return;
      var ref = state.referenceData;
      var cities = (ref && ref.citiesByRegion[regionSelect.value]) || [];
      citySelect.innerHTML = optionList(cities, '', cities.length ? '— اختر المدينة —' : '— اختر المنطقة أولًا —');
      citySelect.disabled = !cities.length;
    }

    document.addEventListener('submit', function (event) {
      var form = event.target;
      var action = form.getAttribute && form.getAttribute('data-act');
      if (action === 'submit-login') { event.preventDefault(); submitLogin(form); return; }
      if (action === 'submit-application') { event.preventDefault(); submitApplication(form); return; }
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && $('#modalRoot').innerHTML) closeModal();
    });

    /* ============================================================
       16) الإقلاع
       ============================================================ */

    window.__zadReady = true;
    restoreSession();
  </script>
</body>
</html>
