    function submitLogin(form) {
      if (!form.reportValidity()) return;
      var data = new FormData(form);
      var payload = state.loginType === 'delegate'
        ? {type: 'delegate', code: data.get('code')}
        : {type: 'user', email: data.get('email'), password: data.get('password')};
      busy(true);
      api('login', payload).then(function (result) {
        state.token = result.token;
        state.user = result.user;
        safeSession('set', 'zad_token', result.token);
        // حساب مُلزَم بتغيير كلمة مرور مؤقتة: لا بيانات بوابة بعد — يجب
        // تغييرها أولًا. الخادم نفسه يرفض أي دالة أخرى لهذه الجلسة.
        if (result.mustChangePassword) {
          state.data = null;
          renderForcePasswordChange();
          return;
        }
        state.data = result.bootstrap;
        state.page = 'dashboard';
        // الخادم يُرفق المصادر المرجعية مع استجابة الدخول نفسها، فلا
        // حاجة لجولة ثانية إلا إن غابت لسبب ما (توافق خلفي).
        if (result.referenceData && result.referenceData.ready) {
          state.referenceData = result.referenceData;
          state.referenceError = '';
        }
        render();
        if (state.data.role === 'ADMIN') fetchActivitiesBundle();
        toast('مرحبًا بك، ' + (result.user && result.user.name ? result.user.name : ''), 'success');
        if (!state.referenceData) loadReferenceDataOnce();
      }, reportError).finally(function () { busy(false); });
    }

    /** شاشة إلزامية كاملة الصفحة: لا وصول لأي بيانات بوابة قبل تغيير كلمة المرور المؤقتة. */
    function renderForcePasswordChange() {
      $('#root').innerHTML = '<main class="login">'
        + '<section class="login-panel">' + lockup({partner: true})
        + '<div class="login-divider" aria-hidden="true"></div>'
        + '<h2 style="margin:0 0 6px;color:var(--zad-800)">يجب تغيير كلمة المرور المؤقتة</h2>'
        + '<p class="hint" style="margin:0 0 20px">هذا حساب جمعية بكلمة مرور مؤقتة (أُنشئت حديثًا أو أُعيد تعيينها). '
        + 'لا يمكن المتابعة إلى النظام قبل اختيار كلمة مرور جديدة خاصة بك.</p>'
        // تصريح مسبق بما سيحدث فعليًا: تغيير كلمة المرور يُبطل كل الجلسات
        // القائمة (بما فيها هذه) عمدًا لأسباب أمنية، فيعود المستخدم لشاشة
        // الدخول. إخفاء ذلك خلف زر مكتوب عليه "المتابعة" كان يبدو خللًا.
        + '<p class="hint" style="margin:-10px 0 20px"><strong>ما سيحدث بعد الحفظ:</strong> '
        + 'سيُطلب منك تسجيل الدخول من جديد بكلمة المرور الجديدة — هذا مقصود، '
        + 'لأن تغيير كلمة المرور يُنهي كل الجلسات المفتوحة على أي جهاز آخر أيضًا.</p>'
        + '<form id="forcePasswordForm" data-act="submit-force-password" novalidate>'
        + '<div class="field"><label for="fp_current">كلمة المرور المؤقتة الحالية</label>'
        + '<input class="control" id="fp_current" name="current" type="password" dir="ltr" autocomplete="current-password" required></div>'
        + '<div class="field"><label for="fp_next">كلمة المرور الجديدة</label>'
        + '<input class="control" id="fp_next" name="next" type="password" dir="ltr" minlength="10" autocomplete="new-password" required></div>'
        + '<div class="field"><label for="fp_confirm">تأكيد كلمة المرور الجديدة</label>'
        + '<input class="control" id="fp_confirm" name="confirm" type="password" dir="ltr" minlength="10" autocomplete="new-password" required></div>'
        + '<span class="hint">١٠ خانات على الأقل، وتضم حروفًا وأرقامًا، ومختلفة عن كلمة المرور الحالية والسابقة.</span>'
        + '<button class="btn btn-primary btn-block" type="submit" style="margin-top:16px">حفظ كلمة المرور وتسجيل الدخول من جديد</button>'
        + '</form>'
        + '<button type="button" class="btn btn-ghost btn-block" data-act="logout" style="margin-top:10px">تسجيل الخروج بدل ذلك</button>'
        + '</section>'
        + '<aside class="login-art"><div class="art-card">'
        + '<div class="art-seal" aria-hidden="true">' + ZAD_SEAL_SVG + '</div>'
        + '<h2>خطوة أمان أخيرة</h2>'
        + '<p>كلمة مرور مؤقتة لا تُستخدم إلا مرة واحدة — اختر كلمة خاصة بك الآن لتأمين حساب جمعيتك.</p>'
        + '</div></aside></main>';
      var first = $('#forcePasswordForm .control');
      if (first) first.focus();
    }

    function submitForcePasswordChange(form) {
      if (!form.reportValidity()) return;
      var data = new FormData(form);
      if (data.get('next') !== data.get('confirm')) {
        toast('تأكيد كلمة المرور غير مطابق.', 'error');
        return;
      }
      busy(true);
      api('changePassword', state.token, data.get('current'), data.get('next')).then(function () {
        safeSession('remove', 'zad_token');
        state.token = '';
        state.user = null;
        state.data = null;
        renderLogin();
        toast('تم تغيير كلمة المرور بنجاح. سجّل الدخول بكلمة المرور الجديدة.', 'success');
      }, reportError).finally(function () { busy(false); });
    }

    /**
     * نموذج عام (بلا تسجيل دخول) لتقديم طلب انضمام جمعية جديدة. الإدارة
     * تراجعه لاحقًا من صفحة "طلبات الانضمام" فتقبله أو ترفضه.
     */
    var EMAIL_DOMAINS = ['gmail.com', 'hotmail.com', 'outlook.com', 'yahoo.com'];
    var APPLY_STEP_LABELS = ['بيانات الجمعية', 'أسئلة القبول', 'المرفق والإقرار'];

    function genRequestId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
      return 'req' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    }

    /**
     * clientRequestId يُحفظ في sessionStorage (لا الذاكرة وحدها) كي ينجو
     * من إعادة تحميل الصفحة أثناء انتظار طويل غير مؤكَّد (السيناريو الحي
     * المرصود: ~370 ثانية). طالما لم يُرسَل طلب ناجح بهذا المعرّف بعد،
     * إعادة استخدامه آمنة تمامًا — الخادم يعاملها كإعادة محاولة idempotent.
     */
    function ensureApplyRequestId() {
      var stored = safeSession('get', 'zad_apply_reqid');
      state.apply.clientRequestId = stored || genRequestId();
      if (!stored) safeSession('set', 'zad_apply_reqid', state.apply.clientRequestId);
    }

    function clearApplyRequestId() {
      safeSession('remove', 'zad_apply_reqid');
      state.apply = {step: 1, clientRequestId: '', licenseData: '', licenseMeta: null};
    }

    function applyStepsHtml() {
      return '<div class="apply-steps">' + APPLY_STEP_LABELS.map(function (label, index) {
        var n = index + 1;
        var cls = n < state.apply.step ? 'done' : (n === state.apply.step ? 'current' : '');
        return '<div class="apstep ' + cls + '"><b aria-hidden="true">' + (n < state.apply.step ? '✓' : n) + '</b>'
          + '<span>' + esc(label) + '</span></div>';
      }).join('') + '</div>';
    }

    function applyStepOneHtml(hidden) {
      var ref = state.referenceData;
      var sectorField = (ref && ref.ready && ref.associationSectors && ref.associationSectors.length)
        ? '<div class="field"><label for="f_sector">مجال عمل الجمعية</label>'
          + '<select class="control" id="f_sector" name="sector" required>' + optionList(ref.associationSectors, '', '— اختر —') + '</select></div>'
        : referenceUnavailableField('مجال عمل الجمعية');
      return '<fieldset class="apply-fieldset"' + (hidden ? ' style="display:none"' : '') + '>'
        + '<legend>بيانات الجمعية</legend>'
        + textField('name', 'اسم الجمعية', '', {required: true, max: 150, span: true})
        + textField('licenseNumber', 'رقم الترخيص', '', {required: true, max: 60})
        + '<div class="field"><label for="f_licenseExpiryDate">تاريخ انتهاء الترخيص</label>'
        + '<input class="control" id="f_licenseExpiryDate" name="licenseExpiryDate" type="date" required></div>'
        + regionCityFields('', '', 'f')
        + sectorField
        + textField('contactName', 'اسم مسؤول التواصل', '', {required: true, max: 100})
        + textField('phone', 'رقم الجوال', '', {required: true, ltr: true, hint: 'صيغة سعودية: 05XXXXXXXX'})
        + '<div class="field span-2"><label for="f_emailLocal">البريد الإلكتروني</label>'
        + '<div class="email-builder"><input class="control" id="f_emailLocal" name="emailLocal" required '
        + 'placeholder="اسم المستخدم" autocomplete="off"><span aria-hidden="true">@</span>'
        + '<select class="control" id="f_emailDomain" name="emailDomain" data-act="email-domain">'
        + optionList(EMAIL_DOMAINS, '', '— اختر النطاق —') + '<option value="__other__">نطاق آخر…</option></select></div>'
        + '<input class="control hidden" id="f_emailDomainOther" name="emailDomainOther" placeholder="example.com" dir="ltr" style="margin-top:8px">'
        + '<span class="hint">يمكنك لصق البريد كاملًا في الحقل الأول وسنقسمه تلقائيًا.</span></div>'
        + textField('notes', 'ملاحظات إضافية (اختياري)', '', {span: true})
        + '<div class="hidden" aria-hidden="true"><label for="f_website">اترك هذا الحقل فارغًا</label>'
        + '<input id="f_website" name="website" tabindex="-1" autocomplete="off"></div>'
        + '</fieldset>';
    }

    function applyStepTwoHtml(hidden) {
      var ref = state.referenceData;
      var questions = (ref && ref.applicationQuestions) || [];
      if (!questions.length) {
        return '<fieldset class="apply-fieldset"' + (hidden ? ' style="display:none"' : '') + '>'
          + referenceUnavailableField('أسئلة القبول') + '</fieldset>';
      }
      var body = questions.map(function (q, index) {
        var name = 'q' + index;
        return '<fieldset class="yesno-q" role="radiogroup" aria-labelledby="' + name + '_lbl">'
          + '<legend id="' + name + '_lbl">' + esc(index + 1) + '. ' + esc(q.label) + '</legend>'
          + '<div class="yesno-toggle">'
          + '<input type="radio" id="' + name + '_y" name="' + name + '" value="نعم" required>'
          + '<label for="' + name + '_y">نعم</label>'
          + '<input type="radio" class="no-opt" id="' + name + '_n" name="' + name + '" value="لا">'
          + '<label for="' + name + '_n">لا</label></div></fieldset>';
      }).join('');
      return '<fieldset class="apply-fieldset" style="display:block' + (hidden ? ';display:none' : '') + '">'
        + '<legend>أسئلة القبول</legend><div class="span-2" style="grid-column:1/-1">' + body + '</div></fieldset>';
    }

    function applyStepThreeHtml(hidden) {
      var ref = state.referenceData;
      var pledgeText = (ref && ref.pledgeText) || 'أقر بصحة البيانات، واستعداد الجمعية لتقديم ما يثبتها عند الطلب، والالتزام بضوابط المشروع.';
      var hasFile = !!state.apply.licenseData;
      return '<fieldset class="apply-fieldset"' + (hidden ? ' style="display:none"' : '') + '>'
        + '<legend>المرفق والإقرار</legend>'
        + '<div class="field span-2"><label>صورة الترخيص الساري (JPG أو PNG أو WEBP، حتى 8 ميجابايت)</label>'
        + '<div class="drop"><label class="btn btn-primary" for="licenseFile">' + (hasFile ? 'استبدال الملف' : 'اختيار صورة الترخيص') + '</label>'
        + '<input id="licenseFile" type="file" data-act="license-file" accept="image/jpeg,image/png,image/webp">'
        + '<p class="muted" style="margin:8px 0 0" id="licenseFileHint">'
        + (hasFile ? 'تم إرفاق: ' + esc(state.apply.licenseMeta && state.apply.licenseMeta.name || '') : 'لم يُرفَق ملف بعد.') + '</p>'
        + '<img id="licenseFilePreview" class="proof-img' + (hasFile ? '' : ' hidden') + '" alt="معاينة صورة الترخيص" src="' + (hasFile ? esc(state.apply.licenseData) : '') + '"></div></div>'
        + '<label class="pledge span-2"><input id="f_pledgeAccepted" type="checkbox" name="pledgeAccepted" data-act="pledge-gate" required>'
        + '<span>' + esc(pledgeText) + '</span></label>'
        + '<div class="span-2" id="applyReview"></div>'
        + '</fieldset>';
    }

    function applyReviewHtml() {
      var form = $('#applyForm');
      if (!form) return '';
      var v = captureApplyForm();
      var ref = state.referenceData;
      var questions = (ref && ref.applicationQuestions) || [];
      var domain = v.emailDomain === '__other__' ? (v.emailDomainOther || '') : (v.emailDomain || '');
      var email = (v.emailLocal || '') + (domain ? '@' + domain : '');
      var rows = [
        ['اسم الجمعية', v.name], ['رقم الترخيص', v.licenseNumber], ['تاريخ الانتهاء', v.licenseExpiryDate],
        ['المنطقة/المدينة', (v.region || '') + ' · ' + (v.city || '')], ['مجال العمل', v.sector],
        ['المسؤول', v.contactName], ['الجوال', v.phone], ['البريد الإلكتروني', email]
      ];
      var list = '<ul class="review-list">' + rows.map(function (r) {
        return '<li><b>' + esc(r[0]) + '</b>' + esc(r[1] || '—') + '</li>';
      }).join('') + '</ul>';
      var answers = '<div class="review-answers">' + questions.map(function (q, index) {
        var val = v['q' + index] || '';
        return '<span class="tag' + (val === 'لا' ? ' no' : '') + '">' + esc(q.label) + ': ' + esc(val || '—') + '</span>';
      }).join('') + '</div>';
      return '<h4 style="margin:6px 0 4px;color:var(--zad-800)">مراجعة أخيرة قبل الإرسال</h4>' + list + answers;
    }

    /** يلتقط قيم كل حقول النموذج الحالية (بما فيها الأزرار الشعاعية والمربعات) بلا اعتماد على قائمة أسماء ثابتة. */
    function captureApplyForm() {
      var form = $('#applyForm');
      var out = {};
      if (!form) return out;
      Array.prototype.forEach.call(form.elements, function (el) {
        if (!el.name || el.type === 'file') return;
        if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) out[el.name] = el.value || 'on'; }
        else out[el.name] = el.value;
      });
      return out;
    }

    function restoreApplyForm(values) {
      var form = $('#applyForm');
      if (!form) return;
      Object.keys(values).forEach(function (name) {
        var el = form.elements[name];
        if (!el) return;
        if (el.type === 'checkbox') { el.checked = values[name] === (el.value || 'on'); return; }
        if (el.type === 'radio' || (el.length !== undefined && el[0] && el[0].type === 'radio')) {
          var nodes = el.length !== undefined ? el : [el];
          Array.prototype.forEach.call(nodes, function (radio) { radio.checked = radio.value === values[name]; });
          return;
        }
        el.value = values[name];
      });
      var regionField = form.elements.region;
      if (regionField && regionField.value) {
        onRegionChange(regionField);
        if (values.city && form.elements.city) form.elements.city.value = values.city;
      }
      toggleEmailOtherDomain();
    }

    function toggleEmailOtherDomain() {
      var form = $('#applyForm');
      if (!form || !form.elements.emailDomain) return;
      var other = form.elements.emailDomainOther;
      if (!other) return;
      other.classList.toggle('hidden', form.elements.emailDomain.value !== '__other__');
    }

    function renderApplyForm() {
      var keep = captureApplyForm();
      ensureApplyRequestId();
      var step = state.apply.step;
      $('#root').innerHTML = '<main class="login">'
        + '<section class="login-panel">' + lockup({partner: true})
        + '<h1>طلب انضمام جمعية جديدة</h1>'
        + '<p class="login-lede">عبّئ بيانات جمعيتك على ثلاث مراحل قصيرة، وسيتم التواصل معكم بعد مراجعة الطلب من إدارة المشروع.</p>'
        + applyStepsHtml()
        + '<form id="applyForm" class="form-grid" data-act="submit-application" novalidate>'
        + applyStepOneHtml(step !== 1)
        + applyStepTwoHtml(step !== 2)
        + applyStepThreeHtml(step !== 3)
        + '<div class="span-2" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">'
        + (step > 1 ? '<button type="button" class="btn btn-ghost" data-act="apply-prev">السابق</button>' : '<button type="button" class="btn btn-ghost" data-act="back-to-login">رجوع لتسجيل الدخول</button>')
        + (step < 3 ? '<button type="button" class="btn btn-primary" data-act="apply-next">التالي</button>'
          : '<button class="btn btn-primary" type="submit" id="applySubmitBtn">إرسال الطلب</button>')
        + '</div></form></section>'
        + '<aside class="login-art"><div class="art-card">'
        + '<div class="art-seal" aria-hidden="true">' + ZAD_SEAL_SVG + '</div>'
        + '<h2>شراكة موثّقة</h2>'
        + '<p>كل طلب يُراجَع يدويًا قبل إنشاء حساب الجمعية، لضمان دقة البيانات وسلامة الشراكة.</p>'
        + '</div></aside></main>';
      restoreApplyForm(keep);
      if (step === 3) {
        var reviewBox = $('#applyReview');
        if (reviewBox) reviewBox.innerHTML = applyReviewHtml();
        updatePledgeGate();
      }
      var first = $('#applyForm .control');
      if (first && !Object.keys(keep).length) first.focus();
    }

    function updatePledgeGate() {
      var btn = $('#applySubmitBtn');
      if (!btn) return;
      var pledge = $('#f_pledgeAccepted');
      btn.disabled = !(pledge && pledge.checked) || !state.apply.licenseData;
    }

    function applyStepNext() {
      var form = $('#applyForm');
      if (!form || !form.reportValidity()) return;
      // تحقّق ذكي إضافي (غير موجود في required العادي): تعارض تاريخ
      // انتهاء الترخيص مع الإجابة "الترخيص ساري؟" — يُنبَّه هنا مبكرًا،
      // والخادم يفرضه أيضًا مهما فعلت الواجهة.
      if (state.apply.step === 1) {
        var expiry = form.elements.licenseExpiryDate && form.elements.licenseExpiryDate.value;
        if (expiry && new Date(expiry) < new Date(new Date().toDateString())) {
          toast('تنبيه: تاريخ انتهاء الترخيص المُدخَل في الماضي — تحقق منه قبل المتابعة.', 'warn');
        }
      }
      state.apply.step = Math.min(3, state.apply.step + 1);
      renderApplyForm();
    }

    function applyStepPrev() {
      state.apply.step = Math.max(1, state.apply.step - 1);
      renderApplyForm();
    }

    function handleLicenseFile(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) {
        toast('حجم ملف الترخيص يتجاوز ٨ ميجابايت.', 'error');
        input.value = '';
        return;
      }
      if (['image/jpeg', 'image/png', 'image/webp'].indexOf(file.type) < 0) {
        toast('صيغة الملف غير مدعومة. استخدم JPG أو PNG أو WEBP.', 'error');
        input.value = '';
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        state.apply.licenseData = reader.result;
        state.apply.licenseMeta = {name: file.name, size: file.size, type: file.type};
        var img = $('#licenseFilePreview');
        var hint = $('#licenseFileHint');
        if (img) { img.src = state.apply.licenseData; img.classList.remove('hidden'); }
        if (hint) hint.textContent = 'تم إرفاق: ' + file.name;
        updatePledgeGate();
      };
      reader.onerror = function () { toast('تعذّر قراءة ملف الترخيص.', 'error'); };
      reader.readAsDataURL(file);
    }

    /**
     * يجمع اسم المستخدم والنطاق في بريد كامل — الخادم يُطبّق التحقق
     * النهائي دائمًا (requiredEmail_) بصرف النظر عمّا فعلته الواجهة.
     * يدعم أيضًا لصق بريد كامل في حقل اسم المستخدم: إن احتوى على "@"
     * يُقسَّم تلقائيًا إلى الاسم والنطاق (مع اختيار النطاق من القائمة
     * إن كان معروفًا، أو "نطاق آخر" تلقائيًا إن لم يكن).
     */
    function splitPastedEmail(localField) {
      var raw = localField.value;
      var at = raw.indexOf('@');
      if (at < 0) return;
      var local = raw.slice(0, at);
      var domain = raw.slice(at + 1).trim().toLowerCase();
      localField.value = local;
      var form = $('#applyForm');
      if (!form) return;
      var domainField = form.elements.emailDomain;
      var otherField = form.elements.emailDomainOther;
      if (!domainField) return;
      if (domain && EMAIL_DOMAINS.indexOf(domain) >= 0) {
        domainField.value = domain;
      } else if (domain) {
        domainField.value = '__other__';
        if (otherField) otherField.value = domain;
      }
      toggleEmailOtherDomain();
    }

    function submitApplication(form) {
      if (!form.reportValidity()) return;
      if (!state.apply.licenseData) { toast('أرفق صورة الترخيص أولًا.', 'error'); return; }
      var data = new FormData(form);
      var ref = state.referenceData;
      var questions = (ref && ref.applicationQuestions) || [];
      var answers = {};
      questions.forEach(function (q, index) { answers[q.key] = data.get('q' + index) === 'نعم'; });
      var domain = data.get('emailDomain') === '__other__' ? data.get('emailDomainOther') : data.get('emailDomain');
      var payload = {
        name: data.get('name'), licenseNumber: data.get('licenseNumber'),
        licenseExpiryDate: data.get('licenseExpiryDate'), region: data.get('region'), city: data.get('city'),
        sector: data.get('sector'), contactName: data.get('contactName'), phone: data.get('phone'),
        email: (data.get('emailLocal') || '') + '@' + (domain || ''), notes: data.get('notes'),
        website: data.get('website'), answers: answers,
        licenseFileDataUrl: state.apply.licenseData,
        pledgeAccepted: !!data.get('pledgeAccepted'),
        clientRequestId: state.apply.clientRequestId
      };
      busy(true);
      api('submitAssociationApplication', payload).then(function (result) {
        clearApplyRequestId();
        state.screen = '';
        renderLogin();
        toast(result.message || 'تم استلام طلب الانضمام.', 'success');
      }, function (error) {
        // مهلة زمنية = نتيجة غير مؤكَّدة، لا فشل مؤكَّد: نستعلم عن نتيجة
        // نفس clientRequestId فورًا بدل ترك المستخدم في شكّ، ولا نحذف
        // المعرّف من التخزين إلا حين نتأكّد من النتيجة الفعلية.
        if (error && error.timeout) { checkApplyStatusAfterTimeout(); return; }
        reportError(error);
      }).finally(function () { busy(false); });
    }

    function checkApplyStatusAfterTimeout() {
      var reqId = state.apply.clientRequestId;
      toast('استغرق الإرسال وقتًا أطول من المتوقع — جارٍ التحقق من نتيجته الفعلية…', 'warn');
      api('getApplicationStatus', reqId).then(function (status) {
        if (status.found) {
          clearApplyRequestId();
          state.screen = '';
          renderLogin();
          toast('تم استلام طلبكم فعليًا (رقم الطلب: ' + status.id + '). لا حاجة لإعادة الإرسال.', 'success');
        } else {
          toast('لم يصل الطلب إلى الخادم بعد. اضغط "إرسال الطلب" لإعادة المحاولة بأمان — لن يتكرر الطلب.', 'warn');
        }
      }, function () {
        toast('تعذّر التحقق من نتيجة الطلب الآن. اضغط "إرسال الطلب" لإعادة المحاولة بأمان — لن يتكرر الطلب.', 'warn');
      });
    }

    /* ============================================================
       5) الهيكل العام
       ============================================================ */

    function navFor(role) {
      if (role === 'ADMIN') {
        return ['dashboard', 'applications', 'beneficiaries', 'associations', 'devices', 'delegates', 'activities', 'audit', 'settings'];
      }
      return ['dashboard', 'beneficiaries', 'devices', 'delegates', 'audit', 'settings'];
    }

    function render() {
      // شاشة عامة معروضة حاليًا (تقديم جمعية) لا تملك state.data إطلاقًا —
      // إعادة الرسم بعد وصول القوائم المعتمدة يجب أن تُبقيها ظاهرة، لا أن
      // تُعيد المستخدم إلى شاشة الدخول وتُضيّع ما كتبه.
      if (state.screen === 'apply') { renderApplyForm(); return; }
      if (!state.data) { renderLogin(); return; }
      if (state.data.role === 'DELEGATE') { renderDelegate(); return; }

      var role = state.data.role;
      var items = navFor(role);
      var navHtml = items.map(function (key) {
        return '<button type="button" data-act="go" data-value="' + key + '"'
          + (state.page === key ? ' aria-current="page"' : '') + '>'
          + '<span class="ico" aria-hidden="true">' + ICONS[key] + '</span>' + esc(NAV_LABELS[key]) + '</button>';
      }).join('');

      var actorName = (state.user && state.user.name)
        || (state.data.association && state.data.association.name) || 'مستخدم النظام';
      var actorRole = role === 'ADMIN' ? 'مدير النظام'
        : (state.data.association ? state.data.association.name : 'حساب الجمعية');

      $('#root').innerHTML = '<div class="shell">'
        + '<aside class="sidebar" id="sidebar"><div class="sidebar-inner">'
        + lockup({compact: true, onDark: true})
        + '<nav class="nav" aria-label="التنقل الرئيسي">' + navHtml + '</nav></div>'
        + '<div class="side-foot"><div class="side-user"><strong>' + esc(actorName) + '</strong>'
        + '<span>' + esc(actorRole) + '</span></div>'
        + '<button class="btn btn-ghost btn-block btn-sm" data-act="logout">تسجيل الخروج</button></div></aside>'
        + '<div class="main"><header class="topbar">'
        + '<div><h2>' + esc(NAV_LABELS[state.page] || 'لوحة البيانات') + '</h2>'
        + '<span class="crumb">' + esc(NAV_HINTS[state.page] || '') + '</span></div>'
        + '<div class="top-actions">'
        + '<button class="btn btn-ghost btn-sm menu-btn" data-act="toggle-menu" aria-label="فتح القائمة">☰</button>'
        + '<button class="btn btn-ghost btn-sm" data-act="refresh">↻ تحديث</button>'
        + pageAction(role) + '</div></header>'
        + '<div class="content" id="content">' + renderPage() + '</div></div></div>';
    }

    function pageAction(role) {
      if (state.page === 'beneficiaries' && (role === 'ASSOCIATION' || role === 'ADMIN')) {
        return '<button class="btn btn-primary btn-sm" data-act="new-beneficiary">＋ مستفيد</button>';
      }
      if (state.page === 'delegates' && role === 'ASSOCIATION') {
        return '<button class="btn btn-primary btn-sm" data-act="new-delegate">＋ مندوب</button>';
      }
      if (state.page === 'associations' && role === 'ADMIN') {
        return '<button class="btn btn-primary btn-sm" data-act="new-association">＋ جمعية</button>';
      }
      if (state.page === 'devices' && role === 'ADMIN') {
        return '<button class="btn btn-primary btn-sm" data-act="new-device">＋ جهاز</button>';
      }
      return '';
    }

    function renderPage() {
      var pages = {
        dashboard: renderDashboard, applications: renderApplications, beneficiaries: renderBeneficiaries,
        associations: renderAssociations, devices: renderDevices,
        delegates: renderDelegates, activities: renderActivities,
        audit: renderAudit, settings: renderSettings
      };
      return (pages[state.page] || renderDashboard)();
    }

    /** الصفحات التي تُحمَّل عند فتحها فقط (لا ضمن Bootstrap) — مفتاحها في state.lazy وطريقة جلبها. */
    var LAZY_PAGES = {
      audit: 'listAuditLog', applications: 'listApplications',
      beneficiaries: 'listBeneficiaries', associations: 'listAssociations',
      devices: 'listDevices', delegates: 'listDelegates'
    };
    /** الصفحات التي تدعم فلتر "الجمعية" الإضافي، وللإدارة فقط (الجمعية نفسها مقيَّدة من الخادم بلا حاجة لاختيار). */
    var ASSOC_FILTER_PAGES = {beneficiaries: true, devices: true, delegates: true, audit: true};

    function goTo(page, presetFilter, presetAssocFilter) {
      state.page = page;
      state.search = '';
      state.filter = presetFilter || '';
      state.assocFilter = presetAssocFilter || '';
      state.sortBy = '';
      state.sortDir = 'asc';
      state.activityTab = '';
      if (LAZY_PAGES[page]) fetchLazyPage(page, LAZY_PAGES[page], 1);
      else if (page === 'activities' && state.data.role === 'ADMIN') fetchActivitiesBundle();
      render();
      var sidebar = $('#sidebar');
      if (sidebar) sidebar.classList.remove('open');
      var scrim = $('.scrim');
      if (scrim) scrim.remove();
      window.scrollTo(0, 0);
    }

    /** خيارات الطلب المشتركة لأي قسم مُرقَّم خادميًا — بحث/فلترة/فلتر جمعية (للإدارة)/ترتيب. */
    function lazyFetchOptions(key, page) {
      var options = {page: page || 1, pageSize: 25, search: state.search, filter: state.filter};
      if (state.data.role === 'ADMIN' && ASSOC_FILTER_PAGES[key] && state.assocFilter) options.associationId = state.assocFilter;
      if (state.sortBy) { options.sortBy = state.sortBy; options.sortDir = state.sortDir || 'asc'; }
      return options;
    }

    /** يجلب صفحة واحدة من قسم مُرقَّم (سجل العمليات/طلبات الانضمام/المستفيدون/الجمعيات/الأجهزة/المناديب) — يُعاد استخدامها للبحث والفلترة والترتيب وأزرار التنقّل بين الصفحات. */
    function fetchLazyPage(key, method, page) {
      state.lazy[key] = Object.assign({}, state.lazy[key], {loading: true});
      render();
      api(method, state.token, lazyFetchOptions(key, page))
        .then(function (result) {
          state.lazy[key] = Object.assign({loading: false}, result);
          render();
        }, function (error) {
          state.lazy[key] = Object.assign({items: [], total: 0, page: 1, totalPages: 1}, state.lazy[key], {loading: false});
          reportError(error);
          render();
        });
    }

    function fetchActivitiesBundle() {
      state.lazy.activities = Object.assign({}, state.lazy.activities, {loading: true});
      render();
      api('getActivitiesBundle', state.token).then(function (result) {
        state.lazy.activities = Object.assign({loading: false}, result);
        render();
      }, function (error) {
        state.lazy.activities = Object.assign({}, state.lazy.activities, {loading: false});
        reportError(error);
        render();
      });
    }

    /** عناصر تنقّل بسيطة بين صفحات قسم مُرقَّم — تُخفى تلقائيًا إن كانت صفحة واحدة فقط. */
    function pagerControls(key, bundle) {
      if (!bundle || !bundle.totalPages || bundle.totalPages <= 1) return '';
      return '<div class="pager">'
        + '<button type="button" class="btn btn-ghost btn-sm" data-act="' + key + '-prev-page"' + (bundle.page <= 1 ? ' disabled' : '') + '>← السابق</button>'
        + '<span class="muted">صفحة ' + fmt(bundle.page) + ' من ' + fmt(bundle.totalPages) + ' (' + fmt(bundle.total) + ' سجلًا)</span>'
        + '<button type="button" class="btn btn-ghost btn-sm" data-act="' + key + '-next-page"' + (bundle.page >= bundle.totalPages ? ' disabled' : '') + '>التالي →</button>'
        + '</div>';
    }

    /* ============================================================
       6) لوحة البيانات
       ============================================================ */

    function kpiCard(item) {
      var tag = item.page ? 'button' : 'article';
      var attrs = item.page
        ? ' type="button" class="kpi kpi-clickable' + (item.accent ? ' accent' : '') + '" data-act="kpi-nav" '
          + 'data-page="' + esc(item.page) + '" data-filter="' + esc(item.filter || '') + '" '
          + 'aria-label="عرض ' + esc(item.label) + ' في ' + esc(NAV_LABELS[item.page] || item.page) + '"'
        : ' class="kpi' + (item.accent ? ' accent' : '') + '"';
      return '<' + tag + attrs + '>'
        + '<div class="kpi-top"><span>' + esc(item.label) + '</span>'
        + '<span class="kpi-ico" aria-hidden="true">' + item.glyph + '</span></div>'
        + '<strong>' + (typeof item.value === 'number' ? fmt(item.value) : esc(item.value)) + '</strong>'
        + '<small>' + esc(item.hint) + '</small></' + tag + '>';
    }

    function renderDashboard() {
      var s = state.data.summary || {};
      var isAdmin = state.data.role === 'ADMIN';
      var kpis = isAdmin ? [
        {label: 'المستفيدون', value: s.beneficiaries, hint: 'ملف مستفيد', glyph: ICONS.beneficiaries, page: 'beneficiaries'},
        {label: 'الجمعيات', value: s.associations, hint: 'جمعية مشاركة', glyph: ICONS.associations, page: 'associations'},
        {label: 'إجمالي الأجهزة', value: s.devices, hint: 'جهاز مسجّل', glyph: ICONS.devices, page: 'devices'},
        {label: 'المناديب النشطون', value: s.delegates, hint: 'مندوب ميداني', glyph: ICONS.delegates, page: 'delegates'},
        {label: 'بالمستودع', value: s.devicesWarehouse, hint: 'جهاز جاهز للتخصيص', glyph: '▣', page: 'devices', filter: 'بالمستودع'},
        {label: 'قيد التسليم', value: s.devicesAllocated, hint: 'مخصص أو مع المندوب', glyph: '◫', page: 'devices', filter: 'مع المندوب'},
        {label: 'تم تسليمها', value: s.devicesDelivered, hint: 'جهاز موثّق بالصورة', glyph: '✓', accent: true, page: 'devices', filter: 'تم التسليم'},
        {label: 'نسبة الإنجاز', value: fmt(s.deliveryRate) + '٪', hint: 'من المستفيدين', glyph: '↗', accent: true, page: 'beneficiaries', filter: 'تم التسليم'}
      ] : [
        {label: 'المستفيدون', value: s.beneficiaries, hint: 'ملف مستفيد', glyph: ICONS.beneficiaries, page: 'beneficiaries'},
        {label: 'الأجهزة المعتمدة', value: s.devices, hint: 'جهاز للجمعية', glyph: ICONS.devices, page: 'devices'},
        {label: 'الأجهزة المستلمة', value: (s.devices || 0) - (s.devicesWarehouse || 0), hint: 'خرجت من المستودع', glyph: '◫', page: 'devices'},
        {label: 'الأجهزة المسلّمة', value: s.devicesDelivered, hint: 'وصلت للمستفيد', glyph: '✓', accent: true, page: 'devices', filter: 'تم التسليم'},
        {label: 'نسبة الإنجاز', value: fmt(s.deliveryRate) + '٪', hint: 'من المستفيدين', glyph: '↗', accent: true, page: 'beneficiaries', filter: 'تم التسليم'},
        {label: 'المناديب', value: s.delegates, hint: 'مندوب نشط', glyph: ICONS.delegates, page: 'delegates'}
      ];

      var activitiesBlock = '';
      if (isAdmin && s.totalActivities) {
        activitiesBlock = '<div style="margin-top:22px;padding-top:20px;border-top:1px solid var(--line)">'
          + '<div class="panel-head"><div><h3>إنجاز أنشطة المشروع</h3><p>'
          + fmt(s.completedActivities) + ' من ' + fmt(s.totalActivities) + ' نشاطًا مكتملًا</p></div></div>'
          + bar(s.activityRate, true) + '</div>';
      }
      var activitySections = isAdmin ? renderDashboardActivitySections() : '';

      // الجانب: تنبيهات للإدارة، ولمحة تشغيلية للجمعية. لا يُكرَّر هنا
      // قسم "آخر العمليات" الذي يظهر أسفل اللوحة كاملًا — كان يُعرَض
      // مرتين بنفس المحتوى تمامًا في بوابة الجمعية (رُصد حيًّا 2026/08/01).
      var sideTitle = isAdmin ? 'التنبيهات الإدارية' : 'حالة التشغيل';
      var sideHint = isAdmin ? 'عناصر تستلزم متابعة أو تدخّلًا' : 'مؤشرات تحتاج انتباهك الآن';
      var sideBody = isAdmin ? renderAlerts() : renderAssociationFocus();

      var welcome = state.data.association ? state.data.association.name : 'فريق إدارة المشروع';
      var todayLabel = '';
      try {
        todayLabel = new Intl.DateTimeFormat('ar-SA', {dateStyle: 'full'}).format(new Date());
      } catch (ignore) { todayLabel = state.data.generatedAt || ''; }

      return '<section class="hero"><div><h1>مرحبًا، ' + esc(welcome) + '</h1>'
        + '<p>ملخّص تنفيذي لحالة المشروع والتوزيع في لحظة واحدة.</p></div>'
        + '<div class="hero-chip">' + esc(todayLabel) + '</div></section>'
        + '<section class="kpis">' + kpis.map(kpiCard).join('') + '</section>'
        + '<section class="cols"><div class="panel">'
        + '<div class="panel-head"><div><h3>تقدّم التسليم</h3><p>نسبة وصول الأجهزة إلى المستفيدين</p></div>'
        + ring(s.deliveryRate) + '</div>' + bar(s.deliveryRate) + activitiesBlock + '</div>'
        + '<div class="panel"><div class="panel-head"><div><h3>' + esc(sideTitle) + '</h3>'
        + '<p>' + esc(sideHint) + '</p></div></div>' + sideBody + '</div></section>'
        + activitySections
        + '<section class="panel"><div class="panel-head"><div><h3>آخر العمليات</h3>'
        + '<p>سجل حيّ ومؤرّخ لأحدث الإجراءات</p></div>'
        + '<button class="btn btn-link" data-act="go" data-value="audit">عرض الكل ←</button></div>'
        + renderAuditRows(7) + '</section>';
    }

    /**
     * لوحة "حالة التشغيل" الخاصة ببوابة الجمعية — بديل مفيد عن تكرار
     * "آخر العمليات" مرتين. تُحسب من نفس بيانات البوابة المحمَّلة أصلًا
     * (بلا أي طلب إضافي)، وكل بند قابل للنقر ينقل إلى مصدره مع فلتره.
     */
    function renderAssociationFocus() {
      var beneficiaries = state.data.beneficiaries || [];
      var devices = state.data.devices || [];
      var focus = [
        {label: 'بانتظار تعيين مندوب', page: 'beneficiaries', filter: 'لم يبدأ',
          count: beneficiaries.filter(function (b) { return !b.delegateId && b.deliveryStatus !== 'تم التسليم'; }).length,
          hint: 'مستفيدون جاهزون لم يُعيَّن لهم مندوب بعد'},
        {label: 'تعذّر التسليم', page: 'beneficiaries', filter: 'تعذر التسليم', tone: 'critical',
          count: beneficiaries.filter(function (b) { return b.deliveryStatus === 'تعذر التسليم'; }).length,
          hint: 'يحتاج إعادة محاولة أو مراجعة العنوان'},
        {label: 'أجهزة بالمستودع', page: 'devices', filter: 'بالمستودع',
          count: devices.filter(function (d) { return d.status === 'بالمستودع'; }).length,
          hint: 'جاهزة للتخصيص لمستفيد'},
        {label: 'أجهزة مع المندوب', page: 'devices', filter: 'مع المندوب',
          count: devices.filter(function (d) { return d.status === 'مع المندوب'; }).length,
          hint: 'خرجت ولم يُوثَّق تسليمها بعد'}
      ].filter(function (item) { return item.count > 0; });

      if (!focus.length) {
        return emptyState({glyph: '✓', title: 'لا شيء عالق',
          body: 'كل المستفيدين والأجهزة في مسارهم الطبيعي — لا بند يستلزم تدخّلك الآن.'});
      }
      return '<div class="rows">' + focus.map(function (item) {
        return '<div class="row-item focus-row" role="button" tabindex="0" data-act="go" data-value="' + esc(item.page) + '"'
          + ' data-filter="' + esc(item.filter) + '">'
          + '<div><strong>' + esc(item.label) + '</strong><small>' + esc(item.hint) + '</small></div>'
          + '<span class="focus-count' + (item.tone === 'critical' ? ' is-critical' : '') + '">' + fmt(item.count) + '</span>'
          + '</div>';
      }).join('') + '</div>';
    }

    var ALERT_SECTION_PAGE = {
      'طلبات الانضمام': 'applications', 'الأنشطة': 'activities', 'الشواهد': 'activities',
      'الجمعيات': 'associations', 'الأجهزة': 'devices'
    };
    function renderAlerts() {
      var list = state.data.alerts || [];
      if (!list.length) {
        return emptyState({glyph: '✓', title: 'لا توجد تنبيهات', body: 'كل المؤشرات ضمن النطاق الطبيعي حاليًا.'});
      }
      return list.slice(0, 6).map(function (item) {
        var page = ALERT_SECTION_PAGE[item.section];
        var openAttrs = page ? ' data-act="go" data-value="' + esc(page) + '" role="button" tabindex="0" style="cursor:pointer"' : '';
        return '<div class="alert ' + (item.level === 'critical' ? 'critical' : 'high') + '"' + openAttrs + '>'
          + '<strong>' + esc(item.title) + '</strong>'
          + '<small>' + esc(item.message) + ' · ' + esc(item.section) + '</small></div>';
      }).join('');
    }

    function auditRowsHtml(rows) {
      if (!rows.length) {
        return emptyState({glyph: '≡', title: 'لا توجد عمليات مسجّلة', body: 'ستظهر هنا كل إجراءات النظام فور حدوثها.'});
      }
      return '<div class="rows">' + rows.map(function (row) {
        return '<div class="row-item"><div><strong>' + esc(row.action) + '</strong>'
          + '<small>' + esc(row.user) + ' · ' + esc(row.section) + '</small></div>'
          + '<div class="hide-sm muted">' + esc(row.at) + '</div>'
          + '<span class="mono">' + esc(row.recordId || '—') + '</span></div>';
      }).join('') + '</div>';
    }

    /** معاينة صغيرة ثابتة للوحة البيانات فقط (من Bootstrap) — لا علاقة لها بصفحة سجل العمليات الكاملة المُرقَّمة. */
    function renderAuditRows(limit) {
      return auditRowsHtml((state.data.audit || []).slice(0, limit));
    }

    /* ============================================================
       7) المستفيدون
       ============================================================ */

    /** مُرقَّمة خادميًا (listBeneficiaries) — بحث/فلترة حالة/فلتر جمعية (إدارة)/ترتيب كلها من الخادم، لا محليًا. */
    function renderBeneficiaries() {
      var bundle = state.lazy.beneficiaries || {};
      var canManage = state.data.role === 'ASSOCIATION' || state.data.role === 'ADMIN';
      var extra = state.data.role === 'ASSOCIATION'
        ? '<button class="btn btn-soft" data-act="bulk-import">⇧ إضافة بالجملة</button>' : '';

      if (bundle.loading) return skeletonCards(4);

      var hasQuery = !!(state.search || state.filter || state.assocFilter);
      if (!bundle.total) {
        return emptyState({
          glyph: hasQuery ? '⌕' : ICONS.beneficiaries,
          title: hasQuery ? 'لا نتائج مطابقة' : 'لم يُضف أي مستفيد بعد',
          body: hasQuery ? 'جرّب تعديل كلمة البحث أو إعادة الفلتر إلى «كل الحالات».'
            : 'ابدأ بإضافة مستفيد واحد، أو ارفع النموذج المعتمد لإضافة دفعة كاملة.',
          action: !hasQuery && canManage ? 'new-beneficiary' : '',
          actionLabel: '＋ إضافة أول مستفيد'
        });
      }

      var items = bundle.items || [];
      var body = '<div class="cards">' + items.map(beneficiaryCard).join('') + '</div>';

      return toolbar({
        placeholder: 'ابحث بالاسم أو الرقم أو الجوال أو المنطقة/المدينة…',
        filters: optionList(BENEFICIARY_FILTERS, state.filter, 'كل الحالات'),
        showAssocFilter: true,
        sortFields: [['name', 'الاسم'], ['city', 'المدينة'], ['createdAt', 'تاريخ الإضافة']],
        extra: extra,
        count: fmt(bundle.total || 0) + ' سجلًا'
      }) + body + pagerControls('beneficiaries', bundle);
    }

    function beneficiaryCard(item) {
      var canAssign = (state.data.role === 'ASSOCIATION' || state.data.role === 'ADMIN') && item.deliveryStatus !== 'تم التسليم';
      var assignBtn = canAssign
        ? '<button class="btn btn-soft btn-sm" data-act="assign-delegate" data-id="' + esc(item.id) + '">'
          + (item.delegateId ? 'تغيير المندوب' : 'تعيين مندوب') + '</button>' : '';
      return '<article class="card"><div class="card-head"><div>'
        + '<h3>' + esc(item.name) + '</h3><p class="mono">' + esc(item.id) + '</p></div>'
        + statusChip(item.deliveryStatus) + '</div>'
        + '<div class="metas">'
        + '<div class="meta"><small>الموقع</small><strong>' + esc(item.region) + ' · ' + esc(item.city) + '</strong></div>'
        + '<div class="meta"><small>الأسرة</small><strong>' + fmt(item.familyCount) + ' أفراد'
        + (item.socialSecurity ? '، ضمان' : '') + '</strong></div></div>'
        + '<div class="tags">' + needTags(item.needs) + '</div>'
        + '<div class="card-actions">'
        + '<button class="btn btn-ghost btn-sm" data-act="view-beneficiary" data-id="' + esc(item.id) + '">التفاصيل</button>'
        + assignBtn + '</div></article>';
    }

    function viewBeneficiary(id) {
      var item = findBeneficiary(id);
      if (!item) { toast('تعذر العثور على ملف المستفيد.', 'error'); return; }

      var devices = (state.data.devices || []).filter(function (device) { return device.beneficiaryId === id; });
      var deviceTable = devices.length
        ? '<div class="table-wrap" style="margin-top:12px"><table class="data" style="min-width:0">'
          + '<thead><tr><th>الجهاز</th><th>الرقم</th><th>الحالة</th><th></th></tr></thead><tbody>'
          + devices.map(function (device) {
            return '<tr><td>' + needGlyph(device.name) + ' ' + esc(device.name) + '</td>'
              + '<td class="mono">' + esc(device.id) + '</td><td>' + statusChip(device.status) + '</td>'
              + '<td><button class="btn btn-link btn-sm" data-act="view-device" data-id="' + esc(device.id) + '">تفاصيل</button></td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="muted" style="margin-top:10px">لم تُخصَّص أجهزة لهذا المستفيد بعد.</p>';

      var body = '<div class="card-head"><div><h3>' + esc(item.name) + '</h3>'

    /**

    function saveBeneficiary() {

        region: data.get('region'),
        city: data.get('city'),
        address: data.get('address'),
        familyCount: data.get('familyCount'),
        socialStatus: data.get('socialStatus'),
        income: data.get('income'),
        socialSecurity: data.get('socialSecurity'),
        needs: data.getAll('needs'),
        notes: data.get('notes'),

        lat: data.get('lat'), lng: data.get('lng'),
        landmark: data.get('landmark'),

    /**
     * موقع جغرافي مجاني بالكامل عبر navigator.geolocation المدمج في
     * المتصفح — بلا أي مفتاح API أو خدمة مدفوعة. يُطلَب الإذن فقط عند
     * ضغط المستخدم صراحة على هذا الزر (لا عند فتح النموذج أو الدخول
     * للنظام تلقائيًا). يفشل بصمت مع رسالة عربية واضحة وإلا يبقى
     * الحقلان فارغين اختياريَّين كما كانا.
     */
    function fillCurrentLocation() {
      if (!navigator.geolocation) { toast('المتصفح لا يدعم تحديد الموقع.', 'error'); return; }
      toast('يُطلَب إذن الموقع من المتصفح…', 'success');
      navigator.geolocation.getCurrentPosition(function (position) {
        setLocationFromLatLng(position.coords.latitude, position.coords.longitude, 'الموقع الحالي');
        toast('تم تعبئة الإحداثيات من موقعك الحالي.', 'success');
      }, function () {
        toast('تعذّر الحصول على الموقع — تحقق من إذن الموقع في المتصفح.', 'error');
      }, {enableHighAccuracy: true, timeout: 10000});

    /* ============================================================
       اختيار الموقع بصريًا: Leaflet + OpenStreetMap — مجانيان بالكامل،
       بلا مفتاح API ولا اشتراك. يُحمَّلان فقط عند فتح نموذج موقع
       المستفيد (لا في شاشة الدخول ولا لوحة الإدارة)، مع سقوط آمن كامل
       إلى الإدخال اليدوي/الموقع الحالي/رابط الخرائط الخارجي إن تعذّر
       تحميل الخريطة (شبكة بطيئة أو حجب CSP) — فشل الخريطة لا يمنع حفظ
       بقية بيانات المستفيد إطلاقًا لأن كل الحقول الأخرى مستقلة عنها.
       ============================================================ */

    var LEAFLET_CSS_URL = HTTPS + 'unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    var LEAFLET_JS_URL = HTTPS + 'unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    var LEAFLET_LOAD_TIMEOUT_MS = 6000;
    var RIYADH_CENTER = {lat: 24.7136, lng: 46.6753};
    var locationMapState = {map: null, marker: null, loaded: false};

    function loadScriptOnce_(url) {
      return new Promise(function (resolve, reject) {
        var head = document.head || document.body;
        if (!head) { reject(new Error('لا يوجد DOM لإضافة السكربت إليه')); return; }
        var existing = document.querySelector('script[data-src="' + url + '"]');
        if (existing) { resolve(); return; }
        var script = document.createElement('script');
        script.src = url;
        script.setAttribute('data-src', url);
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('تعذّر تحميل السكربت')); };
        head.appendChild(script);
      });
    }

    function loadStyleOnce_(url) {
      var head = document.head || document.body;
      if (!head) return;
      if (document.querySelector('link[data-href="' + url + '"]')) return;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = url;
      link.setAttribute('data-href', url);
      head.appendChild(link);
    }

    /** يُحمِّل Leaflet مرة واحدة فقط لكل جلسة، بمهلة صريحة — لا يعلّق النموذج إلى الأبد إن تعذّر الوصول للشبكة. لا يرمي أي استثناء متزامن مهما حدث؛ كل خلل يتحوّل لرفض Promise يلتقطه initLocationPicker ويعرض السقوط الآمن. */
    function loadLeaflet_() {
      return new Promise(function (resolve, reject) {
        try {
          if (window.L) { resolve(window.L); return; }
          loadStyleOnce_(LEAFLET_CSS_URL);
        } catch (error) { reject(error); return; }
        var settled = false;
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          reject(new Error('انتهت مهلة تحميل الخريطة'));
        }, LEAFLET_LOAD_TIMEOUT_MS);
        loadScriptOnce_(LEAFLET_JS_URL).then(function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (window.L) resolve(window.L); else reject(new Error('تعذّر تحميل مكتبة الخريطة'));
        }, function (error) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(error);
        });
      });
    }

    function showMapFallback_(message) {
      var mapEl = $('#locationMap');
      var statusEl = $('#locationMapStatus');
      if (mapEl) mapEl.style.display = 'none';
      if (statusEl) statusEl.textContent = message
        || 'تعذّر تحميل الخريطة (الشبكة أو إعدادات الحماية) — استخدم "موقعي الحالي" أو الإدخال اليدوي أدناه؛ يبقى النموذج صالحًا للحفظ بلا أي خريطة.';
    }

    /** يُستدعى مرة واحدة عند فتح نموذج المستفيد فقط — لا في أي صفحة أخرى. */
    function initLocationPicker(item) {
      var mapEl = $('#locationMap');
      if (!mapEl) return;
      updateLocationCoordsHint();
      if (typeof window === 'undefined' || !window.document || typeof Promise === 'undefined') return;
      try {
        loadLeaflet_().then(function (L) {
          setupLeafletMap_(L, item);
        }, function (error) {
          showMapFallback_();
        });
      } catch (error) {
        showMapFallback_();
      }
    }

    function setupLeafletMap_(L, item) {
      var mapEl = $('#locationMap');
      if (!mapEl) return;
      try {
        if (locationMapState.map) { locationMapState.map.remove(); locationMapState.map = null; locationMapState.marker = null; }
        var hasCoords = item.lat != null && item.lng != null;
        var center = hasCoords ? {lat: item.lat, lng: item.lng} : RIYADH_CENTER;
        var map = L.map(mapEl).setView([center.lat, center.lng], hasCoords ? 14 : 6);
        L.tileLayer(HTTPS + '{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        locationMapState.map = map;
        locationMapState.marker = null;
        if (hasCoords) placeMarker_(L, center.lat, center.lng);
        map.on('click', function (e) {
          setLocationFromLatLng(e.latlng.lat, e.latlng.lng, 'خريطة');
        });
        locationMapState.loaded = true;
        var statusEl = $('#locationMapStatus');
        if (statusEl) statusEl.textContent = 'انقر على الخريطة لتحديد الموقع، أو اسحب العلامة لتعديلها.';
      } catch (error) {
        showMapFallback_();
      }
    }

    function placeMarker_(L, lat, lng) {
      if (!locationMapState.map) return;
      if (locationMapState.marker) {
        locationMapState.marker.setLatLng([lat, lng]);
        return;
      }
      var marker = L.marker([lat, lng], {draggable: true}).addTo(locationMapState.map);
      marker.on('dragend', function () {
        var pos = marker.getLatLng();
        setLocationFromLatLng(pos.lat, pos.lng, 'خريطة');
      });
      locationMapState.marker = marker;
    }

    function updateLocationCoordsHint() {
      var hint = $('#locationCoordsHint');
      if (!hint) return;
      var latField = $('#f_lat'); var lngField = $('#f_lng');
      var lat = latField && latField.value !== '' ? Number(latField.value) : null;
      var lng = lngField && lngField.value !== '' ? Number(lngField.value) : null;
      hint.textContent = locationCoordsLabel(lat, lng);
    }

    /** نقطة مركزية واحدة لتحديث الإحداثيات من أي مصدر (خريطة/موقع حالي/يدوي) — تُبقي الحقول والخريطة والمصدر متزامنين دائمًا. */
    function setLocationFromLatLng(lat, lng, source) {
      var latField = $('#f_lat'); var lngField = $('#f_lng'); var sourceField = $('#f_locationSource');
      if (latField) latField.value = Number(lat).toFixed(6);
      if (lngField) lngField.value = Number(lng).toFixed(6);
      if (sourceField) sourceField.value = source || 'يدوي';
      updateLocationCoordsHint();
      if (locationMapState.map && window.L) {
        placeMarker_(window.L, lat, lng);
        locationMapState.map.setView([lat, lng], Math.max(locationMapState.map.getZoom(), 13));
      }
    }

    function clearLocationFields() {
      var latField = $('#f_lat'); var lngField = $('#f_lng'); var sourceField = $('#f_locationSource');
      if (latField) latField.value = '';
      if (lngField) lngField.value = '';
      if (sourceField) sourceField.value = '';
      updateLocationCoordsHint();
      if (locationMapState.marker && locationMapState.map) {
        locationMapState.map.removeLayer(locationMapState.marker);
        locationMapState.marker = null;
      }
      toast('تم مسح الموقع.', 'success');
    }

    /** يفتح خرائط جوجل بالإحداثيات إن وُجدت، وإلا بالعنوان النصي، وإلا تنبيه واضح بدل رابط فارغ. */
    function openLocationInMaps() {
      var latField = $('#f_lat'); var lngField = $('#f_lng');
      var addressField = $('#f_address'); var cityField = $('#f_city') || $('#f_region');
      var lat = latField && latField.value !== '' ? latField.value : '';
      var lng = lngField && lngField.value !== '' ? lngField.value : '';
      var query = '';
      if (lat && lng) query = lat + ',' + lng;
      else if (addressField && addressField.value) query = encodeURIComponent(addressField.value + ' ' + ((cityField && cityField.value) || ''));
      if (!query) { toast('لا يوجد موقع أو عنوان لعرضه بعد.', 'error'); return; }
      var win = window.open(HTTPS + 'www.google.com/maps/search/?api=1&query=' + query, '_blank', 'noopener,noreferrer');
      if (win) win.opener = null;
    }

    /* ---------- تعيين المندوب ---------- */

    /* ---------- الاستيراد بالجملة ---------- */

    function bulkImportModal() {
      state.pendingRows = [];
      var body = '<p class="muted">ارفع النموذج المعتمد بصيغة Excel أو CSV. الأعمدة المطلوبة: '
