<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8E1B45">
  <title>نظام متابعة توزيع الأجهزة | جمعية الزاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       نظام تصميم جمعية الزاد — Design Tokens
       اللون الأساسي: العنابي. المساعد: الذهبي. الحياد: رملي فاتح.
       ============================================================ */
    :root{
      /* هوية الزاد — العنابي */
      --zad-950:#4A0A22; --zad-900:#5E0E2C; --zad-800:#75123A;
      --zad-700:#8E1B45; --zad-600:#A32B4C; --zad-500:#B3423F;
      --zad-400:#C05A4C; --zad-300:#D98C81; --zad-200:#EDC4BD; --zad-100:#F8E6E2;
      /* التدرج الرسمي المستخرج من هوية التقرير السنوي */
      --zad-gradient:linear-gradient(115deg,var(--zad-900) 0%,var(--zad-700) 42%,var(--zad-400) 100%);
      --zad-gradient-soft:linear-gradient(115deg,rgba(94,14,44,.06),rgba(192,90,76,.10));
      /* الذهبي المساعد — من رمز الزاد */
      --gold-700:#B07C12; --gold-600:#C9901A; --gold-500:#E2A62E;
      --gold-400:#EEBE5E; --gold-200:#F7E3B6; --gold-100:#FDF4E2;
      /* الحياد */
      --ink:#2A1520; --ink-soft:#5A4650; --ink-faint:#8A7680; --muted:#867078;
      --paper:#FFFFFF; --surface:#FDFAF9; --canvas:#F6F1EF;
      --line:#EDE1E4; --line-strong:#E0CDD3;
      /* الحالات — مشتقة لتنسجم مع العنابي */
      --ok:#1E7A57; --ok-bg:#E4F2EB;
      --info:#2C6288; --info-bg:#E4EDF4;
      --warn:#9C6B12; --warn-bg:#FBF0DC;
      --bad:#A8283C; --bad-bg:#FBE6E9;
      --neutral:#6D6068; --neutral-bg:#F0EAEC;
      /* الشكل */
      --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
      --sh-1:0 1px 2px rgba(42,21,32,.05);
      --sh-2:0 6px 18px rgba(42,21,32,.06);
      --sh-3:0 18px 44px rgba(42,21,32,.12);
      --sh-4:0 30px 70px rgba(42,21,32,.20);
      --focus:0 0 0 3px rgba(142,27,69,.22);
      --font:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
      --font-display:"Tajawal","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
    }

    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased}
    h1,h2,h3,h4{font-family:var(--font-display);line-height:1.3;margin:0}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:0;background:none}
    button[disabled]{opacity:.55;cursor:not-allowed}
    a{color:inherit}
    img{max-width:100%}
    .hidden{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    :focus-visible{outline:2px solid var(--zad-700);outline-offset:2px}
    ::selection{background:var(--zad-200);color:var(--zad-900)}

    /* ---------- Brand Lockup ----------
       الزاد هو الشعار الرئيسي دائمًا في الصف الأول.
       الشريك في صف مستقل تحت خط فاصل هادئ — لا دمج ولا خلفية خلف أي شعار. */
    .lockup{display:inline-flex;flex-direction:column;align-items:flex-start;gap:11px;max-width:100%}
    .lockup-mark{display:flex;align-items:center;gap:11px}
    /* الشعارات: حجم أكبر ووضوح أعلى دون أي تشويه للنِّسب.
       image-rendering + backface-visibility يمنعان الضبابية الناتجة عن
       تحجيم الصور النقطية داخل عناصر متحرّكة/مترجمة في بعض المتصفحات.
       لا خلفية ولا ظل ولا قصّ على أي شعار — النسبة محفوظة بـobject-fit. */
    .lockup-logo{height:54px;width:auto;object-fit:contain;display:block;background:none;
      backface-visibility:hidden;-webkit-backface-visibility:hidden}
    .lockup-fallback{width:42px;height:46px;flex:none;display:grid;place-items:center;color:var(--zad-700)}
    .lockup-fallback svg{width:100%;height:100%;display:block}
    .lockup-text strong{display:block;font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--zad-800);line-height:1.25}
    .lockup-text span{display:block;font-size:12px;color:var(--muted)}
    .lockup.on-dark .lockup-text strong{color:#fff}
    .lockup.on-dark .lockup-text span{color:rgba(255,255,255,.72)}
    .lockup.on-dark .lockup-fallback{color:var(--gold-400)}
    /* عرض ثنائي أفقي: شعار الزاد ثم خط فاصل رفيع ثم شعار الشريك، بلا أي نص */
    .lockup-duo{flex-direction:row;align-items:center;gap:14px}
    .lockup-duo-divider{width:1px;align-self:stretch;min-height:34px;background:var(--line-strong);flex:none}
    .lockup-duo .lockup-partner-logo{height:48px;width:auto;object-fit:contain;display:block;background:none;
      backface-visibility:hidden;-webkit-backface-visibility:hidden}
    .lockup-duo.on-dark .lockup-duo-divider{background:rgba(255,255,255,.28)}

    /* ---------- Buttons ---------- */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 18px;border-radius:var(--r-md);font-weight:700;font-size:14px;transition:background .18s,color .18s,box-shadow .18s,transform .18s;white-space:nowrap}
    .btn:active{transform:translateY(1px)}
    .btn[disabled],.btn.is-busy{opacity:.6;cursor:progress;pointer-events:none}
    .btn-primary{background:var(--zad-700);color:#fff;box-shadow:0 8px 20px rgba(142,27,69,.22)}
    .btn-primary:hover:not([disabled]){background:var(--zad-800)}
    .btn-gold{background:var(--gold-500);color:#3B2A05;box-shadow:0 8px 20px rgba(226,166,46,.26)}
    .btn-gold:hover:not([disabled]){background:var(--gold-600);color:#fff}
    .btn-soft{background:var(--zad-100);color:var(--zad-800)}
    .btn-soft:hover:not([disabled]){background:var(--zad-200)}
    .btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line-strong)}
    .btn-ghost:hover:not([disabled]){border-color:var(--zad-300);color:var(--zad-800)}
    .btn-danger{background:var(--bad-bg);color:var(--bad)}
    .btn-danger:hover:not([disabled]){background:var(--bad);color:#fff}
    .btn-link{min-height:auto;padding:4px 2px;color:var(--zad-700);font-weight:700;font-size:13px}
    .btn-link:hover{text-decoration:underline}
    .btn-block{width:100%}
    .btn-sm{min-height:38px;padding:8px 13px;font-size:13px}

    /* ---------- Forms ---------- */
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .field>label{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
    .field .hint{font-size:11.5px;color:var(--muted)}
    .field .err{font-size:11.5px;color:var(--bad);font-weight:700}
    .control{width:100%;min-height:46px;border:1px solid var(--line-strong);background:var(--paper);border-radius:var(--r-md);padding:11px 14px;outline:0;transition:border-color .15s,box-shadow .15s}
    .control:hover{border-color:var(--zad-300)}
    .control:focus{border-color:var(--zad-700);box-shadow:var(--focus)}
    .control[disabled]{background:var(--canvas);color:var(--muted)}
    .field.invalid .control{border-color:var(--bad);box-shadow:0 0 0 3px rgba(168,40,60,.14)}
    textarea.control{min-height:100px;resize:vertical;line-height:1.7}
    select.control{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(14px) calc(50% - 2px),calc(19px) calc(50% - 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-left:38px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
    .span-2{grid-column:1/-1}
    .pledge{display:flex;gap:11px;align-items:flex-start;background:var(--gold-100);border:1px solid var(--gold-200);padding:14px;border-radius:var(--r-md);margin:8px 0 4px;font-size:13px;line-height:1.75}
    .pledge input{margin-top:5px;width:18px;height:18px;accent-color:var(--zad-700);flex:none}
    .choice-grid{display:flex;gap:8px;flex-wrap:wrap}
    .choice{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:9px 14px;font-size:13px;cursor:pointer;transition:.15s;min-height:42px}
    .choice:hover{border-color:var(--zad-300)}
    .choice input{accent-color:var(--zad-700);width:16px;height:16px}
    .choice:has(input:checked){background:var(--zad-100);border-color:var(--zad-600);color:var(--zad-800);font-weight:700}

    .location-picker{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--canvas)}
    .location-map{height:240px;border-radius:var(--r-md);margin-top:8px;background:var(--surface);border:1px solid var(--line-strong)}
    .location-acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
    .location-manual{margin-top:8px;font-size:13px}
    .location-manual summary{cursor:pointer;color:var(--zad-700);font-weight:600}
    .location-manual .field-row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin-top:8px}

    /* ---------- Login ---------- */
    .login{min-height:100vh;display:grid;grid-template-columns:minmax(380px,540px) 1fr;background:var(--surface)}
    .login-panel{padding:clamp(26px,5vw,68px);display:flex;flex-direction:column;justify-content:center;background:var(--paper);position:relative;z-index:1}
    .login-panel .lockup{margin-bottom:clamp(30px,5vh,44px)}
    .login-panel .lockup-logo{height:clamp(72px,8vw,104px)}
    .login-panel .lockup-partner-logo{height:clamp(62px,7vw,90px)}
    .login-panel .lockup-duo-divider{min-height:68px}
    .login-divider{width:64px;height:3px;border-radius:2px;margin:0 0 clamp(28px,5vh,44px);
      background:linear-gradient(90deg,var(--gold-600),var(--gold-400))}
    .login-panel h1{font-size:clamp(28px,3.4vw,42px);color:var(--zad-800);margin-bottom:12px;letter-spacing:-.01em}
    .login-lede{color:var(--ink-soft);font-size:15.5px;margin:0 0 28px;max-width:44ch}
    /* ============================================================
       اللوحة التنفيذية للأنشطة — نظام بصري خاص بالزاد لا قالب جاهز.
       المبدأ: تدرّج قراءة من الشريط الكلي ← مسار المراحل ← البطاقة.
       الألوان من هوية الزاد فقط (عنابي/طوبي/ذهبي + محايدات رملية)،
       بظلال خفيفة جدًا وحدود رفيعة بدل الصناديق الثقيلة.
       ============================================================ */
    .exec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-xl);
      padding:24px 26px;margin-bottom:18px;box-shadow:var(--sh-1);position:relative;overflow:hidden}
    .exec::before{content:"";position:absolute;inset-inline-start:0;inset-block:0;width:4px;background:var(--zad-gradient)}
    .exec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .exec-head h2{font-size:20px;color:var(--zad-800);margin:0 0 4px;letter-spacing:-.2px}
    .exec-head p{margin:0;color:var(--ink-soft);font-size:13px}

    /* شريط التوزيع: عرض كل شريحة متناسب مع عدد أنشطتها */
    .flow-bar{display:flex;height:14px;border-radius:var(--r-pill);overflow:hidden;background:var(--canvas);gap:2px}
    .flow-seg{display:block;min-width:6px}
    .flow-seg.is-done{background:var(--ok)}
    .flow-seg.is-live{background:var(--zad-700)}
    .flow-seg.is-late{background:var(--gold-500)}
    .flow-seg.is-next{background:var(--line-strong)}
    .flow-keys{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:16px}
    .flow-key{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--ink-soft)}
    .flow-key strong{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
    .flow-key small{color:var(--ink-faint)}
    .flow-dot{width:20px;height:20px;border-radius:var(--r-pill);display:inline-flex;align-items:center;
      justify-content:center;font-size:11px;font-weight:700;flex:none;align-self:center}
    .flow-key.is-done .flow-dot{background:var(--ok-bg);color:var(--ok)}
    .flow-key.is-live .flow-dot{background:var(--zad-100);color:var(--zad-700)}
    .flow-key.is-late .flow-dot{background:var(--gold-100);color:var(--gold-700)}
    .flow-key.is-next .flow-dot{background:var(--neutral-bg);color:var(--neutral)}

    /* مسار المراحل: خط زمني رأسي بعُقَد */
    .tl{list-style:none;margin:0;padding:0;position:relative}
    .tl::before{content:"";position:absolute;inset-inline-start:11px;top:12px;bottom:12px;width:2px;background:var(--line)}
    .tl-item{position:relative;padding-inline-start:38px;padding-block:11px}
    .tl-node{position:absolute;inset-inline-start:0;top:12px;width:24px;height:24px;border-radius:var(--r-pill);
      display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
      background:var(--paper);border:2px solid var(--line-strong);color:var(--ink-faint)}
    .tl-item.is-done .tl-node{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
    .tl-item.is-live .tl-node{border-color:var(--zad-700);color:var(--zad-700);background:var(--zad-100)}
    .tl-item.is-late .tl-node{border-color:var(--gold-500);color:var(--gold-700);background:var(--gold-100)}
    .tl-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
    .tl-head strong{font-size:14px;color:var(--zad-800)}
    .tl-meter{height:6px;border-radius:var(--r-pill);background:var(--canvas);overflow:hidden}
    .tl-meter span{display:block;height:100%;background:var(--zad-gradient);border-radius:var(--r-pill)}
    .tl-pct{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:5px;display:inline-block}
    .late-days{font-size:12.5px;font-weight:700;color:var(--gold-700);white-space:nowrap}

    /* بطاقات الأنشطة، مجمَّعة تحت نشاطها الرئيسي */
    .exec-body{margin-top:6px}
    .act-group{margin-bottom:26px}
    .act-group-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
      flex-wrap:wrap;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
    .act-group-head h3{font-size:14.5px;color:var(--zad-800);margin:0;font-weight:700}
    .act-group-count{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
    .act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
    .act-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:16px 17px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:12px;
      border-inline-start:3px solid var(--line-strong)}
    .act-card.is-done{border-inline-start-color:var(--ok)}
    .act-card.is-live{border-inline-start-color:var(--zad-700)}
    .act-card.is-late{border-inline-start-color:var(--gold-500)}
    .act-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .act-top h4{margin:0 0 3px;font-size:14px;color:var(--ink);line-height:1.5}
    .act-path{margin:0;font-size:11.5px;color:var(--ink-faint)}
    .act-meter{height:6px;border-radius:var(--r-pill);background:var(--canvas);overflow:hidden}
    .act-meter span{display:block;height:100%;background:var(--zad-gradient);border-radius:var(--r-pill)}
    .act-facts{display:flex;gap:18px}
    .act-facts .fact{display:flex;flex-direction:column;gap:2px}
    .act-facts small{font-size:11px;color:var(--ink-faint)}
    .act-facts strong{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
    .act-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:11px;
      border-top:1px solid var(--line);font-size:12px}
    .due{color:var(--ink-soft)}
    .due.is-late{color:var(--gold-700);font-weight:700}
    .due.is-done{color:var(--ok)}
    .act-proof{color:var(--zad-700);font-weight:700;text-decoration:none;margin-inline-start:auto}
    .act-proof:hover{text-decoration:underline}
    .act-proof.is-missing{color:var(--ink-faint);font-weight:400}

    @media (max-width:640px){
      .exec{padding:18px 16px;border-radius:var(--r-lg)}
      .exec-head h2{font-size:17px}
      .act-grid{grid-template-columns:1fr}
      .flow-keys{gap:8px 16px}
    }

    .segmented{display:flex;background:var(--canvas);padding:5px;border-radius:var(--r-md);margin-bottom:22px;gap:4px}
    .segmented button{flex:1;min-height:42px;border-radius:10px;color:var(--muted);font-weight:700;font-size:13.5px;transition:.18s}
    .segmented button[aria-selected="true"]{background:var(--paper);color:var(--zad-800);box-shadow:var(--sh-2)}

    /* -------- نموذج تقديم الجمعية: مؤشر المراحل -------- */
    .apply-steps{display:flex;gap:6px;margin-bottom:26px;counter-reset:apstep}
    .apply-steps .apstep{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;text-align:center}
    .apply-steps .apstep b{counter-increment:apstep;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--canvas);color:var(--ink-soft);font-size:13px;border:1px solid var(--line-strong)}
    .apply-steps .apstep.done b{background:var(--zad-700);color:#fff;border-color:var(--zad-700)}
    .apply-steps .apstep.current b{background:var(--gold-500);color:#3B2A05;border-color:var(--gold-500)}
    .apply-steps .apstep.current{color:var(--zad-800)}
    .apply-fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px}
    @media (max-width:640px){.apply-fieldset{grid-template-columns:1fr}}
    .apply-fieldset legend{display:none}

    /* -------- بناء البريد الإلكتروني (اسم + نطاق) -------- */
    .email-builder{display:flex;align-items:center;gap:6px;direction:ltr}
    .email-builder input{flex:1;min-width:0}
    .email-builder span{color:var(--muted);font-weight:700}
    .email-builder select{flex:0 0 150px}

    /* -------- أسئلة القبول: نعم/لا سهلة اللمس -------- */
    .yesno-q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px}
    .yesno-q legend{font-size:13.5px;font-weight:700;color:var(--ink);padding:0 0 10px;float:right;width:100%}
    .yesno-toggle{display:flex;gap:8px;clear:both}
    .yesno-toggle input{position:absolute;opacity:0;width:1px;height:1px}
    .yesno-toggle label{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);border:1px solid var(--line-strong);font-weight:700;font-size:13.5px;color:var(--ink-soft);cursor:pointer;transition:.15s}
    .yesno-toggle input:checked+label{background:var(--zad-700);color:#fff;border-color:var(--zad-700)}
    .yesno-toggle input.no-opt:checked+label{background:var(--canvas);color:var(--ink-soft);border-color:var(--line-strong);font-weight:600}
    .yesno-toggle input:focus-visible+label{outline:2px solid var(--zad-700);outline-offset:2px}

    /* -------- ملخص المراجعة النهائية -------- */
    .review-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin:10px 0 18px;padding:0;list-style:none}
    @media (max-width:640px){.review-list{grid-template-columns:1fr}}
    .review-list li{font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:8px}
    .review-list li b{display:block;color:var(--ink-soft);font-weight:700;font-size:11.5px;margin-bottom:2px}
    .review-answers{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
    .review-answers .tag.no{background:var(--canvas);color:var(--ink-soft)}

    /* -------- شارات صلاحية الترخيص وملف المرفق -------- */
    .badge{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 10px;font-size:11px;font-weight:700}
    .badge-ok{background:#E7F5EC;color:#1E7B45}
    .badge-warn{background:#FBEAEA;color:#A32B2B}
    .login-art{position:relative;overflow:hidden;display:grid;place-items:center;padding:60px;background:var(--zad-gradient)}
    .login-art::before,.login-art::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.16)}
    .login-art::before{width:min(60vw,620px);aspect-ratio:1}
    .login-art::after{width:min(42vw,430px);aspect-ratio:1;border-color:rgba(226,166,46,.3)}
    .art-card{position:relative;z-index:1;text-align:center;max-width:440px;color:#fff}
    .art-seal{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;border:1.5px solid rgba(226,166,46,.6);display:grid;place-items:center;color:var(--gold-400)}
    .art-seal svg{width:40px;height:40px}
    .art-card h2{font-size:27px;margin-bottom:12px}
    .art-card p{color:rgba(255,255,255,.78);margin:0 0 26px}
    .art-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid rgba(255,255,255,.18);padding-top:22px}
    .art-stats strong{display:block;font-family:var(--font-display);font-size:22px;color:var(--gold-400)}
    .art-stats span{font-size:11.5px;color:rgba(255,255,255,.7)}

    /* ---------- App shell ---------- */
    .shell{min-height:100vh}
    .sidebar{position:fixed;inset-block:0;inset-inline-end:0;width:268px;background:var(--zad-950);background-image:linear-gradient(180deg,var(--zad-900),var(--zad-950));color:#fff;padding:20px 14px;display:flex;flex-direction:column;z-index:40}
    .sidebar .lockup{padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:18px}
    .nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto}
    .nav button{display:flex;align-items:center;gap:11px;width:100%;min-height:46px;padding:11px 13px;border-radius:var(--r-md);color:rgba(255,255,255,.7);font-weight:600;font-size:14px;text-align:start;transition:.16s;position:relative}
    .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
    .nav button[aria-current="page"]::before{content:"";position:absolute;inset-inline-end:0;inset-block:11px;width:3px;border-radius:3px;background:var(--gold-500)}
    .nav .ico{width:22px;text-align:center;flex:none;color:var(--gold-400);font-size:15px}
    .side-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
    .side-user{padding:4px 8px 12px}
    .side-user strong{display:block;font-size:14px}
    .side-user span{display:block;font-size:12px;color:rgba(255,255,255,.6)}

    .main{margin-inline-end:268px;min-height:100vh;display:flex;flex-direction:column}
    .topbar{min-height:76px;background:rgba(253,250,249,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 28px;position:sticky;top:0;z-index:30}
    .topbar h2{font-size:20px;color:var(--zad-800)}
    .topbar .crumb{font-size:12px;color:var(--muted)}
    .top-actions{display:flex;align-items:center;gap:9px}
    .menu-btn{display:none}
    .content{padding:24px 28px 56px;max-width:1560px;width:100%;margin-inline:auto;flex:1}

    /* ---------- Hero ---------- */
    .hero{position:relative;overflow:hidden;background:var(--zad-gradient);color:#fff;border-radius:var(--r-xl);padding:26px 30px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
    .hero::after{content:"";position:absolute;inset-inline-start:-90px;top:-120px;width:280px;height:280px;border-radius:50%;border:44px solid rgba(226,166,46,.14);pointer-events:none}
    .hero h1{font-size:clamp(20px,2.4vw,27px);margin-bottom:6px}
    .hero p{margin:0;color:rgba(255,255,255,.76);font-size:14px}
    .hero-chip{position:relative;z-index:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:11px 16px;border-radius:var(--r-md);font-size:13px;white-space:nowrap}

    /* ---------- KPI ---------- */
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
    .kpi{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sh-1);min-height:126px;display:flex;flex-direction:column}
    button.kpi{font:inherit;text-align:start;width:100%;color:inherit;-webkit-appearance:none;appearance:none}
    .kpi-clickable{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
    .kpi-clickable:hover,.kpi-clickable:focus-visible{transform:translateY(-2px);box-shadow:var(--sh-2);outline:2px solid var(--zad-700);outline-offset:2px}
    .kpi::after{content:"";position:absolute;inset-inline-start:-26px;bottom:-34px;width:78px;height:78px;border-radius:26px;background:var(--zad-100);transform:rotate(18deg)}
    .kpi.accent::after{background:var(--gold-100)}
    .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .kpi-top span{font-size:12.5px;font-weight:700;color:var(--muted)}
    .kpi-ico{position:relative;z-index:1;width:36px;height:36px;flex:none;border-radius:11px;background:var(--zad-100);color:var(--zad-700);display:grid;place-items:center;font-size:16px}
    .kpi.accent .kpi-ico{background:var(--gold-100);color:var(--gold-700)}
    .kpi strong{position:relative;z-index:1;font-family:var(--font-display);font-size:31px;font-weight:800;color:var(--zad-800);margin-top:auto;line-height:1.1}
    .kpi small{position:relative;z-index:1;color:var(--muted);font-size:12px}

    /* ---------- Panels ---------- */
    .cols{display:grid;grid-template-columns:1.4fr .85fr;gap:18px}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-1)}
    .panel+.panel{margin-top:18px}
    .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
    .panel-head h3{font-size:17px;color:var(--zad-800)}
    .panel-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}

    /* ---------- Toolbar ---------- */
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    .search{position:relative;flex:1;min-width:230px}
    .search .control{padding-inline-start:42px}
    .search .glyph{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
    .toolbar select.control{width:auto;min-width:172px}
    .result-count{font-size:12.5px;color:var(--muted);margin-inline-start:auto}
    .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;font-size:13px}

    /* ---------- Status ---------- */
    .status{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
    .status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
    .status.good{background:var(--ok-bg);color:var(--ok);border-color:rgba(30,122,87,.2)}
    .status.info{background:var(--info-bg);color:var(--info);border-color:rgba(44,98,136,.2)}
    .status.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(156,107,18,.22)}
    .status.bad{background:var(--bad-bg);color:var(--bad);border-color:rgba(168,40,60,.2)}
    .status.neutral{background:var(--neutral-bg);color:var(--neutral);border-color:rgba(109,96,104,.18)}

    /* ---------- Progress ---------- */
    .bar{display:flex;align-items:center;gap:12px}
    .bar-track{height:9px;flex:1;background:var(--canvas);border-radius:var(--r-pill);overflow:hidden}
    .bar-fill{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--zad-700),var(--zad-400));transition:width .5s ease}
    .bar-fill.gold{background:linear-gradient(90deg,var(--gold-600),var(--gold-400))}
    .bar-val{font-family:var(--font-display);font-weight:800;color:var(--zad-800);min-width:44px;text-align:end;font-size:14px}
    .ring{--p:0;width:76px;height:76px;flex:none;border-radius:50%;background:conic-gradient(var(--zad-700) calc(var(--p)*1%),var(--canvas) 0);display:grid;place-items:center}
    .ring::before{content:attr(data-value);width:56px;height:56px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;font-weight:800;color:var(--zad-800)}

    /* ---------- Cards ---------- */
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;transition:box-shadow .2s,transform .2s,border-color .2s;display:flex;flex-direction:column}
    .card:hover{transform:translateY(-2px);box-shadow:var(--sh-3);border-color:var(--zad-200)}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
    .card-head h3{font-size:16px;color:var(--zad-800)}
    .card-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
    .metas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
    .meta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;min-width:0}
    .meta small{display:block;color:var(--muted);font-size:10.5px;margin-bottom:2px}
    .meta strong{display:block;font-size:13px;color:var(--ink);font-weight:700;overflow-wrap:anywhere}
    .meta.wide{grid-column:1/-1}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{display:inline-flex;align-items:center;gap:5px;background:var(--zad-100);color:var(--zad-800);border-radius:var(--r-sm);padding:5px 10px;font-size:11.5px;font-weight:600}
    .tag.plain{background:var(--surface);color:var(--muted);border:1px solid var(--line);font-weight:500}
    .card-actions{display:flex;gap:8px;margin-top:auto;padding-top:14px}
    .card-actions .btn{flex:1}

    /* ---------- Table ---------- */
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper)}
    table.data{width:100%;border-collapse:collapse;min-width:820px}
    table.data th{background:var(--surface);color:var(--ink-soft);padding:12px 14px;text-align:start;font-size:12px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line)}
    table.data td{padding:13px 14px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
    table.data tbody tr:hover td{background:var(--surface)}
    .th-sort{all:unset;cursor:pointer;font:inherit;color:inherit;white-space:nowrap}
    .th-sort:hover,.th-sort.active{color:var(--zad-700)}
    .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);direction:ltr;display:inline-block;unicode-bidi:isolate}
    .muted{color:var(--muted)}

    /* ---------- Rows ---------- */
    .rows{display:flex;flex-direction:column}
    .bulk-preview{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-md);margin-top:10px}
    .row-item{display:grid;grid-template-columns:1.4fr 1fr auto;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
    .row-item:last-child{border-bottom:0}
    .row-item strong{font-size:13.5px;color:var(--ink)}
    .row-item small{display:block;color:var(--muted);font-size:12px}
    .alert{border-inline-start:3px solid;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);margin-bottom:9px}
    .alert:last-child{margin-bottom:0}
    .alert.critical{border-color:var(--bad);background:var(--bad-bg)}
    .alert.high{border-color:var(--gold-600);background:var(--gold-100)}
    .alert strong{display:block;font-size:13px}
    .alert small{color:var(--ink-soft);font-size:12px}

    /* ---------- Empty / skeleton ---------- */
    .empty{text-align:center;padding:44px 22px;color:var(--muted)}
    .empty .glyph{width:60px;height:60px;margin:0 auto 14px;border-radius:50%;background:var(--zad-100);color:var(--zad-600);display:grid;place-items:center;font-size:25px}
    .empty h3{color:var(--zad-800);font-size:16px;margin-bottom:6px}
    .empty p{margin:0 auto;max-width:42ch;font-size:13.5px}
    .empty .btn{margin-top:16px}
    .sk{background:linear-gradient(90deg,var(--canvas) 25%,var(--surface) 50%,var(--canvas) 75%);background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:var(--r-md)}
    @keyframes sk{to{background-position:-200% 0}}
    .sk-kpi{height:126px}.sk-line{height:14px;margin-bottom:9px}.sk-card{height:210px}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    /* ---------- Modal ---------- */
    .backdrop{position:fixed;inset:0;background:rgba(35,10,22,.55);backdrop-filter:blur(3px);z-index:70;display:grid;place-items:center;padding:18px;animation:fade .18s}
    @keyframes fade{from{opacity:0}}
    .modal{background:var(--paper);width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;border-radius:var(--r-xl);box-shadow:var(--sh-4);animation:pop .22s cubic-bezier(.2,.8,.3,1)}
    @keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
    .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none}
    .modal-head h3{font-size:18px;color:var(--zad-800)}
    .modal-body{padding:22px 24px;overflow-y:auto;flex:1}
    .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;flex:none;background:var(--surface);border-radius:0 0 var(--r-xl) var(--r-xl)}
    .x-btn{width:38px;height:38px;flex:none;border-radius:50%;background:var(--canvas);color:var(--ink-soft);display:grid;place-items:center;font-size:19px;line-height:1}
    .x-btn:hover{background:var(--zad-100);color:var(--zad-800)}
    .code-reveal{text-align:center;padding:20px;background:var(--gold-100);border:1px dashed var(--gold-400);border-radius:var(--r-md)}
    .code-reveal .code{font-family:ui-monospace,Consolas,monospace;font-size:27px;font-weight:700;color:var(--zad-800);letter-spacing:.06em;direction:ltr;margin:10px 0;unicode-bidi:isolate}

    /* ---------- Toast ---------- */
    .toasts{position:fixed;inset-inline-start:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:9px;max-width:min(400px,calc(100vw - 40px))}
    .toast{display:flex;align-items:flex-start;gap:10px;background:var(--zad-900);color:#fff;padding:13px 16px;border-radius:var(--r-md);box-shadow:var(--sh-3);font-size:13.5px;animation:slide .24s}
    @keyframes slide{from{transform:translateY(12px);opacity:0}}
    .toast.error{background:var(--bad)}
    .toast.success{background:var(--ok)}
    .toast.warn{background:var(--warn)}
    .toast .glyph{flex:none;font-weight:800}

    /* ---------- Delegate mobile ---------- */
    .dg{min-height:100vh;background:var(--canvas);padding-bottom:34px}
    .dg-top{background:var(--zad-gradient);color:#fff;padding:20px 18px 30px;border-radius:0 0 var(--r-xl) var(--r-xl);position:relative;overflow:hidden}
    .dg-top::after{content:"";position:absolute;inset-inline-start:-70px;top:-90px;width:210px;height:210px;border-radius:50%;border:36px solid rgba(226,166,46,.14)}
    .dg-top .lockup{margin-bottom:20px;position:relative;z-index:1}
    .dg-top .lockup-logo{height:58px}
    .dg-top .lockup-partner-logo{height:50px}
    .dg-top h2{font-size:20px;margin-bottom:3px;position:relative;z-index:1}
    .dg-top>p{margin:0 0 18px;color:rgba(255,255,255,.75);font-size:13px;position:relative;z-index:1}
    .dg-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
    .dg-stats div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:13px 15px;border-radius:var(--r-md)}
    .dg-stats strong{display:block;font-family:var(--font-display);font-size:25px;line-height:1.2}
    .dg-stats span{font-size:11.5px;color:rgba(255,255,255,.75)}
    .dg-body{max-width:700px;margin-inline:auto;padding:16px}
    .dg-nav{display:flex;gap:8px;margin-bottom:14px}
    .dg-nav .btn{flex:1}
    .dg-nav .btn.icon{flex:none;width:46px;padding:0}
    .dg-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px;margin-bottom:12px;box-shadow:var(--sh-1)}
    .dg-card h3{font-size:16px;color:var(--zad-800)}
    .dg-addr{color:var(--ink-soft);font-size:13px;margin:8px 0 12px;display:flex;gap:7px;align-items:flex-start}
    .dg-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
    .dg-acts>*{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:var(--r-md);text-decoration:none;font-size:12.5px;font-weight:700;text-align:center;padding:8px 4px}
    .dg-acts button{border:none;font:inherit;cursor:pointer;width:100%}
    .a-call{background:var(--info-bg);color:var(--info)}
    .a-wa{background:var(--ok-bg);color:var(--ok)}
    .a-map{background:var(--gold-100);color:var(--gold-700)}
    .a-copy{background:var(--neutral-bg);color:var(--neutral)}
    .a-state{background:var(--neutral-bg);color:var(--neutral);grid-column:span 1}
    .a-state[disabled],.a-deliver[disabled]{opacity:.5;cursor:not-allowed}
    .a-deliver{background:var(--zad-700);color:#fff;grid-column:span 2;box-shadow:0 6px 16px rgba(142,27,69,.22)}
    .a-retry{background:var(--gold-100);color:var(--gold-700);border:1px solid var(--gold-200);grid-column:span 1}
    .dg-card-done{opacity:.75}

    /* بطاقة مهمة متعذّرة: حدّ جانبي هادئ يميّزها بلا لون صارخ، مع سطر
       آخر محاولة وسببها — التمييز لا يعتمد على اللون وحده (WCAG 1.4.1):
       تظهر معه شارة الحالة النصية وسطر توضيحي صريح. */
    .dg-card.is-failed{border-inline-start:4px solid var(--gold-500);background:linear-gradient(90deg,var(--gold-100) 0%,var(--paper) 22%)}
    .dg-attempt{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12.5px;margin:10px 0 0;color:var(--ink-soft)}
    .dg-attempt-label{font-weight:700;color:var(--gold-700)}
    .dg-note{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;line-height:1.7}
    .gate-hint{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.7}
    .gate-hint.is-ready{color:var(--ok)}

    /* حالة تعذّر تحميل القوائم المعتمدة داخل نموذج — رسالة صريحة وزر
       إعادة محاولة، بديلًا عن السقوط الصامت إلى حقل نصي حر. */
    .ref-fallback{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--gold-100);
      border:1px solid var(--gold-200);border-radius:var(--r-md);padding:12px 14px;font-size:13px;line-height:1.7}

    /* صفوف "حالة التشغيل" في لوحة الجمعية — بديل تكرار "آخر العمليات" */
    .focus-row{cursor:pointer}
    .focus-row:hover,.focus-row:focus-visible{background:var(--zad-100)}
    .focus-count{font-weight:800;font-size:17px;color:var(--zad-700);font-variant-numeric:tabular-nums}
    .focus-count.is-critical{color:var(--bad)}

    /* ---------- Proof upload ---------- */
    .drop{border:2px dashed var(--line-strong);border-radius:var(--r-lg);padding:22px;text-align:center;background:var(--surface)}
    .drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .drop .btn{margin-bottom:6px}
    .proof-img{max-width:100%;max-height:270px;border-radius:var(--r-md);margin-top:12px;border:1px solid var(--line)}

    /* ---------- Boot / fatal ---------- */
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:var(--zad-800)}
    .boot .spin{width:42px;height:42px;margin:0 auto 16px;border-radius:50%;border:3px solid var(--zad-100);border-top-color:var(--zad-700);animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fatal{max-width:720px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;text-align:start;box-shadow:var(--sh-2)}
    .fatal pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--canvas);padding:13px;border-radius:var(--r-sm);font-size:12px}

    /* ---------- Responsive ---------- */
    @media(max-width:1180px){
      .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
      .cols{grid-template-columns:1fr}
      /* بلا لوحة الفن الجانبية على الجوال، التمركز الرأسي الكامل ضمن
         100vh يترك مساحة فارغة مفرطة أعلى النموذج على الشاشات الصغيرة —
         محتوى يبدأ من الأعلى بحشوة معقولة بدل تمركز في منتصف الشاشة كاملة. */
      .login{grid-template-columns:1fr;min-height:auto}
      .login-art{display:none}
      .login-panel{max-width:640px;width:100%;margin-inline:auto;justify-content:flex-start;padding-top:clamp(20px,4vh,40px)}
      .sidebar{width:236px}.main{margin-inline-end:236px}
    }
    @media(max-width:820px){
      body{font-size:14.5px}
      /* الشريط الجانبي يرتكز فعليًا على اليسار دائمًا (inset-inline-end
         يُترجَم إلى left فعليًا مع dir=rtl على html) — إخفاؤه عن الشاشة
         يعني مزيدًا من الإزاحة يسارًا (سالبة) بصرف النظر عن الاتجاه؛
         كانت نسخة RTL هنا تُزيحه لليمين خطأً فيبقى جزء منه ظاهرًا فوق
         المحتوى بدل أن يختفي تمامًا (تحقّق فعليًا عبر Playwright/Chromium). */
      .sidebar{transform:translateX(-110%);transition:transform .25s ease;width:274px;box-shadow:var(--sh-4)}
      .sidebar.open{transform:none}
      .main{margin-inline-end:0}
      .menu-btn{display:inline-flex}
      .scrim{position:fixed;inset:0;background:rgba(35,10,22,.45);z-index:35}
      .topbar{padding:10px 15px;min-height:66px}
      .topbar h2{font-size:17px}
      .content{padding:16px 14px 40px}
      .hero{padding:20px;flex-direction:column;align-items:flex-start}
      .kpis{gap:10px}
      .kpi{padding:15px;min-height:112px}
      .kpi strong{font-size:26px}
      .cards{grid-template-columns:1fr}
      .form-grid{grid-template-columns:1fr}
      .span-2{grid-column:auto}
      .panel{padding:16px}
      .row-item{grid-template-columns:1fr auto}
      .row-item>.hide-sm{display:none}
      .backdrop{padding:0;place-items:end stretch}
      .modal{max-height:94vh;border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%}
      .modal-foot{border-radius:0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
      .modal-foot .btn{flex:1}
      .toasts{inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:none}
      .lockup-logo,.lockup-partner-logo{height:38px}
      .login-panel .lockup-logo{height:66px}
      .login-panel .lockup-partner-logo{height:58px}
      .login-panel .lockup-duo-divider{min-height:52px}
    }
  </style>
</head>

    function toast(message, kind) {

      var glyph = document.createElement('span');
      glyph.className = 'glyph';
      glyph.textContent = kind === 'error' ? '!' : (kind === 'warn' ? '⚠' : '✓');
      var text = document.createElement('span');
      text.textContent = message;
      el.setAttribute('role', kind === 'error' || kind === 'warn' ? 'alert' : 'status');
      el.setAttribute('aria-live', kind === 'error' || kind === 'warn' ? 'assertive' : 'polite');
      el.appendChild(glyph);
      el.appendChild(text);

      setTimeout(function () { el.remove(); }, kind === 'error' || kind === 'warn' ? 6000 : 3800);

    /**
     * عند انتهاء المهلة تحديدًا (لا فشل مؤكَّد) لا نفترض النجاح ولا الفشل:

    /** قائمة "ترتيب حسب" لصفحات البطاقات (لا جدول بعناوين أعمدة قابلة للنقر) — sortFields = [[field, label], ...]. */
    function sortSelect(sortFields) {

        return '<option value="' + esc(pair[0]) + '"' + (state.sortBy === pair[0] ? ' selected' : '') + '>' + esc(pair[1]) + '</option>';
      }).join('');

          + '<select class="control" id="filterSelect" data-act="set-filter">' + options.filters + '</select>'
        : '';

      var sort = options.sortFields ? sortSelect(options.sortFields) : '';
      filters = filters + assocFilter + sort;

        + '<span class="glyph" aria-hidden="true">⌕</span>'

        + '" placeholder="' + esc(options.placeholder) + '" autocomplete="off">'

    /* ============================================================
       3) البحث والتصفية
       ============================================================ */

    function matches(item, fields) {
      var query = state.search.trim().toLowerCase();
      if (query) {
        var hit = fields.some(function (field) {
          return String(item[field] || '').toLowerCase().indexOf(query) >= 0;
        });
        if (!hit) return false;
      }
      if (!state.filter) return true;
      return item.status === state.filter || item.deliveryStatus === state.filter;
    }
    function applyFilters(items, fields) {
      return (items || []).filter(function (item) { return matches(item, fields); });
    }

    function associationName(id) {
      var list = state.data.associations || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name;
      var own = state.data.association;
      return own && own.id === id ? own.name : '—';
    }
    function delegateName(id) {
      var list = state.data.delegates || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name;
      return 'غير معيّن';
    }
    function findBeneficiary(id) {
      var list = state.data.beneficiaries || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    /**
     * تُدرج سجلًا محدَّثًا/جديدًا في مصفوفة محلية دون إعادة تحميل كامل —
     * تُستخدم بعد كل عملية حفظ لدمج استجابتها الجزئية (record) بدل
     * استبدال state.data بأكمله من Bootstrap جديد. تُعيد المصفوفة نفسها
     * (تعديل داخل المكان) حتى تبقى المرجعية في state.data كما هي.
     */
    function upsertRecord(list, record) {
      if (!list || !record || !record.id) return {list: list, inserted: false};
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === record.id) {
          // دمج لا استبدال: الاستجابة الجزئية قد لا تحمل كل الحقول التي
          // أضافتها حزمة البوابة للسجل (مثل devices/attempts في بطاقة
          // المندوب). الاستبدال الكامل كان يمحوها فتظهر البطاقة بلا أجهزة.
          list[i] = Object.assign({}, list[i], record);
          return {list: list, inserted: false};
        }
      }
      list.unshift(record);
      return {list: list, inserted: true};
    }

    /**
     * تحديث سجل واحد في مصدرَي الحقيقة معًا: المصفوفة الكاملة في
     * state.data (تستخدمها النماذج والقوائم المنسدلة وviewX/findX) وصفحة
     * القائمة المُرقَّمة خادميًا الحالية في state.lazy إن كانت مُحمَّلة —
     * بدونها تبقى القائمة المعروضة تُظهر حالة قديمة بعد أي حفظ/تفعيل/تعطيل
     * حتى لو أُعيد الرسم، لأن upsertRecord يستبدل مرجع الكائن لا يُعدِّله.
     */
    /**
     * تحديث سجل واحد في مصدرَي الحقيقة معًا، **مع عدّاد الصفحة المُرقَّمة**.
     *
     * العطل الحيّ الذي يعالجه (2026/08/01): إضافة أول مستفيد من بوابة
     * الجمعية كانت تُظهر إشعار نجاح ثم تُبقي القائمة فارغة حتى تسجيل خروج
     * ودخول جديد. السبب أن renderBeneficiaries تقرّر عرض حالة "لا يوجد"
     * من `bundle.total` بينما upsertEntity كانت تُدرج العنصر في
     * `bundle.items` فقط وتترك `total` على صفر — فيبقى الشرط `!bundle.total`
     * صادقًا ويُعرَض الفراغ رغم وجود العنصر فعليًا في الذاكرة.
     * الآن يُزاد `total` (وعدد الصفحات) عند الإدراج الجديد فقط، لا عند
     * تحديث سجل قائم.
     */
    function upsertEntity(key, record) {
      upsertRecord(state.data[key], record);
      var bundle = state.lazy[key];
      if (bundle && bundle.items) {
        var outcome = upsertRecord(bundle.items, record);
        if (outcome.inserted) {
          bundle.total = (bundle.total || 0) + 1;
          var size = bundle.pageSize || 25;
          bundle.totalPages = Math.max(1, Math.ceil(bundle.total / size));
        }
      }
    }

    /** يحذف سجلًا من الحالة المحلية ومن الصفحة المُرقَّمة، ويُنقص العدّاد بالمثل. */
    function removeEntity(key, id) {
      if (state.data[key]) {
        state.data[key] = state.data[key].filter(function (x) { return x.id !== id; });
      }
      var bundle = state.lazy[key];
      if (bundle && bundle.items) {
        var before = bundle.items.length;
        bundle.items = bundle.items.filter(function (x) { return x.id !== id; });
        if (bundle.items.length < before) {
          bundle.total = Math.max(0, (bundle.total || 1) - 1);
          var size = bundle.pageSize || 25;
          bundle.totalPages = Math.max(1, Math.ceil(bundle.total / size));
        }
      }
    }

    /** يدمج ملخّصًا جزئيًا (من استجابة حفظ) فوق state.data.summary الحالي بدل استبداله بالكامل. */
    function mergeSummary(patch) {
      if (patch && patch.summary && state.data) {
        state.data.summary = Object.assign({}, state.data.summary, patch.summary);
      }
    }

    /**
     * معرّف عملية عشوائي لمرة واحدة — يُنشأ عند أول محاولة ويُعاد
     * استخدامه فقط عند إعادة محاولة نفس تلك العملية بعد مهلة (راجع
     * withIdempotency_ في الخادم). لا علاقة له بأي هوية مستخدم أو جلسة.
     */
    function genOpId() {
      return 'op-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }

    /**
     * يحفظ opId لكل مفتاح عملية حساسة (إنشاء جمعية/مندوب، قبول طلب،
     * تأكيد تسليم) طوال فشل/مهلة متكررة على نفس المحاولة، ويُنسيه عند
     * النجاح — إعادة الضغط على نفس الزر بعد مهلة تُعيد استخدام نفس
     * المعرّف فيتعرّف الخادم عليها كإعادة محاولة لا عملية جديدة مكرَّرة.
     */
    var pendingOpIds = {};
    function opIdFor(key) { return pendingOpIds[key] || (pendingOpIds[key] = genOpId()); }
    function clearOpId(key) { delete pendingOpIds[key]; }
    function needGlyph(name) {
      name = String(name || '');

      if (name.indexOf('فرن') >= 0) return '▦';

      return '▣';

    function needTags(list, emptyText) {

      return list.map(function (item) {
        return '<span class="tag">' + needGlyph(item) + ' ' + esc(item) + '</span>';
      }).join('');
    }

    /* ============================================================

    function renderLogin() {

        + '</section>'

        + '<div class="art-seal" aria-hidden="true">' + ZAD_SEAL_SVG + '</div>'
        + '<h2>زادٌ ونَماء</h2>'
        + '<p>أثرٌ موثّق يصل إلى بيت المستفيد، ويُقاس في كل مرحلة.</p>'
        + '<div class="art-stats">'
        + '<div><strong>١</strong><span>منظومة موحّدة</span></div>'
        + '<div><strong>٣</strong><span>أدوار تشغيلية</span></div>'
        + '<div><strong>١٠٠٪</strong><span>توثيق بالصورة</span></div>'
