    var lastFocused = null;
    // يتحوّل إلى true عند أي تغيير فعلي داخل النافذة الحالية (إدخال/تبديل) —
    // يُستخدم فقط لتحذير قبل إغلاق عرضي (Escape أو نقر خارج النافذة)، لا
    // لعرقلة أزرار الإلغاء/الإغلاق الصريحة التي تبقى فورية كما كانت دائمًا.
    var modalDirty = false;

    function openModal(title, body, footer, onMount) {
      lastFocused = document.activeElement;
      modalDirty = false;
      $('#modalRoot').innerHTML = '<div class="backdrop" data-act="backdrop">'
        + '<section class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">'
        + '<header class="modal-head"><h3>' + esc(title) + '</h3>'
        + '<button class="x-btn" data-act="close-modal" aria-label="إغلاق">×</button></header>'
        + '<div class="modal-body">' + body + '</div>'
        + (footer ? '<footer class="modal-foot">' + footer + '</footer>' : '')
        + '</section></div>';
      var focusable = $('.modal .control, .modal button:not(.x-btn)');
      if (focusable) focusable.focus();
      if (typeof onMount === 'function') onMount();
    }

    function closeModal() {
      $('#modalRoot').innerHTML = '';
      if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
      lastFocused = null;
      modalDirty = false;
    }

    /** إغلاق عرضي فقط (Escape/نقر خارج النافذة) — يحذّر إن وُجد تغيير غير محفوظ، خلافًا لأزرار الإغلاق الصريحة. */
    function dismissModalIfConfirmed() {
      if (modalDirty && !window.confirm('لديك تغييرات لم تُحفظ في هذه النافذة. هل تريد إغلاقها دون حفظ؟')) return;
      closeModal();
    }

    /** حصر التركيز داخل النافذة المفتوحة عند الضغط على Tab — لا يترك التركيز يهرب إلى عناصر الصفحة خلف النافذة. */
    function trapModalFocus(event) {
      if (event.key !== 'Tab') return;
      var modal = $('.modal');
      if (!modal) return;
      var items = Array.prototype.slice.call(
        modal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')
      ).filter(function (el) { return el.offsetParent !== null; });
      if (!items.length) return;
      var first = items[0], last = items[items.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault(); last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault(); first.focus();
      }
    }

    function restoreSession() {
      if (!state.token) { renderLogin(); return; }
      $('#root').innerHTML = '<main class="boot"><div><div class="spin"></div>'

      // جولة واحدة بدل ثلاث: بيانات البوابة + المصادر المرجعية معًا.
      api('getPortalBundle', state.token, '', {}).then(function (bundle) {
        adoptPortalBundle(bundle);
        render();
        if (state.data.role === 'ADMIN') fetchActivitiesBundle();
      }, function (error) {
        // الجلسة صالحة لكن الخادم يرفضها لأنها مُلزَمة بتغيير كلمة مرور
        // مؤقتة أولًا — لا تُسقِط التوكن، اعرض شاشة التغيير الإلزامي.
        var message = (error && error.message) || '';
        if (message.indexOf('يجب تغيير كلمة المرور') >= 0) {

    /**
     * يستوعب حزمة البوابة المُجمَّعة (getPortalBundle): بيانات البوابة +
     * المصادر المرجعية + صفحة القسم المطلوب — كلها من جولة واحدة.
     */
    function adoptPortalBundle(bundle) {
      if (!bundle) return;
      if (bundle.bootstrap) {
        state.data = bundle.bootstrap;
        state.user = bundle.bootstrap.user || {role: bundle.bootstrap.role, name: 'المستخدم'};
      }
      if (bundle.referenceData) {
        state.referenceData = bundle.referenceData;
        state.referenceError = '';
      }
      if (bundle.page && bundle.pageData) {
        state.lazy[bundle.page] = Object.assign({loading: false}, bundle.pageData);
      }
    }

    /**
     * تُجلب مرة واحدة لكل جلسة وتُخزَّن في الذاكرة — لا تُعاد مع كل تنقّل.
     * الفشل لم يعد صامتًا: القوائم المعتمدة صارت مضمَّنة في الخادم وجاهزة
     * دائمًا، فإخفاق تحميلها يعني خللًا حقيقيًا يستحق رسالة وزر إعادة
     * محاولة في النماذج، لا سقوطًا صامتًا إلى حقول نصية حرة.
     */
    function loadReferenceDataOnce(force) {
      if (state.referenceData && !force) return;
      state.referenceLoading = true;
      // إعادة الرسم فقط إن كانت هناك شاشة حيّة تعتمد على هذه القوائم —
      // لا تُقاطع استعادة جلسة قيد التنفيذ ولا تستبدل شاشة الإقلاع.
      var refresh = function () {
        if (state.screen === 'apply' || state.data) render();
      };
      api('getReferenceData', state.token).then(function (data) {
        state.referenceLoading = false;
        if (data && data.ready) {
          state.referenceData = data;
          state.referenceError = '';
        } else {
          state.referenceError = 'تعذّر تحميل القوائم المعتمدة (المناطق والمدن والتصنيفات).';
        }
        refresh();
      }, function (error) {
        state.referenceLoading = false;
        state.referenceError = (error && error.message) || 'تعذّر تحميل القوائم المعتمدة.';
        refresh();
      });
    }

    /**
     * لا تمنع الرابط الأصلي tel: من العمل — لكن iframe الخاص بـ Apps
     * Script قد يحجب فتح تطبيق الاتصال دون أي خطأ ظاهر. إن لم يغادر
     * المتصفح الصفحة خلال مهلة قصيرة (بلا blur)، نفترض أن الفتح
     * حُجب، وننسخ الرقم تلقائيًا كبديل واضح بدل فشل صامت.
     */
    function handleCallFallback(phone) {
      var left = false;
      var onBlur = function () { left = true; window.removeEventListener('blur', onBlur); };
      window.addEventListener('blur', onBlur);
      setTimeout(function () {
        window.removeEventListener('blur', onBlur);
        if (left) return;
        copyToClipboard(phone).then(function (copied) {
          toast(copied ? ('تعذّر فتح تطبيق الاتصال — نُسخ الرقم ' + phone + ' تلقائيًا.')
            : ('تعذّر فتح تطبيق الاتصال. الرقم: ' + phone), copied ? 'success' : 'error');
        });
      }, 700);
    }

    /** بديل صريح دائم الظهور لنسخ الرقم — لا ينتظر فشل tel:/واتساب أولًا كما في handleCallFallback. */
    function handleCopyPhone(phone) {
      copyToClipboard(phone).then(function (copied) {
        toast(copied ? ('تم نسخ الرقم ' + phone) : ('تعذّر نسخ الرقم. الرقم: ' + phone), copied ? 'success' : 'error');
      });
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
      }
      try {
        var area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        var ok = document.execCommand('copy');
        area.remove();
        return Promise.resolve(ok);
      } catch (error) {
        return Promise.resolve(false);
      }
    }

    document.addEventListener('click', function (event) {
      var backdrop = event.target.classList && event.target.classList.contains('backdrop');
      if (backdrop) { dismissModalIfConfirmed(); return; }
      var el = event.target.closest ? event.target.closest('[data-act]') : null;
      if (!el) return;
      var action = el.getAttribute('data-act');
      if (action === 'backdrop' || action === 'set-search' || action === 'set-filter'
        || action === 'bulk-file' || action === 'proof-file' || action === 'license-file') return;
      if (action === 'call-fallback') { handleCallFallback(el.getAttribute('data-phone')); return; }
      var handler = CLICK_ACTIONS[action];
      if (!handler) return;
      event.preventDefault();
      state.activeTrigger = el;
      handler(el);
    });

    var searchTimer = null;
    document.addEventListener('input', function (event) {
      var el = event.target;
      if (el && (el.id === 'f_lat' || el.id === 'f_lng')) {
        var sourceField = $('#f_locationSource');
        if (sourceField) sourceField.value = 'يدوي';
        updateLocationCoordsHint();
        return;
      }
      if (el && el.id === 'f_emailLocal') { splitPastedEmail(el); return; }
      if (!el.getAttribute || el.getAttribute('data-act') !== 'set-search') return;
      var value = el.value;
      window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(function () {
        state.search = value;
        if (LAZY_PAGES[state.page]) { fetchLazyPage(state.page, LAZY_PAGES[state.page], 1); return; }
        render();
        var box = $('#searchBox');
        if (box) {
          box.focus();
          box.setSelectionRange(box.value.length, box.value.length);
        }
      }, 220);
    });

    document.addEventListener('change', function (event) {
      var el = event.target;
      var action = el.getAttribute ? el.getAttribute('data-act') : null;
      if (action === 'set-filter') {
        state.filter = el.value;
        if (LAZY_PAGES[state.page]) { fetchLazyPage(state.page, LAZY_PAGES[state.page], 1); return; }
        render();
        return;
      }
      if (action === 'set-assoc-filter') {
        state.assocFilter = el.value;
        if (LAZY_PAGES[state.page]) { fetchLazyPage(state.page, LAZY_PAGES[state.page], 1); return; }
        render();
        return;
      }
      if (action === 'set-sort') {
        state.sortBy = el.value;
        state.sortDir = 'asc';
        if (LAZY_PAGES[state.page]) { fetchLazyPage(state.page, LAZY_PAGES[state.page], 1); return; }
        render();
        return;
      }
      if (action === 'bulk-file') { handleBulkFile(el); return; }
      if (action === 'proof-file') { handleProofFile(el); return; }
      if (action === 'delivery-gate') { updateDeliveryGate(); return; }
      if (action === 'region-select') { onRegionChange(el); return; }
      if (action === 'license-file') { handleLicenseFile(el); return; }
      if (action === 'email-domain') { toggleEmailOtherDomain(); return; }
      if (action === 'pledge-gate') { updatePledgeGate(); return; }
    });

    /** يعيد تعبئة قائمة المدن فور اختيار المنطقة، ويقفلها إن لم تُختر منطقة بعد. */
    function onRegionChange(regionSelect) {
      var citySelect = document.getElementById(regionSelect.getAttribute('data-city-target'));
      if (!citySelect) return;
      var ref = state.referenceData;
      var cities = (ref && ref.citiesByRegion[regionSelect.value]) || [];
      citySelect.innerHTML = optionList(cities, '', cities.length ? '— اختر المدينة —' : '— اختر المنطقة أولًا —');
      citySelect.disabled = !cities.length;
    }

    document.addEventListener('submit', function (event) {
      var form = event.target;
      var action = form.getAttribute && form.getAttribute('data-act');
      if (!action) return;
      state.activeTrigger = form;
      if (action === 'submit-login') { event.preventDefault(); submitLogin(form); return; }
      if (action === 'submit-application') { event.preventDefault(); submitApplication(form); return; }
      if (action === 'submit-force-password') { event.preventDefault(); submitForcePasswordChange(form); return; }
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && $('#modalRoot').innerHTML) { dismissModalIfConfirmed(); return; }
      if (event.key === 'Tab' && $('#modalRoot').innerHTML) trapModalFocus(event);
    });

    // يُسجَّل التغيير فقط داخل نافذة مفتوحة فعليًا — نوافذ العرض فقط (بلا
    // حقول) لا تصبح أبدًا "متغيّرة" فلا تُحذِّر عند إغلاقها عرضيًا.
    document.addEventListener('input', function (event) {
      if (event.target.closest && event.target.closest('.modal')) modalDirty = true;
    });
    document.addEventListener('change', function (event) {
      if (event.target.closest && event.target.closest('.modal')) modalDirty = true;
    });

    /* ============================================================
       16) الإقلاع
       ============================================================ */

    window.__zadReady = true;
    restoreSession();
    // القوائم المعتمدة متاحة للزوّار بلا جلسة (نموذج تقديم الجمعيات
    // العام يحتاجها)، وتُجلب مرة واحدة فقط عند الإقلاع فتكون جاهزة قبل
    // أن يفتح الزائر النموذج بدل أن يراه بحقول نصية ثم يتغيّر تحته.
    if (!state.token) loadReferenceDataOnce();
  </script>
</body>
</html>
