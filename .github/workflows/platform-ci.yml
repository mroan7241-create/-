name: platform-ci

on:
  push:
    branches: [platform/node-migration, release/applicant-step1-20260921]
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-ci.yml']

# لا Deploy في هذا الـworkflow إطلاقًا — build/lint/test فقط.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alzad_ci
          POSTGRES_PASSWORD: alzad_ci_password
          POSTGRES_DB: alzad_platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alzad_ci -d alzad_platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://alzad_ci:alzad_ci_password@localhost:5432/alzad_platform_ci?schema=public
      NODE_ENV: test
      ALLOW_DESTRUCTIVE_E2E: 'true'
      E2E_ALLOWED_DATABASE_NAMES: alzad_platform_ci
      E2E_ALLOWED_BUCKET_NAMES: alzad-platform-test

      # Use the same isolated S3 HTTP harness as local E2E; suites retain all storage assertions.
      OBJECT_STORAGE_EXTERNAL: 'false'
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9401
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY: S3RVER
      OBJECT_STORAGE_SECRET_KEY: S3RVER
      OBJECT_STORAGE_BUCKET: alzad-platform-test
      OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: install
        run: npm ci --workspaces --include-workspace-root

      - name: dependency tree
        run: npm ls --all=false

      - name: prisma validate
        run: npm run prisma:validate --workspace packages/db

      - name: provision Supabase-compatible NOLOGIN roles in isolated CI PostgreSQL
        run: npx ts-node --transpile-only apps/api/test/utils/init-test-db-roles.ts
        env:
          E2E_INIT_CANARY: 'true'

      - name: prisma migrate deploy (against CI PostgreSQL — schema only, no data)
        run: npm run migrate:deploy --workspace packages/db

      - name: provision E2E canary in isolated CI database
        run: npx ts-node --transpile-only apps/api/test/utils/create-test-canary.ts
        env:
          E2E_INIT_CANARY: 'true'

      - name: verify E2E safety before any seed or cleanup
        run: npm run test:e2e --workspace apps/api -- --runInBand test/safety-preflight.e2e-spec.ts

      - name: seed CI database (idempotent — reference data + dev/test fixtures)
        run: npm run db:seed

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: unit + integration tests
        run: npm run test

      # NODE-2: تأكيدات على مستوى قاعدة البيانات نفسها — ذرّية عدّاد
      # public_code تحت تزامن حقيقي، والفهارس الفريدة الجزئية التي تحلّ
      # محلّ LockService القديم. تُشغَّل صراحةً قبل بقية e2e لأنها أسرع
      # إشارة إلى كسر بنيوي في المخطط أو الهجرات.
      - name: DB-level tests (atomic public codes + partial unique indexes + concurrency)
        run: npm run test:e2e --workspace apps/api -- test/association-applications-db.e2e-spec.ts

      # NODE-2: تكامل تخزين حقيقي ضد خادم S3 الاختباري (لا mock): رفع، رابط
      # موقَّع يُجلَب فعليًا بالبايتات، حذف تعويضي، ولا كائن يتيم بعد فشل
      # معاملة قاعدة البيانات.
      - name: storage integration tests (isolated S3 HTTP server)
        run: npm run test:e2e --workspace apps/api -- test/storage-integration.e2e-spec.ts

      # اختبارات API e2e/تكامل حقيقية (NODE-1: مصادقة/جلسات/بيانات مرجعية،
      # NODE-2: طلبات الانضمام/إدارة الجمعيات/التخزين) ضد PostgreSQL CI
      # نفسها بعد migrate+seed أعلاه — --runInBand لأنها تشارك قاعدة بيانات
      # حقيقية واحدة عبر HTTP حقيقي (supertest + Nest app كامل)، لا mocks.
      - name: API e2e / integration tests (NODE-1 + NODE-2)
        run: npm run test:e2e --workspace apps/api

      - name: build all workspaces
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
